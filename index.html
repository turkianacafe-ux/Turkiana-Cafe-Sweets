<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Turkiana • Ottoman Nights 1447</title>
    <meta name="description" content="Premium Turkish coffee & Ottoman sweets in Doha.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --night: #06090f;
            --deep: #0d1220;
            --surface: rgba(13,18,32,0.55);
            --surface-hover: rgba(18,24,42,0.8);
            --text: #f0e6d0;
            --muted: #8a7b6a;
            --soft: #c4ad8e;
            --gold-dim: #9a7a40;
            --gold: #c9973d;
            --gold-bright: #e8b96a;
            --gold-glow: rgba(201,151,61,0.22);
            --border: rgba(201,151,61,0.18);
            --border-hover: rgba(201,151,61,0.45);
            --radius-sm: 14px;
            --radius: 22px;
            --radius-lg: 36px;
            --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
            --font-body: 'DM Sans', system-ui, sans-serif;
            --font-ar: 'Scheherazade New', serif;
            --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
            --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --blur: blur(18px) saturate(160%);
        }

        body.light {
            --night: #f5ede0;
            --deep: #ede3d4;
            --surface: rgba(245,237,224,0.65);
            --surface-hover: rgba(235,225,210,0.9);
            --text: #1e1208;
            --muted: #7a6553;
            --soft: #5c4835;
            --gold-dim: #8a6520;
            --gold: #a0720e;
            --gold-bright: #c08a20;
            --gold-glow: rgba(160,114,14,0.15);
            --border: rgba(160,114,14,0.2);
            --border-hover: rgba(160,114,14,0.5);
        }

        html { scroll-behavior: smooth; }

        body {
            background: var(--night);
            font-family: var(--font-body);
            color: var(--text);
            overflow-x: hidden;
            min-height: 100dvh;
            transition: background 0.4s, color 0.4s;
            -webkit-font-smoothing: antialiased;
        }

        body[dir="rtl"] { font-family: var(--font-ar); }

        /* ── Canvas BG ── */
        #canvas-bg {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; display: block;
        }

        /* ── HEADER ── */
        .site-header {
            position: relative; z-index: 50;
            text-align: center;
            padding: 64px 24px 32px;
        }

        .header-ornament {
            display: flex; align-items: center; justify-content: center;
            gap: 16px; margin-bottom: 20px;
        }

        .ornament-line {
            height: 1px; width: 80px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
        }

        .ornament-diamond {
            width: 8px; height: 8px;
            background: var(--gold);
            transform: rotate(45deg);
            box-shadow: 0 0 12px var(--gold-glow);
        }

        .site-title {
            font-family: var(--font-display);
            font-size: clamp(3.2rem, 10vw, 7rem);
            font-weight: 300;
            letter-spacing: 0.25em;
            color: var(--text);
            line-height: 1;
            text-transform: uppercase;
        }

        .site-title span {
            background: linear-gradient(135deg, var(--gold-dim) 0%, var(--gold-bright) 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .site-sub {
            font-family: var(--font-display);
            font-style: italic;
            font-size: clamp(0.9rem, 2.5vw, 1.15rem);
            color: var(--soft);
            letter-spacing: 0.1em;
            margin-top: 10px;
        }

        /* ── CONTROLS (top right) ── */
        .controls {
            position: fixed; top: 20px; right: 20px;
            display: flex; gap: 10px; z-index: 300;
            padding: 8px;
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 60px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .ctrl {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--soft);
            font-size: 1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.25s var(--ease);
            font-family: var(--font-body);
            font-weight: 500;
            letter-spacing: 0.02em;
        }

        .ctrl:hover {
            background: var(--gold);
            color: var(--night);
            border-color: var(--gold);
            transform: scale(1.1);
            box-shadow: 0 0 18px var(--gold-glow);
        }

        .ctrl:active { transform: scale(0.96); }

        /* ── CATEGORY BAR ── */
        .cat-wrapper {
            position: sticky; top: 12px; z-index: 200;
            padding: 0 20px;
            margin-bottom: 36px;
        }

        .cat-bar {
            display: flex; gap: 8px;
            overflow-x: auto; scrollbar-width: none;
            padding: 10px 14px;
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 60px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }

        .cat-bar::-webkit-scrollbar { display: none; }

        .cat-btn {
            flex-shrink: 0;
            padding: 9px 22px;
            border-radius: 40px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            font-family: var(--font-body);
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.3s var(--ease);
            white-space: nowrap;
        }

        .cat-btn:hover {
            color: var(--soft);
            border-color: var(--border);
        }

        .cat-btn.active {
            background: linear-gradient(135deg, var(--gold-dim), var(--gold));
            color: var(--night);
            border-color: transparent;
            box-shadow: 0 4px 20px var(--gold-glow);
            font-weight: 500;
        }

        /* ── GRID ── */
        .menu-container {
            position: relative; z-index: 10;
            padding: 0 20px 160px;
            max-width: 1280px;
            margin: 0 auto;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 28px;
        }

        /* ── CARDS ── */
        .menu-card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
            transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease), border-color 0.3s;
            opacity: 0;
            transform: translateY(28px);
            will-change: transform, opacity;
        }

        .menu-card.visible {
            animation: cardReveal 0.65s var(--ease) forwards;
        }

        @keyframes cardReveal {
            to { opacity: 1; transform: translateY(0); }
        }

        .menu-card:hover {
            transform: translateY(-6px) scale(1.012);
            box-shadow: 0 24px 70px rgba(0,0,0,0.5), 0 0 40px var(--gold-glow);
            border-color: var(--border-hover);
        }

        .menu-card:active { transform: scale(0.98); }

        .card-figure {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
        }

        .card-figure img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.8s var(--ease);
            display: block;
        }

        .menu-card:hover .card-figure img {
            transform: scale(1.07);
        }

        .card-figure::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 45%, rgba(6,9,15,0.72) 100%);
            pointer-events: none;
        }

        .card-price-badge {
            position: absolute;
            bottom: 14px; right: 14px;
            background: rgba(6,9,15,0.75);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-hover);
            border-radius: 30px;
            padding: 5px 14px;
            font-family: var(--font-display);
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gold-bright);
            letter-spacing: 0.03em;
            z-index: 1;
        }

        .card-body {
            padding: 18px 20px 22px;
        }

        .card-name {
            font-family: var(--font-display);
            font-size: 1.45rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.25;
            margin-bottom: 4px;
            letter-spacing: 0.01em;
        }

        .card-name-ar {
            font-family: var(--font-ar);
            font-size: 0.95rem;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.82rem;
            color: var(--muted);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-footer {
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .card-cals {
            font-size: 0.75rem;
            color: var(--muted);
            letter-spacing: 0.04em;
        }

        .card-diet {
            display: flex; gap: 5px;
        }

        .diet-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
        }

        .dot-vegan { background: #4ade80; }
        .dot-dairy { background: #60a5fa; }
        .dot-nuts  { background: #fb923c; }
        .dot-gluten { background: #a78bfa; }

        /* ── SEARCH ── */
        .search-float {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%);
            width: min(520px, calc(100% - 32px));
            z-index: 400;
        }

        .search-box {
            display: flex; align-items: center; gap: 14px;
            padding: 14px 20px;
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: 60px;
            box-shadow: 0 16px 50px rgba(0,0,0,0.5);
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-box:focus-within {
            border-color: var(--border-hover);
            box-shadow: 0 16px 50px rgba(0,0,0,0.5), 0 0 0 3px var(--gold-glow);
        }

        .search-icon { color: var(--gold-dim); font-size: 0.95rem; flex-shrink: 0; }

        #searchInput {
            flex: 1; min-width: 0;
            background: none; border: none; outline: none;
            color: var(--text);
            font-family: var(--font-body);
            font-size: 0.95rem;
        }

        #searchInput::placeholder { color: var(--muted); }

        #clearBtn {
            background: none; border: none;
            color: var(--muted); font-size: 1.1rem;
            cursor: pointer; display: none;
            padding: 0 2px;
            transition: color 0.2s;
        }

        #clearBtn:hover { color: var(--gold); }

        /* ── MODAL ── */
        dialog {
            border: none; background: transparent;
            max-width: 680px; width: calc(100% - 24px);
            margin: auto; padding: 0;
            max-height: calc(100dvh - 24px);
            overflow: visible;
        }

        dialog::backdrop {
            background: rgba(4,6,12,0.85);
            backdrop-filter: blur(6px);
        }

        .modal-shell {
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), 0 0 0 1px var(--border);
            animation: modalIn 0.4s var(--ease-spring);
        }

        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.94) translateY(16px); }
            to   { opacity: 1; transform: scale(1) translateY(0); }
        }

        .modal-img-wrap {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }

        .modal-img-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }

        .modal-img-wrap::after {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(6,9,15,0.85) 100%);
        }

        .modal-close {
            position: absolute; top: 14px; right: 14px; z-index: 10;
            width: 40px; height: 40px;
            background: rgba(6,9,15,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 50%;
            color: var(--soft);
            font-size: 1.1rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .modal-close:hover {
            background: var(--gold);
            color: var(--night);
            transform: scale(1.1) rotate(90deg);
        }

        .modal-scroll {
            overflow-y: auto;
            max-height: 55vh;
        }

        .modal-body {
            padding: 24px 26px 28px;
        }

        .modal-title {
            font-family: var(--font-display);
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 400;
            color: var(--text);
            line-height: 1.15;
        }

        .modal-title-ar {
            font-family: var(--font-ar);
            font-size: 1.2rem;
            color: var(--muted);
            margin-top: 4px;
        }

        .modal-price {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 600;
            background: linear-gradient(135deg, var(--gold), var(--gold-bright));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 12px 0;
        }

        .modal-desc {
            font-size: 0.9rem;
            color: var(--soft);
            line-height: 1.7;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .detail-cell {
            background: rgba(201,151,61,0.07);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 14px;
        }

        .detail-label {
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--soft);
        }

        .milk-section {
            margin-top: 18px;
            padding: 16px;
            background: rgba(201,151,61,0.06);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
        }

        .milk-title {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .milk-chips {
            display: flex; flex-wrap: wrap; gap: 6px;
        }

        .milk-chip {
            padding: 5px 13px;
            border: 1px solid var(--border);
            border-radius: 30px;
            font-size: 0.78rem;
            color: var(--soft);
            background: transparent;
            transition: all 0.2s;
            cursor: pointer;
        }

        .milk-chip:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .reco-section {
            padding: 0 26px 26px;
        }

        .reco-title {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .reco-chips {
            display: flex; flex-wrap: wrap; gap: 8px;
        }

        .reco-chip {
            padding: 8px 18px;
            background: rgba(201,151,61,0.08);
            border: 1px solid var(--border);
            border-radius: 40px;
            font-size: 0.82rem;
            color: var(--soft);
            cursor: pointer;
            transition: all 0.25s var(--ease);
        }

        .reco-chip:hover {
            background: var(--gold);
            color: var(--night);
            border-color: var(--gold);
            transform: translateY(-1px);
        }

        /* ── QR MODAL ── */
        #qr-modal-content {
            text-align: center;
            padding: 44px 36px;
            background: var(--surface);
            backdrop-filter: var(--blur);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            animation: modalIn 0.4s var(--ease-spring);
        }

        #qr-modal-title {
            font-family: var(--font-display);
            font-size: 2rem;
            font-weight: 400;
            color: var(--gold);
            margin-bottom: 8px;
        }

        #qrCanvas {
            display: block;
            margin: 24px auto;
            background: white;
            padding: 16px;
            border-radius: 18px;
        }

        /* ── FOOTER ── */
        footer {
            position: relative; z-index: 10;
            text-align: center;
            padding: 72px 24px 56px;
            border-top: 1px solid var(--border);
        }

        .footer-brand {
            font-family: var(--font-display);
            font-size: clamp(2.5rem, 8vw, 4.5rem);
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            background: linear-gradient(135deg, var(--gold-dim), var(--gold-bright), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .footer-details {
            margin-top: 16px;
            font-size: 0.85rem;
            color: var(--muted);
            letter-spacing: 0.06em;
            line-height: 2;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 0;
            color: var(--muted);
        }

        .empty-icon {
            font-size: 3rem; opacity: 0.3; margin-bottom: 16px;
        }

        .empty-text {
            font-family: var(--font-display);
            font-size: 1.4rem;
            font-weight: 300;
            font-style: italic;
        }

        /* ── MOBILE ── */
        @media (max-width: 600px) {
            .site-header { padding: 52px 20px 24px; }
            .controls { top: 12px; right: 12px; padding: 6px; gap: 7px; }
            .ctrl { width: 40px; height: 40px; font-size: 0.85rem; }
            .cat-wrapper { padding: 0 12px; top: 8px; margin-bottom: 24px; }
            .cat-bar { padding: 8px 10px; gap: 6px; }
            .cat-btn { padding: 8px 16px; font-size: 0.78rem; }
            .menu-container { padding: 0 12px 160px; }
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
            .card-body { padding: 13px 14px 16px; }
            .card-name { font-size: 1.1rem; }
            .card-desc { -webkit-line-clamp: 1; }
            .card-footer { margin-top: 10px; padding-top: 10px; }
            .detail-grid { grid-template-columns: repeat(2, 1fr); }
            dialog { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 0; }
            dialog::backdrop { background: rgba(4,6,12,0.8); }
            .modal-shell { border-radius: var(--radius-lg) var(--radius-lg) 0 0; }
            .modal-scroll { max-height: 60vh; }
            .search-float { bottom: 20px; width: calc(100% - 24px); }
        }

        @media (max-width: 380px) {
            .menu-grid { grid-template-columns: 1fr; }
            .card-figure { aspect-ratio: 16/9; }
        }

        @media (min-width: 900px) {
            .menu-grid { grid-template-columns: repeat(3, 1fr); }
        }

        @media (min-width: 1200px) {
            .menu-grid { grid-template-columns: repeat(4, 1fr); }
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 10px; }

        /* ── TRANSITIONS ── */
        .grid-fade { transition: opacity 0.2s var(--ease); }
        .grid-fade.fading { opacity: 0; }

        /* ── LOADING SHIMMER ── */
        @keyframes shimmer {
            0%   { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .shimmer-card {
            border-radius: var(--radius-lg);
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--border);
            height: 320px;
            background: linear-gradient(90deg, var(--surface) 25%, rgba(201,151,61,0.06) 50%, var(--surface) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>

    <div class="controls">
        <button id="themeBtn" class="ctrl" aria-label="Toggle theme">🌙</button>
        <button id="langBtn" class="ctrl" aria-label="Switch language">EN</button>
        <button id="qrBtn" class="ctrl" aria-label="QR menu"><i class="fas fa-qrcode"></i></button>
    </div>

    <header class="site-header">
        <div class="header-ornament">
            <div class="ornament-line"></div>
            <div class="ornament-diamond"></div>
            <div class="ornament-line"></div>
        </div>
        <h1 class="site-title"><span>Turkiana</span></h1>
        <p class="site-sub">Ottoman Nights &nbsp;·&nbsp; 1447</p>
    </header>

    <div class="cat-wrapper">
        <nav class="cat-bar" id="catBar" aria-label="Menu categories"></nav>
    </div>

    <div class="menu-container">
        <div class="menu-grid grid-fade" id="grid"></div>
    </div>

    <div class="search-float">

        {"id":"grill3","categoryId":"grill","nameEn":"French Fries","nameAr":"بطاطس مقلية","descriptionEn":"Golden crispy fries.","price":29,"image":"Patatas.jpg","calories":"340 kcal","dietary":["vegan"]},
        {"id":"grill4","categoryId":"grill","nameEn":"Potato Wedges","nameAr":"بطاطس ويدجز","descriptionEn":"Thick-cut wedges.","price":32,"image":"Wedges.webp","calories":"380 kcal","dietary":["vegetarian"]}
      ]
    }
    </script>

    <script>
    (function () {
        const IMAGE_BASE = 'https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/';
        const data = JSON.parse(document.getElementById('menuData').textContent);

        let lang = localStorage.getItem('tk_lang') || 'en';
        let activeCat = 'all';
        let searchQ = '';

        const $ = id => document.getElementById(id);
        const els = {
            grid: $('grid'), catBar: $('catBar'),
            searchInput: $('searchInput'), clearBtn: $('clearBtn'),
            modal: $('modal'), modalImg: $('modalImg'),
            modalBody: $('modalBody'), recoSection: $('recoSection'),
            modalClose: $('modalClose'),
            themeBtn: $('themeBtn'), langBtn: $('langBtn'),
            qrBtn: $('qrBtn'), qrModal: $('qrModal'),
            qrCanvas: $('qrCanvas'), closeQrBtn: $('closeQrBtn')
        };

        /* ─── THREE.JS BACKGROUND ─── */
        const canvas = document.getElementById('canvas-bg');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x06090f);
        scene.fog = new THREE.FogExp2(0x06090f, 0.0018);
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);

        scene.add(new THREE.AmbientLight(0x303050, 1));
        const dirLight = new THREE.DirectionalLight(0xffe0aa, 1.0);
        dirLight.position.set(-4, 10, 6);
        scene.add(dirLight);

        /* Moon */
        const moonGroup = new THREE.Group();
        const moonMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.2, 64, 64),
            new THREE.MeshStandardMaterial({ color: 0xf0e0b0, emissive: 0x221800, roughness: 0.6 })
        );
        moonGroup.add(moonMesh);
        const darkMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.0, 64, 64),
            new THREE.MeshStandardMaterial({ color: 0x06090f, emissive: 0x06090f })
        );
        darkMesh.position.set(1.4, 0.2, 0.3);
        moonGroup.add(darkMesh);
        const moonLight = new THREE.PointLight(0xffcc77, 1.2, 28);
        moonGroup.add(moonLight);

        // Glow halo
        const haloC = document.createElement('canvas'); haloC.width = haloC.height = 64;
        const hCtx = haloC.getContext('2d');
        const hGrad = hCtx.createRadialGradient(32,32,0,32,32,32);
        hGrad.addColorStop(0,'rgba(255,230,160,0.7)'); hGrad.addColorStop(0.5,'rgba(180,120,50,0.15)'); hGrad.addColorStop(1,'rgba(0,0,0,0)');
        hCtx.fillStyle = hGrad; hCtx.fillRect(0,0,64,64);
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(haloC), blending: THREE.AdditiveBlending }));
        halo.scale.set(5,5,1);
        moonGroup.add(halo);
        moonGroup.position.set(-6, 5, -15);
        scene.add(moonGroup);

        /* Lanterns */
        function mkLantern(pos) {
            const g = new THREE.Group();
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xccaa66, roughness: 0.35, metalness: 0.75 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xff9933, emissive: 0x441100, transparent: true, opacity: 0.28 });
            g.add(Object.assign(new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 1.5, 14), glassMat)));
            [0.8, -0.8].forEach(y => {
                const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.75, 0.12, 8), metalMat);
                cap.position.y = y; g.add(cap);
            });
            [0.25,-0.25].forEach(y => {
                const ring = new THREE.Mesh(new THREE.TorusGeometry(0.68,0.035,8,20), new THREE.MeshStandardMaterial({color:0xaa8844}));
                ring.rotation.x = Math.PI/2; ring.position.y = y; g.add(ring);
            });
            const fc = document.createElement('canvas'); fc.width = fc.height = 32;
            const ft = new THREE.CanvasTexture(fc);
            const fs = new THREE.Sprite(new THREE.SpriteMaterial({ map: ft, blending: THREE.AdditiveBlending }));
            fs.scale.set(0.45,0.6,0.45); fs.position.y = 0.18; g.add(fs);
            const pl = new THREE.PointLight(0xff9922, 1.6, 7);
            pl.position.y = 0.2; g.add(pl);
            g.position.copy(pos);
            return { g, fc, ft, pl };
        }

        const lanterns = [
            new THREE.Vector3(-5,1.5,-5), new THREE.Vector3(2,2,-8),
            new THREE.Vector3(6,1.2,-4), new THREE.Vector3(-3,2.5,2),
            new THREE.Vector3(4,1.8,0), new THREE.Vector3(-6,2.2,2)
        ].map(p => { const l = mkLantern(p); scene.add(l.g); return l; });

        /* Particles */
        const pCount = 1000;
        const pPos = new Float32Array(pCount * 3);
        const pCol = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) {
            const r = 12 + Math.random()*15, theta = Math.random()*Math.PI*2, phi = Math.acos(2*Math.random()-1);
            pPos[i*3]   = Math.sin(phi)*Math.cos(theta)*r;
            pPos[i*3+1] = Math.sin(phi)*Math.sin(theta)*r*0.4;
            pPos[i*3+2] = Math.cos(phi)*r - 5;
            const g = 0.65 + Math.random()*0.45;
            pCol[i*3] = g; pCol[i*3+1] = g*0.55; pCol[i*3+2] = 0.05;
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos,3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol,3));
        const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
            size:0.15, vertexColors:true, transparent:true, blending:THREE.AdditiveBlending
        }));
        scene.add(particles);

        /* Stars */
        const sPos = [];
        for (let i=0;i<700;i++) sPos.push((Math.random()-.5)*200,(Math.random()-.5)*200,(Math.random()-.5)*200-50);
        const stars = new THREE.Points(
            Object.assign(new THREE.BufferGeometry(), {attributes:{position:new THREE.Float32BufferAttribute(sPos,3)}}),
            new THREE.PointsMaterial({color:0xffffff,size:0.18})
        );
        scene.add(stars);

        let mx = 0, my = 0;
        window.addEventListener('mousemove', e => {
            mx = (e.clientX/window.innerWidth-.5)*2;
            my = (e.clientY/window.innerHeight-.5)*2;
        });

        let flameFrame = 0;
        function animateBg() {
            requestAnimationFrame(animateBg);
            const t = performance.now()*.001;
            lanterns.forEach((l,i) => {
                l.g.position.y += Math.sin(t*.7+i)*.0012;
                l.g.position.x += Math.cos(t*.4+i)*.0008;
                l.g.rotation.y += .001;
            });
            if (flameFrame++ % 3 === 0) {
                lanterns.forEach(l => {
                    const ctx = l.fc.getContext('2d'); ctx.clearRect(0,0,32,32);
                    const r = 10+Math.random()*10;
                    const g2 = ctx.createRadialGradient(16,16,0,16,16,r);
                    g2.addColorStop(0,`rgba(255,190,90,${.85+Math.random()*.15})`);
                    g2.addColorStop(.5,'rgba(240,80,0,.7)');
                    g2.addColorStop(1,'rgba(0,0,0,0)');
                    ctx.fillStyle = g2; ctx.fillRect(0,0,32,32);
                    l.ft.needsUpdate = true;
                    l.pl.intensity = 1.1 + Math.random()*.6;
                });
            }
            stars.rotation.y += (mx*.015 - stars.rotation.y)*.008;
            stars.rotation.x += (my*.015 - stars.rotation.x)*.008;
            particles.rotation.y += (mx*.01 - particles.rotation.y)*.008;
            particles.rotation.x += (my*.008 - particles.rotation.x)*.008;
            renderer.render(scene, camera);
        }
        animateBg();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /* ─── DIETARY DOT HELPERS ─── */
        function dietDots(dietary) {
            if (!dietary || !dietary.length) return '';
            const map = { 'vegan':'dot-vegan','contains-dairy':'dot-dairy','contains-nuts':'dot-nuts','gluten-free':'dot-gluten' };
            return `<div class="card-diet">${dietary.map(d => map[d] ? `<span class="diet-dot ${map[d]}" title="${d}"></span>` : '').join('')}</div>`;
        }

        /* ─── TEMPERATURE ─── */
        function getTemp(item) {
            const n = item.nameEn.toLowerCase();
            if (n.includes('iced') || n.includes('cold brew') || n.includes('ice drip')) return '❄️ Iced';
            if (item.categoryId === 'refreshers') return '❄️ Cold';
            if (n.includes('classic turkish') || n.includes('double turkish') || n.includes('sahlep') || n.includes('arabic coffee')) return '☕ Hot';
            return '☕ Hot · ❄️ Iced';
        }

        /* ─── FILTERED ITEMS ─── */
        function getFiltered() {
            let items = data.items;
            if (activeCat !== 'all') items = items.filter(i => i.categoryId === activeCat);
            if (searchQ) {
                const q = searchQ.toLowerCase();
                items = items.filter(i =>
                    i.nameEn.toLowerCase().includes(q) ||
                    i.nameAr.includes(q) ||
                    i.descriptionEn.toLowerCase().includes(q)
                );
            }
            return items;
        }

        /* ─── RENDER CATEGORIES ─── */
        function renderCats() {
            els.catBar.innerHTML = data.categories.map(c => {
                const nm = lang === 'ar' ? c.nameAr : c.nameEn;
                return `<button class="cat-btn ${c.id === activeCat ? 'active' : ''}" data-id="${c.id}">${nm}</button>`;
            }).join('');
            els.catBar.querySelectorAll('.cat-btn').forEach(b => {
                b.addEventListener('click', () => {
                    activeCat = b.dataset.id;
                    renderCats();
                    switchGrid(getFiltered());
                });
            });
        }

        /* ─── INTERSECTION OBSERVER FOR SCROLL REVEALS ─── */
        const io = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    io.unobserve(entry.target);
                }
            });
        }, { threshold: 0.08 });

        /* ─── RENDER GRID ─── */
        function renderGrid(items) {
            els.grid.innerHTML = '';
            if (!items.length) {
                els.grid.innerHTML = `<div class="empty-state"><div class="empty-icon">☕</div><div class="empty-text">No items found…</div></div>`;
                return;
            }
            items.forEach((item, idx) => {
                const name = lang === 'ar' ? item.nameAr : item.nameEn;
                const nameAlt = lang === 'ar' ? item.nameEn : (item.nameAr || '');
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.style.animationDelay = Math.min(idx * 0.04, 0.8) + 's';
                card.innerHTML = `
                    <div class="card-figure">
                        <img src="${IMAGE_BASE}${item.image}" alt="${name}" loading="lazy">
                        <div class="card-price-badge">${item.price} QAR</div>
                    </div>
                    <div class="card-body">
                        <div class="card-name">${name}</div>
                        ${nameAlt ? `<div class="card-name-ar">${nameAlt}</div>` : ''}
                        <div class="card-desc">${item.descriptionEn}</div>
                        <div class="card-footer">
                            <span class="card-cals">${item.calories}</span>
                            ${dietDots(item.dietary)}
                        </div>
                    </div>`;
                card.addEventListener('click', () => openModal(item));
                els.grid.appendChild(card);
                io.observe(card);
            });
        }

        /* ─── SWITCH GRID WITH FADE ─── */
        function switchGrid(items) {
            els.grid.classList.add('fading');
            setTimeout(() => {
                renderGrid(items);
                els.grid.classList.remove('fading');
            }, 180);
        }

        /* ─── MODAL ─── */
        function openModal(item) {
            const name = lang === 'ar' ? item.nameAr : item.nameEn;
            const nameAlt = lang === 'ar' ? item.nameEn : (item.nameAr || '');

            els.modalImg.innerHTML = `
                <img src="${IMAGE_BASE}${item.image}" alt="${name}">
                <button id="modalClose" class="modal-close" aria-label="Close"><i class="fas fa-times"></i></button>`;
            document.getElementById('modalClose').addEventListener('click', () => els.modal.close());

            const milk = (item.hasMilk || (item.dietary && item.dietary.includes('contains-dairy')))
                ? ['Full Fat', 'Low-Fat', 'Skim', 'Lactose Free', 'Oat', 'Almond', 'Soy', 'Coconut'] : [];

            const allergens = item.dietary?.length
                ? item.dietary.map(d => d.replace('contains-', '')).join(', ')
                : 'None';

            els.modalBody.innerHTML = `
                <div class="modal-title">${name}</div>
                ${nameAlt ? `<div class="modal-title-ar">${nameAlt}</div>` : ''}
                <div class="modal-price">${item.price} QAR</div>
                <p class="modal-desc">${item.descriptionEn}</p>
                <div class="detail-grid">
                    <div class="detail-cell"><div class="detail-label">Calories</div><div class="detail-value">${item.calories}</div></div>
                    <div class="detail-cell"><div class="detail-label">Allergens</div><div class="detail-value">${allergens}</div></div>
                    <div class="detail-cell"><div class="detail-label">Temperature</div><div class="detail-value">${getTemp(item)}</div></div>
                </div>
                ${milk.length ? `
                <div class="milk-section">
                    <div class="milk-title">🥛 Milk Options</div>
                    <div class="milk-chips">${milk.map(m=>`<span class="milk-chip">${m}</span>`).join('')}</div>
                </div>` : ''}`;

            const recos = data.items.filter(i => i.categoryId === item.categoryId && i.id !== item.id).slice(0, 4);
            if (recos.length) {
                els.recoSection.innerHTML = `
                    <div class="reco-title">You might also like</div>
                    <div class="reco-chips">${recos.map(r => `<span class="reco-chip" data-id="${r.id}">${lang==='ar'?r.nameAr:r.nameEn}</span>`).join('')}</div>`;
                els.recoSection.querySelectorAll('.reco-chip').forEach(c =>
                    c.addEventListener('click', () => openModal(data.items.find(i => i.id === c.dataset.id)))
                );
            } else els.recoSection.innerHTML = '';

            els.modal.showModal();
        }

        /* ─── EVENTS ─── */
        els.modal.addEventListener('click', e => { if (e.target === els.modal) els.modal.close(); });

        els.searchInput.addEventListener('input', () => {
            searchQ = els.searchInput.value.trim();
            els.clearBtn.style.display = searchQ ? 'block' : 'none';
            switchGrid(getFiltered());
        });

        els.clearBtn.addEventListener('click', () => {
            els.searchInput.value = '';
            searchQ = '';
            els.clearBtn.style.display = 'none';
            switchGrid(getFiltered());
        });

        els.themeBtn.addEventListener('click', () => {
            const isLight = document.body.classList.toggle('light');
            scene.background.set(isLight ? 0xf5ede0 : 0x06090f);
            scene.fog.color.set(isLight ? 0xf5ede0 : 0x06090f);
            els.themeBtn.textContent = isLight ? '☀️' : '🌙';
        });

        els.langBtn.addEventListener('click', () => {
            lang = lang === 'en' ? 'ar' : 'en';
            localStorage.setItem('tk_lang', lang);
            els.langBtn.textContent = lang.toUpperCase();
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            renderCats();
            switchGrid(getFiltered());
        });

        els.qrBtn.addEventListener('click', () => {
            const qr = qrcode(0, 'H');
            qr.addData(window.location.href);
            qr.make();
            const c = els.qrCanvas;
            const modules = qr.getModuleCount();
            c.width = c.height = modules * 8;
            qr.renderTo2dContext(c.getContext('2d'), 8);
            els.qrModal.showModal();
        });
        els.closeQrBtn.addEventListener('click', () => els.qrModal.close());

        /* Touch swipe on cat bar */
        let touchX = 0;
        els.catBar.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
        els.catBar.addEventListener('touchend', e => {
            const diff = e.changedTouches[0].clientX - touchX;
            if (Math.abs(diff) > 45) {
                const cats = data.categories.map(c => c.id);
                const idx = cats.indexOf(activeCat);
                if (diff < 0 && idx < cats.length-1) activeCat = cats[idx+1];
                else if (diff > 0 && idx > 0) activeCat = cats[idx-1];
                renderCats(); switchGrid(getFiltered());
            }
        }, { passive: true });

        /* ─── INIT ─── */
        renderCats();
        renderGrid(getFiltered());
        els.langBtn.textContent = lang.toUpperCase();
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
    </script>
</body>
</html>
