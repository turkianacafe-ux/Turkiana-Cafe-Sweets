        &quot;short_name&quot;:&quot;Turkiana&quot;,

        &quot;theme_color&quot;:&quot;#c7a05b&quot;,

    <style>
        :root {
            --bg: #0a0503;
            --surface: #1f130e;
            --text: #fdf3e0;
            --soft: #d4bc9a;
            --gold: #c7a05b;
            --accent: #e2b675;
            --border: #8b6b4a;
            --dietary-green: #4caf50;
          
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-heading: 'Playfair Display', serif;
            --font-ar: 'Scheherazade New', serif;
          
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in: cubic-bezier(0.32, 0, 0.67, 0);
        }
        body.light {
            --bg: #fbf3e8;
            --surface: #efe2d3;
            --text: #2d1f13;
            --soft: #5f4e3c;
            --gold: #b28b4b;
            --accent: #9e6d3e;
            --border: #b49b7b;
            --dietary-green: #388e3c;
        }
      
        * { margin:0; padding:0; box-sizing:border-box; }
      
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.2s;
        }
      
        body[dir="rtl"] { font-family: var(--font-ar); }
      
        .crescent {
            position: fixed;
            top: 12%;
            left: 50%;
            width: clamp(160px, 26vw, 260px);
            height: clamp(160px, 26vw, 260px);
            border-radius: 50%;
            background: radial-gradient(circle at 36% 38%, #ffe8b3 12%, #f9b81b 88%);
            box-shadow: 0 0 160px #ff9f1c;
            transform: translateX(-50%);
            z-index: 2;
            opacity: 0.68;
            animation: crescent-breath 18s ease-in-out infinite;
            pointer-events: none;
        }
      
        @keyframes crescent-breath {
            0%,100% { box-shadow: 0 0 140px #ff9f1c; transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 0 210px #ffb347; transform: translateX(-50%) scale(1.04); }
        }
      
        .lanterns {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
      
        .lantern {
            position: absolute;
            width: 82px;
            height: 124px;
            background: radial-gradient(circle at 30% 25%, #e89a4a, #8f3a1a);
            border-radius: 50% 50% 35% 35%;
            filter: drop-shadow(0 30px 50px #ff7a1f);
            animation: lantern-physics 14s linear infinite;
        }
      
        .lantern::before {
            content: '';
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 48px;
            background: linear-gradient(#c9a46b, #5c3f24);
        }
      
        .lantern::after {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 32px;
            background: #ffe8b3;
            border-radius: 50%;
            box-shadow: 0 0 40px #ffdd7a;
            animation: flame-flicker 1.4s infinite alternate ease-in-out;
        }
      
        .lantern .glass {
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 42px;
            background: rgba(255,255,255,0.32);
            border-radius: 40%;
            box-shadow: inset 0 0 28px #ffe8b3;
        }
      
        @keyframes lantern-physics {
            0% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-42px) rotate(6deg); }
            66% { transform: translateY(-26px) rotate(-5deg); }
            100% { transform: translateY(0) rotate(0deg); }
        }
      
        @keyframes flame-flicker {
            0% { transform: scale(1) translateY(0); opacity: 0.92; }
            100% { transform: scale(1.08) translateY(-4px); opacity: 1; }
        }
      
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
      
        .star {
            position: absolute;
            background: #fffbeb;
            border-radius: 50%;
            box-shadow: 0 0 14px #ffe070;
            animation: star-twinkle 5s infinite alternate ease-in-out;
        }
      
        @keyframes star-twinkle {
            0% { opacity: 0.35; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.35); }
        }
      
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffd700;
            animation: particleFade 1.2s linear forwards;
            pointer-events: none;
            z-index: 4;
        }
      
        @keyframes particleFade {
            0% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(3); }
        }
      
        .controls {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 14px;
            z-index: 300;
        }
      
        .ctrl {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(30,20,15,0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(199,160,91,0.3);
            color: var(--gold);
            font-size: 1.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease-out);
            cursor: pointer;
            min-width: 48px;
            min-height: 48px;
        }
      
        body.light .ctrl {
            background: rgba(240,230,215,0.82);
        }
      
        .ctrl:hover {
            transform: scale(1.12) rotate(8deg);
            background: var(--gold);
            color: #0a0503;
        }
      
        #backToTop { position: fixed; bottom: 100px; right: 24px; z-index: 300; }
      
        .cat-bar {
            position: sticky;
            top: 20px;
            z-index: 200;
            background: rgba(30,20,15,0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(199,160,91,0.25);
            border-radius: 9999px;
            padding: 14px 18px;
            margin: 0 20px 32px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        body.light .cat-bar {
            background: rgba(240, 230, 215, 0.92);
        }
        .cat-bar::-webkit-scrollbar { display: none; }
      
        .cat-btn {
            padding: 12px 28px;
            white-space: nowrap;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 500;
            transition: all 0.35s var(--ease-out);
            flex-shrink: 0;
            cursor: pointer;
            min-width: 48px;
            min-height: 48px;
        }
      
        .cat-btn.active,
        .cat-btn:hover {
            background: var(--gold);
            color: #0a0503;
            border-color: var(--gold);
            transform: translateY(-3px);
        }
      
        .carousel-container {
            perspective: 1600px;
            perspective-origin: 50% 40%;
            padding: 40px 0 120px;
            overflow: hidden;
            position: relative;
        }
      
        .carousel-track {
            display: flex;
            gap: 36px;
            padding: 40px 20px;
            will-change: transform;
            user-select: none;
            transform: translate3d(0,0,0);
            transition: transform 0.3s ease;
        }
      
        .dragging {
            transition: none;
        }
      
        .carousel-card {
            flex: 0 0 340px;
            background: var(--surface);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
            transform-style: preserve-3d;
            transition: box-shadow 0.4s var(--ease-out), transform 0.4s var(--ease-out), opacity 0.4s;
            cursor: pointer;
            position: relative;
            will-change: transform, opacity;
            opacity: 0;
            transform: translateY(50px) scale(0.9);
            touch-action: manipulation;
        }
      
        body.light .carousel-card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
      
        .carousel-card:active { cursor: grabbing; }
      
        .carousel-card .figure {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }
      
        .carousel-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.1s var(--ease-out);
            loading: lazy;
            decoding: async;
        }
      
        .carousel-card:hover img {
            transform: scale(1.09);
        }
      
        .carousel-card .content {
            padding: 26px 24px 28px;
        }
      
        .carousel-card .name {
            font-family: var(--font-heading);
            font-size: 1.55rem;
            color: var(--gold);
            margin-bottom: 8px;
        }
      
        .carousel-card .name-ar {
            font-family: var(--font-ar);
            font-size: 1.22rem;
            color: var(--soft);
            margin-bottom: 14px;
        }
      
        .carousel-card .desc {
            color: var(--soft);
            font-size: 0.95rem;
            line-height: 1.55;
        }
      
        .carousel-card .price {
            margin-top: 18px;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--accent);
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
      
        .dietary-tags {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }
      
        .dietary-tag {
            padding: 4px 10px;
            background: var(--dietary-green);
            color: white;
            border-radius: 9999px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
      
        .carousel-card:hover {
            box-shadow: 0 50px 110px rgba(199,160,91,0.22);
            transform: translateY(-12px) scale(1.02);
        }
      
        .carousel-card.pressed {
            transform: scale(0.965) !important;
            transition-duration: 80ms;
        }
      
        .carousel-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at var(--x) var(--y), rgba(255,215,120,0.3), transparent 60%);
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }
      
        .carousel-card:hover::before {
            opacity: 1;
        }
      
        .carousel-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }
      
        .carousel-card:hover::after {
            opacity: 1;
        }
      
        .pagination {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            z-index: 10;
        }
      
        .pagination-dot {
            width: 12px;
            height: 12px;
            background: var(--soft);
            border-radius: 50%;
            transition: background 0.3s;
            cursor: pointer;
        }
      
        .pagination-dot.active {
            background: var(--gold);
        }
      
        .search-float {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            z-index: 400;
        }
      
        .search-box {
            background: rgba(30,20,15,0.88);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(199,160,91,0.35);
            border-radius: 9999px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
      
        body.light .search-box {
            background: rgba(245, 235, 220, 0.9);
        }
      
        #searchInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1.1rem;
        }
      
        #searchInput::placeholder { color: var(--soft); opacity: 0.8; }
      
        #clearBtn, #voiceBtn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.5rem;
            cursor: pointer;
            display: none;
        }
      
        #voiceBtn { display: block; }
      
        dialog {
            border: none;
            background: transparent;
            max-width: 720px;
            width: 94%;
            margin: auto;
            padding: 0;
        }
      
        .modal-content {
            background: var(--surface);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid var(--gold);
        }
      
        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            font-size: 1.8rem;
            border-radius: 50%;
            z-index: 10;
            cursor: pointer;
        }
      
        .modal-img img:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
      
        footer {
            text-align: center;
            padding: 80px 20px 60px;
            color: var(--soft);
            font-size: 0.95rem;
        }
      
        .brand {
            font-family: var(--font-heading);
            font-size: 3.2rem;
            color: var(--gold);
            margin-bottom: 12px;
        }
      
        @media (max-width: 768px) {
            .carousel-track {
                gap: 16px;
                flex-direction: row;
                overflow-x: auto;
                transform: none;
            }
            .carousel-card {
                flex: 0 0 280px;
            }
            .cat-bar {
                flex-wrap: nowrap;
                overflow-x: auto;
            }
        }
      
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

            { "id": "fond2", "categoryId": "fondue", "nameEn": "Strawberry-Banana Fondue", "nameAr": "فوندو فراولة وموز", "descriptionEn": "Fresh strawberries and ripe banana with chocolate fondue.", "price": 45, "image": "Fondue2.jpeg", "calories": "410 kcal", "dietary": ["contains-dairy"] },

            { "id": "fond6", "categoryId": "fondue", "nameEn": "Assorted Nut Platter", "nameAr": "طبق مكسرات مشكل", "descriptionEn": "Artfully arranged selection. Various roasting levels.", "price": 35, "image": "Nutsplatter.jpg", "calories": "180 kcal", "dietary": ["contains-nuts"] },
            { "id": "cro6", "categoryId": "croissant", "nameEn": "Plain Butter Croissant", "nameAr": "كرواسون زبدة", "descriptionEn": "Classic Parisian. Crisp, flaky exterior; tender, layered interior.", "price": 20, "image": "Plain.webp", "calories": "320 kcal", "dietary": ["vegetarian"] },
            { "id": "cro7", "categoryId": "croissant", "nameEn": "Cheese Croissant", "nameAr": "كرواسون جبن", "descriptionEn": "Buttery croissant with cheese filling. Gooey, savory center.", "price": 20, "image": "Cheese.jpg", "calories": "360 kcal", "dietary": ["vegetarian"] },
            { "id": "cro8", "categoryId": "croissant", "nameEn": "Chocolate Croissant", "nameAr": "كرواسون شوكولاتة", "descriptionEn": "Pain au chocolat. Two dark chocolate batons baked inside.", "price": 20, "image": "Chocolatecroissant.jpg", "calories": "380 kcal", "dietary": ["vegetarian"] },
            { "id": "cro9", "categoryId": "croissant", "nameEn": "Almond Croissant", "nameAr": "كرواسون لوز", "descriptionEn": "Filled with almond cream, topped with sliced almonds.", "price": 20, "image": "Almondcroissant.jpg", "calories": "400 kcal", "dietary": ["vegetarian"] },
            { "id": "cro10", "categoryId": "croissant", "nameEn": "Cinnamon Danish", "nameAr": "دانش قرفة", "descriptionEn": "Flaky Danish with cinnamon-sugar spiral. Aromatic layers.", "price": 20, "image": "Cinnamon.jpg", "calories": "390 kcal", "dietary": ["vegetarian"] },
            { "id": "cro11", "categoryId": "croissant", "nameEn": "Danish Shell", "nameAr": "دانش شل", "descriptionEn": "Shell-shaped Danish. Delicate layers, light sweetness.", "price": 20, "image": "Danish.jpg", "calories": "380 kcal", "dietary": ["vegetarian"] },
            { "id": "cro12", "categoryId": "croissant", "nameEn": "Raisins Danish", "nameAr": "دانش زبيب", "descriptionEn": "Danish pastry studded with plump raisins. Natural sweetness.", "price": 20, "image": "Raisin.jpg", "calories": "390 kcal", "dietary": ["vegetarian"] },
            { "id": "grill3", "categoryId": "grill", "nameEn": "French Fries", "nameAr": "بطاطس مقلية", "descriptionEn": "Golden fries. Crisp exterior, fluffy interior. Perfectly salted.", "price": 29, "image": "Patatas.jpg", "calories": "340 kcal", "dietary": ["vegan", "gluten-free"] },
            { "id": "grill4", "categoryId": "grill", "nameEn": "Potato Wedges", "nameAr": "بطاطس ويدجز", "descriptionEn": "Thick potato wedges with seasoned skin. Heartier texture.", "price": 32, "image": "Wedges.webp", "calories": "380 kcal", "dietary": ["vegetarian", "gluten-free"] }
        ]
    }
    </script>
    <script>
        (function() {
            const data = JSON.parse(document.getElementById('menuData').textContent);
            const IMAGE_BASE = "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/";
            let lang = localStorage.getItem('lang') || 'en';
            let activeCat = 'all';
            let searchQ = '';
            let translateX = 0;
            let isDragging = false;
            let startX = 0;
            let prevX = 0;
            let velocity = 0;
            let lastTime = 0;
            let raf = null;
            let snapTimeout = null;
            let currentItems = [];
            let viewed = JSON.parse(localStorage.getItem('viewed') || '[]');
          
            const els = {
                track: document.getElementById('track'),
                carousel: document.getElementById('carousel'),
                catBar: document.getElementById('catBar'),
                searchInput: document.getElementById('searchInput'),
                clearBtn: document.getElementById('clearBtn'),
                voiceBtn: document.getElementById('voiceBtn'),
                modal: document.getElementById('modal'),
                modalImg: document.getElementById('modalImg'),
                modalBody: document.getElementById('modalBody'),
                modalClose: document.getElementById('modalClose'),
                themeBtn: document.getElementById('themeBtn'),
                langBtn: document.getElementById('langBtn'),
                backToTop: document.getElementById('backToTop'),
                pagination: document.getElementById('pagination')
            };
          
            function generateStars() {
                const container = document.getElementById('stars');
                for (let i = 0; i < 92; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random()*100 + '%';
                    s.style.top = Math.random()*100 + '%';
                    s.style.width = s.style.height = (Math.random()*3.5 + 1.5) + 'px';
                    s.style.animationDelay = Math.random()*6 + 's';
                    container.appendChild(s);
                }
            }
          
            function smartMatch(text, q) {
                q = q.toLowerCase();
                text = text.toLowerCase();
                return text.includes(q) || text.replace(/\s/g, '').includes(q);
            }
          
            function getFiltered() {
                let filtered = data.items;
                if (activeCat === 'recommended') {
                    filtered = filtered.filter(i => viewed.includes(i.id));
                } else if (activeCat !== 'all') {
                    filtered = filtered.filter(i => i.categoryId === activeCat);
                }
                if (searchQ) {
                    filtered = filtered.filter(i =>
                        smartMatch(i.nameEn, searchQ) ||
                        smartMatch(i.nameAr || '', searchQ) ||
                        smartMatch(i.descriptionEn, searchQ)
                    );
                }
                filtered.sort((a, b) => viewed.includes(b.id) - viewed.includes(a.id));
                return filtered;
            }
          
            function renderCats() {
                els.catBar.innerHTML = '';
                data.categories.forEach(c => {
                    const btn = document.createElement('button');
                    btn.className = `cat-btn ${c.id === activeCat ? 'active' : ''}`;
                    btn.dataset.id = c.id;
                    btn.textContent = lang === 'ar' ? c.nameAr : c.nameEn;
                    btn.setAttribute('aria-current', c.id === activeCat ? 'true' : 'false');
                    els.catBar.appendChild(btn);
                    btn.addEventListener('click', () => {
                        activeCat = btn.dataset.id;
                        renderCats();
                        switchContent(getFiltered());
                    });
                });
            }
          
            function createCardHTML(item) {
                const name = lang === 'ar' ? item.nameAr : item.nameEn;
                const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
                let tags = '';
                item.dietary.forEach(tag => {
                    tags += `<span class="dietary-tag"><i class="fas fa-leaf"></i>${tag}</span>`;
                });
                return `
                    <div class="figure">
                        <img src="${IMAGE_BASE}${item.image}" alt="${item.nameEn} - ${item.nameAr || ''}" loading="lazy" decoding="async">
                    </div>
                    <div class="content">
                        <div class="name">${name}</div>
                        ${nameAlt ? `<div class="name-ar">${nameAlt}</div>` : ''}
                        <div class="desc">${item.descriptionEn}</div>
                        <div class="price">${item.price} QAR</div>
                        <div class="dietary-tags">${tags}</div>
                    </div>
                `;
            }
          
            function renderTrack(items) {
                els.track.innerHTML = '';
                const extended = [...items, ...items, ...items];
                extended.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'carousel-card';
                    card.innerHTML = createCardHTML(item);
                    card.dataset.index = idx % items.length;
                    card.tabIndex = 0;
                    card.role = 'button';
                    card.setAttribute('aria-label', item.nameEn);
                    card.addEventListener('click', () => openModal(items[card.dataset.index]));
                    card.addEventListener('keydown', e => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            openModal(items[card.dataset.index]);
                            e.preventDefault();
                        }
                    });
                    card.addEventListener('mousemove', e => {
                        const rect = card.getBoundingClientRect();
                        card.style.setProperty('--x', `${e.clientX - rect.left}px`);
                        card.style.setProperty('--y', `${e.clientY - rect.top}px`);
                    });
                    els.track.appendChild(card);
                });
                const cardW = 340 + 36;
                translateX = lang === 'ar' ? items.length * cardW : -items.length * cardW;
                els.track.style.transition = 'none';
                els.track.style.transform = `translateX(${translateX}px)`;
                setTimeout(() => {
                    Array.from(els.track.children).forEach((card, i) => {
                        setTimeout(() => {
                            card.style.animation = 'fadeIn 0.9s var(--ease-out) forwards';
                        }, i * 22);
                    });
                }, 80);
                renderPagination(items.length);
                update3D();
            }
          
            function renderPagination(len) {
                els.pagination.innerHTML = '';
                for (let i = 0; i < len; i++) {
                    const dot = document.createElement('div');
                    dot.className = 'pagination-dot';
                    dot.addEventListener('click', () => snapToIndex(i));
                    els.pagination.appendChild(dot);
                }
            }
          
            function updatePagination() {
                const dots = els.pagination.children;
                if (!dots.length) return;
                const cardW = 340 + 36;
                const offset = Math.abs(translateX) / cardW % currentItems.length;
                const activeIndex = Math.round(offset);
                Array.from(dots).forEach((dot, i) => {
                    dot.classList.toggle('active', i === activeIndex);
                });
            }
          
            function snapToIndex(index) {
                const cardW = 340 + 36;
                const direction = lang === 'ar' ? 1 : -1;
                translateX = direction * (currentItems.length + index) * cardW;
                els.track.style.transition = 'transform 0.65s var(--ease-out)';
                els.track.style.transform = `translateX(${translateX}px)`;
                update3D();
            }
          
            function update3D() {
                const cards = els.track.children;
                if (!cards.length) return;
                const containerRect = els.carousel.getBoundingClientRect();
                const center = containerRect.left + containerRect.width / 2;
                Array.from(cards).forEach(card => {
                    const rect = card.getBoundingClientRect();
                    const cardCenter = rect.left + rect.width / 2;
                    let offset = (cardCenter - center) / 380;
                    offset = Math.max(Math.min(offset, 2.2), -2.2);
                    const rotateY = offset * -36;
                    const scale = 1 - Math.abs(offset) * 0.24;
                    const z = (1 - Math.abs(offset)) * 110 - 65;
                    const op = 0.65 + (1 - Math.abs(offset)) * 0.35;
                    card.style.transform = `translateZ(${z}px) rotateY(${rotateY}deg) scale(${scale})`;
                    card.style.opacity = op;
                    card.style.boxShadow = `0 ${30 + (1 - Math.abs(offset)) * 35}px 90px rgba(0,0,0,${0.65 - Math.abs(offset) * 0.35})`;
                });
                updatePagination();
            }
          
            function animateMomentum() {
                translateX += velocity;
                velocity *= 0.95;
                if (Math.abs(velocity) < 0.01) velocity = 0;
                els.track.style.transform = `translateX(${translateX}px)`;
                update3D();
                if (Math.abs(velocity) > 0.1) {
                    raf = requestAnimationFrame(animateMomentum);
                } else {
                    snapToCenter();
                }
            }
          
            function snapToCenter() {
                if (snapTimeout) clearTimeout(snapTimeout);
                const cards = Array.from(els.track.children);
                if (!cards.length) return;
                let closest = null;
                let minDist = Infinity;
                const center = els.carousel.getBoundingClientRect().left + els.carousel.offsetWidth / 2;
                cards.forEach(card => {
                    const r = card.getBoundingClientRect();
                    const dist = Math.abs((r.left + r.width / 2) - center);
                    if (dist < minDist) {
                        minDist = dist;
                        closest = card;
                    }
                });
                if (!closest) return;
                const targetOffset = center - (closest.getBoundingClientRect().left + closest.offsetWidth / 2);
                translateX += targetOffset;
                els.track.style.transition = 'transform 0.65s var(--ease-out)';
                els.track.style.transform = `translateX(${translateX}px)`;
                const setWidth = currentItems.length * (340 + 36);
                snapTimeout = setTimeout(() => {
                    if (!isDragging) {
                        if (translateX > -setWidth * 0.6) {
                            translateX -= setWidth;
                        } else if (translateX < -setWidth * 2.4) {
                            translateX += setWidth;
                        } else {
                            update3D();
                            return;
                        }
                        els.track.style.transition = 'none';
                        els.track.style.transform = `translateX(${translateX}px)`;
                    }
                    update3D();
                }, 700);
                update3D();
            }
          
            function startDrag(e) {
                if (snapTimeout) clearTimeout(snapTimeout);
                cancelAnimationFrame(raf);
                isDragging = true;
                els.track.classList.add('dragging');
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                startX = prevX = clientX;
                velocity = 0;
                lastTime = Date.now();
                els.track.style.transition = 'none';
                e.preventDefault();
            }
          
            function duringDrag(e) {
                if (!isDragging) return;
                e.preventDefault();
                const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                const delta = clientX - prevX;
                translateX += delta;
                els.track.style.transform = `translateX(${translateX}px)`;
                prevX = clientX;
                const now = Date.now();
                if (now - lastTime > 12) {
                    velocity = delta * 1.8;
                    lastTime = now;
                }
                update3D();
            }
          
            function endDrag() {
                if (!isDragging) return;
                isDragging = false;
                els.track.classList.remove('dragging');
                animateMomentum();
            }
          
            function switchContent(newItems) {
                if (snapTimeout) clearTimeout(snapTimeout);
                cancelAnimationFrame(raf);
                isDragging = false;
                currentItems = newItems;
                els.track.style.transition = 'opacity 0.28s ease';
                els.track.style.opacity = '0';
                setTimeout(() => {
                    renderTrack(newItems);
                    els.track.style.opacity = '1';
                    update3D();
                }, 300);
            }
          
            function openModal(item) {
                viewed.push(item.id);
                viewed = [...new Set(viewed)];
                localStorage.setItem('viewed', JSON.stringify(viewed));
                const name = lang === 'ar' ? item.nameAr : item.nameEn;
                const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
                els.modalImg.innerHTML = `<img src="${IMAGE_BASE}${item.image}" style="width:100%;height:100%;object-fit:cover" alt="${name}">`;
                let extras = '';
                if (item.hasMilkSelection) {
                    extras += '<div style="margin-top:24px;padding:14px 20px;background:rgba(226,182,117,0.1);border-radius:16px;font-size:0.95rem">Milk options: oat • almond • whole</div>';
                }
                if (item.hasBeanSelection) {
                    extras += '<div style="margin-top:24px;padding:14px 20px;background:rgba(226,182,117,0.1);border-radius:16px;font-size:0.95rem">Bean selection available</div>';
                }
                els.modalBody.innerHTML = `
                    <h2 style="font-family:var(--font-heading);font-size:2.4rem;color:var(--gold);margin-bottom:8px">${name}</h2>
                    ${nameAlt ? `<div style="font-family:var(--font-ar);font-size:1.35rem;color:var(--soft);margin-bottom:18px">${nameAlt}</div>` : ''}
                    <div style="font-size:1.85rem;font-weight:600;color:var(--accent);margin:16px 0">${item.price} QAR</div>
                    <p style="color:var(--soft);line-height:1.65">${item.descriptionEn}</p>
                    ${extras}
                `;
                els.modal.showModal();
            }
          
            function addParticle(e) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${e.clientX}px`;
                p.style.top = `${e.clientY}px`;
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 1200);
            }
          
            function initVoice() {
                if (!('webkitSpeechRecognition' in window)) return;
                const rec = new webkitSpeechRecognition();
                rec.lang = lang === 'ar' ? 'ar-SA' : 'en-US';
                rec.onresult = e => {
                    els.searchInput.value = e.results[0][0].transcript;
                    searchQ = els.searchInput.value;
                    switchContent(getFiltered());
                };
                els.voiceBtn.addEventListener('click', () => rec.start());
            }
          
            function init() {
                generateStars();
                document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                els.langBtn.textContent = lang.toUpperCase();
                if (document.body.classList.contains('light')) els.themeBtn.textContent = '☀️';
                els.themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('light');
                    els.themeBtn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
                });
                els.langBtn.addEventListener('click', () => {
                    lang = lang === 'en' ? 'ar' : 'en';
                    localStorage.setItem('lang', lang);
                    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                    els.langBtn.textContent = lang.toUpperCase();
                    renderCats();
                    switchContent(getFiltered());
                });
                els.searchInput.addEventListener('input', () => {
                    searchQ = els.searchInput.value.trim();
                    els.clearBtn.style.display = searchQ ? 'block' : 'none';
                    switchContent(getFiltered());
                });
                els.clearBtn.addEventListener('click', () => {
                    els.searchInput.value = '';
                    searchQ = '';
                    els.clearBtn.style.display = 'none';
                    switchContent(getFiltered());
                });
                els.modalClose.addEventListener('click', () => els.modal.close());
                els.modal.addEventListener('click', e => { if (e.target === els.modal) els.modal.close(); });
                els.backToTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
                document.addEventListener('mousemove', addParticle);
                initVoice();
                renderCats();
                const track = els.track;
                track.addEventListener('mousedown', startDrag);
                track.addEventListener('mousemove', duringDrag);
                track.addEventListener('mouseup', endDrag);
                track.addEventListener('mouseleave', endDrag);
                track.addEventListener('touchstart', startDrag, { passive: false });
                track.addEventListener('touchmove', duringDrag, { passive: false });
                track.addEventListener('touchend', endDrag);
                switchContent(getFiltered());
                setTimeout(update3D, 120);
                window.addEventListener('resize', update3D);
                if ('serviceWorker' in navigator) {
                    navigator.serviceWorker.register('data:text/javascript,addEventListener("install",()=>skipWaiting());addEventListener("activate",()=>clients.claim());addEventListener("fetch",e=>e.respondWith(caches.match(e.request)||fetch(e.request)));');
                }
            }
          
            window.onload = init;
        })();
    </script>
</body>
</html>
