<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Turkiana Café & Sweets — Winter 2025</title>

<!-- PWA Meta Tags -->
<meta name="theme-color" content="#0c0406">
<meta name="description" content="A winter haven of sweetness, warmth, and timeless Turkish charm">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">

<!-- SEO & Structured Data -->
<meta property="og:title" content="Turkiana Café & Sweets — Winter 2025">
<meta property="og:description" content="Explore our winter menu featuring Turkish coffee, sweets, and warm specialties">
<meta property="og:image" content="https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Turkishcoffee.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

<!-- Styles -->
<style>
/* ============================================
   CSS VARIABLES & RESET
============================================ */
:root {
    --bg: #0c0406;
    --gold: #d4af37;
    --text: #f9f7f4;
    --muted: rgba(255, 255, 255, 0.7);
    --accent: #8b0921;
    --success: #4caf50;
    --warning: #ff9800;
    --skeleton-light: #1d0509;
    --skeleton-dark: #2a080d;
    --overlay: rgba(0, 0, 0, 0.95);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
}

body {
    font-family: 'Inter', sans-serif;
    background: radial-gradient(circle at top, rgba(212, 175, 55, 0.12), transparent 45%),
                linear-gradient(180deg, #1d0509 0%, #0c0406 60%, #030203 100%);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    touch-action: manipulation;
}

/* ============================================
   KIOSK MODE STYLES (SIMPLIFIED)
============================================ */
body.kiosk-mode {
    cursor: none !important;
}

/* Kiosk Welcome Overlay */
#kiosk-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(12, 4, 6, 0.95), rgba(59, 15, 23, 0.95));
    z-index: 10000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: var(--gold);
    text-align: center;
    padding: 40px;
    backdrop-filter: blur(20px);
    transition: opacity 0.5s ease;
}

#kiosk-overlay.hidden {
    opacity: 0;
    pointer-events: none;
}

#kiosk-overlay h2 {
    font-family: "Playfair Display", serif;
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 20px;
    background: linear-gradient(130deg, #fff, var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

#kiosk-overlay p {
    max-width: 600px;
    margin-bottom: 40px;
    color: rgba(255, 255, 255, 0.8);
    font-size: 1.1rem;
    line-height: 1.6;
}

#start-experience-btn {
    background: linear-gradient(135deg, var(--gold), #ffd166);
    color: var(--bg);
    border: none;
    padding: 20px 50px;
    border-radius: 12px;
    font-size: 1.2rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
    min-height: 60px;
    min-width: 200px;
}

#start-experience-btn:hover,
#start-experience-btn:active {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(212, 175, 55, 0.6);
}

/* Kiosk Navigation Bar (REMOVED) */
#kiosk-nav {
    display: none !important;
}

/* Kiosk-optimized cards */
body.kiosk-mode .card {
    min-height: 320px;
    border-width: 3px;
    border-color: rgba(255, 255, 255, 0.15);
}

body.kiosk-mode .card:active {
    transform: translateY(-8px) scale(0.98);
    border-color: rgba(212, 175, 55, 0.6);
}

body.kiosk-mode .card h3 {
    font-size: 1.2rem;
    min-height: 3.2em;
}

body.kiosk-mode .card-price {
    font-size: 1.3rem;
}

/* Larger touch targets for kiosk */
body.kiosk-mode .category-pill,
body.kiosk-mode .btn {
    min-height: 55px;
}

body.kiosk-mode .search-input {
    padding: 20px 25px;
    font-size: 1.1rem;
    min-height: 60px;
}

/* Auto-hide cursor in kiosk mode */
@keyframes hideCursor {
    0% { cursor: default; }
    99% { cursor: default; }
    100% { cursor: none; }
}

body.kiosk-mode {
    animation: hideCursor 2s forwards;
}

/* Kiosk idle warning */
#idle-warning {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(12, 4, 6, 0.95);
    border: 3px solid var(--gold);
    border-radius: 20px;
    padding: 40px;
    text-align: center;
    z-index: 10001;
    display: none;
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    max-width: 500px;
    width: 90%;
}

#idle-warning h3 {
    color: var(--gold);
    font-family: "Playfair Display", serif;
    font-size: 1.8rem;
    margin-bottom: 20px;
}

#idle-warning p {
    color: var(--muted);
    margin-bottom: 30px;
    line-height: 1.6;
}

#reset-timer-btn {
    background: linear-gradient(135deg, var(--gold), #ffd166);
    color: var(--bg);
    border: none;
    padding: 15px 40px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    min-height: 50px;
    min-width: 180px;
}

/* ============================================
   ACCESSIBILITY
============================================ */
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

.skip-to-content {
    position: absolute;
    top: -40px;
    left: 10px;
    background: var(--gold);
    color: var(--bg);
    padding: 12px 24px;
    border-radius: 4px;
    text-decoration: none;
    font-weight: 600;
    z-index: 10000;
    transition: top 0.3s ease;
}

.skip-to-content:focus {
    top: 10px;
    outline: 2px solid var(--gold);
    outline-offset: 2px;
}

/* ============================================
   SNOW ANIMATION (Lightweight for tablets)
============================================ */
#snow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 50;
}

/* ============================================
   NOTIFICATIONS & LOADING
============================================ */
.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--gold);
    color: var(--bg);
    padding: 14px 28px;
    border-radius: 12px;
    font-weight: 600;
    z-index: 2000;
    display: none;
    animation: slideUp 0.3s ease;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    min-width: 280px;
    max-width: 90vw;
    text-align: center;
    backdrop-filter: blur(10px);
    border: 2px solid rgba(255, 255, 255, 0.1);
}

.toast.error {
    background: var(--accent);
    color: var(--text);
}

.toast.info {
    background: #2196f3;
    color: white;
}

.loading {
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    border-radius: 50%;
    border-top-color: var(--gold);
    animation: spin 1s ease-in-out infinite;
}

.skeleton {
    background: linear-gradient(90deg, var(--skeleton-light) 25%, var(--skeleton-dark) 50%, var(--skeleton-light) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
}

@keyframes slideUp {
    from {
        transform: translateX(-50%) translateY(100px);
        opacity: 0;
    }
    to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes loading {
    0% {
        background-position: 200% 0;
    }
    100% {
        background-position: -200% 0;
    }
}

/* ============================================
   HEADER (HIDDEN)
============================================ */
header {
    display: none !important;
}

/* ============================================
   FLOATING CATEGORY NAVIGATION (ALWAYS VISIBLE)
============================================ */
.floating-categories {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(12, 4, 6, 0.98);
    backdrop-filter: blur(25px);
    border: 3px solid rgba(212, 175, 55, 0.5);
    border-radius: 50px;
    padding: 18px 30px;
    z-index: 100;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9);
    display: flex;
    gap: 15px;
    max-width: 96vw;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    opacity: 1 !important;
    visibility: visible !important;
    transition: all 0.3s ease;
    min-height: 75px;
    align-items: center;
}

.floating-categories::-webkit-scrollbar {
    display: none;
}

.floating-categories.hidden {
    transform: translateX(-50%) translateY(0) !important;
    opacity: 1 !important;
    visibility: visible !important;
}

.floating-category {
    flex-shrink: 0;
    padding: 16px 32px;
    border-radius: 40px;
    border: 3px solid rgba(255, 255, 255, 0.3);
    background: rgba(255, 255, 255, 0.08);
    color: rgba(255, 255, 255, 0.95);
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 65px;
    font-family: 'Inter', sans-serif;
    -webkit-tap-highlight-color: transparent;
    white-space: nowrap;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
}

.floating-category::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, rgba(255, 110, 180, 0.4), rgba(255, 168, 76, 0.4), rgba(72, 182, 255, 0.4));
    filter: blur(10px);
    z-index: -1;
    mix-blend-mode: screen;
    opacity: 0;
    transition: opacity 0.3s;
    border-radius: 40px;
}

.floating-category:hover,
.floating-category:active {
    transform: translateY(-5px) scale(1.06);
    box-shadow: 0 18px 40px rgba(255, 174, 76, 0.7);
    border-color: rgba(212, 175, 55, 0.7);
}

.floating-category:hover::before {
    opacity: 1;
}

.floating-category.active {
    color: #0a0503;
    background: linear-gradient(135deg, #ffd771, #ff5f6d, #ffd771);
    border-color: transparent;
    box-shadow: 0 25px 60px rgba(255, 179, 71, 0.8);
    transform: translateY(-3px) scale(1.06);
    font-weight: 900;
    border: 3px solid rgba(255, 255, 255, 0.4);
    animation: pulse-active 2s infinite;
}

@keyframes pulse-active {
    0%, 100% {
        box-shadow: 0 25px 60px rgba(255, 179, 71, 0.8);
    }
    50% {
        box-shadow: 0 25px 80px rgba(255, 179, 71, 1);
    }
}

/* Category indicator */
.current-category-indicator {
    position: fixed;
    top: 110px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(212, 175, 55, 0.95);
    color: var(--bg);
    padding: 12px 30px;
    border-radius: 30px;
    font-weight: 800;
    font-size: 1.1rem;
    z-index: 99;
    backdrop-filter: blur(15px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    text-transform: uppercase;
    letter-spacing: 0.2em;
    transition: opacity 0.3s;
    opacity: 0;
    border: 3px solid rgba(212, 175, 55, 0.7);
}

.current-category-indicator.visible {
    opacity: 1;
    animation: slide-down 0.3s ease;
}

@keyframes slide-down {
    from {
        transform: translateX(-50%) translateY(-20px);
        opacity: 0;
    }
    to {
        transform: translateX(-50%) translateY(0);
        opacity: 1;
    }
}

/* ============================================
   MAIN LAYOUT
============================================ */
.app-container {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    position: fixed;
    top: 0;
    left: 0;
}

/* ============================================
   MAIN CONTENT AREA
============================================ */
.content-container {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 150px 20px 40px;
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
    -webkit-overflow-scrolling: touch;
}

.section {
    margin-bottom: 50px;
    scroll-margin-top: 160px;
}

.section h2 {
    font-family: "Playfair Display", serif;
    font-size: 2.2rem;
    margin: 0 0 25px;
    color: #fff;
    position: relative;
    padding-bottom: 15px;
    text-align: center;
}

.section h2::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 4px;
    background: var(--gold);
}

.section p {
    margin: 0 0 30px;
    color: var(--muted);
    font-size: 1.1rem;
    text-align: center;
    max-width: 800px;
    margin-left: auto;
    margin-right: auto;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 30px;
}

/* ============================================
   CARDS (Touch Optimized)
============================================ */
.card {
    border-radius: 25px;
    overflow: hidden;
    background: linear-gradient(135deg, rgba(12, 4, 6, 0.95), rgba(59, 15, 23, 0.85));
    border: 3px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    min-height: 380px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}

.card:active {
    transform: translateY(-5px) scale(0.98);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 1);
    border-color: rgba(212, 175, 55, 0.5);
}

.card-image {
    width: 100%;
    height: 220px;
    object-fit: cover;
    transition: transform 0.3s ease;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
    background: linear-gradient(90deg, var(--skeleton-light) 25%, var(--skeleton-dark) 50%, var(--skeleton-light) 75%);
    background-size: 200% 100%;
}

.card.loading .card-image {
    animation: loading 1.5s infinite;
}

.card:active .card-image:not(.loading) {
    transform: scale(1.06);
}

.card-badge {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 0.9rem;
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.95), rgba(139, 9, 33, 0.95));
    color: white;
    border: 3px solid rgba(212, 175, 55, 0.9);
    animation: pulse 2s infinite;
    font-weight: 700;
    letter-spacing: 0.8px;
    z-index: 2;
}

.card-body {
    padding: 25px;
    text-align: center;
}

.card h3 {
    margin: 0 0 15px;
    font-size: 1.3rem;
    font-weight: 800;
    color: #fff;
    line-height: 1.4;
    min-height: 3.2em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 8px;
}

.card-ar-name {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 20px;
    min-height: 2.2em;
    font-style: italic;
}

.card-price {
    display: block;
    color: var(--gold);
    font-weight: 900;
    font-size: 1.6rem;
    margin-top: 15px;
    text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
}

/* ============================================
   MODALS (Fixed normal size, not full screen)
============================================ */
.modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.9);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    opacity: 0;
    transition: opacity 0.3s;
    backdrop-filter: blur(15px);
    padding: 20px;
}

.modal-backdrop.active {
    display: flex;
    opacity: 1;
}

.modal-card {
    background: linear-gradient(135deg, rgba(12, 4, 6, 0.98) 0%, rgba(30, 5, 10, 0.98) 100%);
    border: 3px solid rgba(212, 175, 55, 0.6);
    border-radius: 25px;
    overflow: hidden;
    width: 90%;
    max-width: 800px;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    animation: modalSlideUp 0.3s ease;
    position: relative;
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9);
}

@keyframes modalSlideUp {
    from {
        transform: translateY(30px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}

.modal-header {
    padding: 25px;
    border-bottom: 3px solid rgba(212, 175, 55, 0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: rgba(0, 0, 0, 0.6);
    flex-shrink: 0;
}

.modal-header h3 {
    margin: 0;
    font-family: "Playfair Display", serif;
    font-size: 2rem;
    color: var(--gold);
    flex: 1;
    padding-right: 25px;
}

.modal-close {
    background: rgba(212, 175, 55, 0.15);
    border: 3px solid rgba(212, 175, 55, 0.4);
    color: rgba(255, 255, 255, 0.95);
    font-size: 2.5rem;
    cursor: pointer;
    transition: all 0.3s;
    width: 60px;
    height: 60px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
    line-height: 1;
    font-weight: 300;
}

.modal-close:active {
    color: var(--gold);
    background: rgba(212, 175, 55, 0.3);
    transform: scale(0.95);
}

.modal-body {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex: 1;
    padding: 0;
}

.modal-image-container {
    flex: 0 0 350px;
    min-height: 350px;
    max-height: 400px;
    position: relative;
    overflow: hidden;
}

.modal-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
}

.modal-info {
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 25px;
    flex: 1;
}

.modal-info h4 {
    margin: 0 0 12px;
    color: var(--gold);
    font-size: 1.1rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 800;
}

.modal-info p {
    margin: 0;
    color: rgba(255, 255, 255, 0.95);
    font-size: 1.1rem;
    line-height: 1.7;
}

.modal-meta {
    padding: 25px;
    background: rgba(212, 175, 55, 0.15);
    border-radius: 15px;
    border: 3px solid rgba(212, 175, 55, 0.3);
    font-size: 1rem;
    color: rgba(255, 255, 255, 0.9);
    line-height: 1.6;
}

.modal-footer {
    padding: 30px;
    border-top: 3px solid rgba(212, 175, 55, 0.3);
    text-align: center;
    background: rgba(212, 175, 55, 0.08);
    font-size: 1.6rem;
    flex-shrink: 0;
}

.modal-footer strong {
    color: var(--gold);
    font-size: 2.5rem;
    margin: 0 8px;
    text-shadow: 0 2px 15px rgba(212, 175, 55, 0.4);
}

/* ============================================
   NO RESULTS
============================================ */
.no-results {
    grid-column: 1 / -1;
    text-align: center;
    padding: 100px 20px;
    color: var(--muted);
}

.no-results strong {
    color: var(--gold);
    display: block;
    margin-bottom: 25px;
    font-size: 1.8rem;
    font-family: "Playfair Display", serif;
}

.no-results p {
    font-size: 1.2rem;
    opacity: 0.8;
}

/* ============================================
   FOOTER (Hidden)
============================================ */
footer {
    display: none !important;
}

/* ============================================
   ANIMATIONS
============================================ */
@keyframes pulse {
    0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7);
    }
    50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 15px rgba(212, 175, 55, 0);
    }
}

/* ============================================
   SCROLLBAR STYLING
============================================ */
.content-container::-webkit-scrollbar {
    width: 12px;
}

.content-container::-webkit-scrollbar-track {
    background: rgba(12, 4, 6, 0.6);
    border-radius: 6px;
}

.content-container::-webkit-scrollbar-thumb {
    background: linear-gradient(var(--gold), #ffd166);
    border-radius: 6px;
    border: 3px solid var(--bg);
}

.content-container::-webkit-scrollbar-thumb:active {
    background: linear-gradient(#ffd166, var(--gold));
}

/* ============================================
   RESPONSIVE DESIGN FOR TABLETS
============================================ */
@media (min-width: 768px) and (max-width: 1024px) {
    .grid {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 25px;
    }
    
    .card {
        min-height: 350px;

    { id:"th12", cat:"Tea on the House", enName:"Passion Fruit Tea", arName:"شاي باشن فروت", price:45, enDesc:"Tropical euphoria—exotic passion fruit infusion that balances tangy vibrancy with subtle sweetness, capturing the essence of distant shores in every fragrant sip.", arDesc:"نشوة استوائية—نقيع باشن فروت غريب يوازن بين الحيوية الحامضة والحلاوة الخفيفة، يلتقط جوهر الشواطئ البعيدة في كل رشفة عطرة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Passiontea.webp", calories:"40 kcal", dietary:["vegan","dairy-free"] },
    { id:"th13", cat:"Tea on the House", enName:"Hibiscus Ice", arName:"الكركديه مثلج", price:28, enDesc:"Ruby glacier—vibrant hibiscus infusion served over ice, offering tangy floral notes, stunning crimson color, and refreshing qualities that invigorate the senses.", arDesc:"جليد ياقوتي—نقيع كركديه نابض يُقدم فوق الثلج، يقدم نفحات زهرية حامضة ولوناً قرمزيًا بديع وصفات منعشة تنعش الحواس.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Hibiscus.webp", calories:"25 kcal", dietary:["vegan","dairy-free"] },
    { id:"th14", cat:"Tea on the House", enName:"Classic Turkish Coffee", arName:"قهوة تركية كلاسيكية", price:28, enDesc:"Traditional perfection—meticulously prepared Turkish coffee with signature velvety foam and rich depth, served alongside refreshing water to cleanse and prepare the palate.", arDesc:"كمال تقليدي—قهوة تركية محضرة بدقة مع رغوة حريرية مميزة وعمق غني، تُقدم بجانب ماء منعش لتنظيف وإعداد الحنك.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Turkishcoffee.jpg", calories:"5 kcal", dietary:["vegan","gluten-free","dairy-free"] },
    { id:"cac15", cat:"Café & Chill", enName:"Ice Tiramisu Latte", arName:"لاتيه تيراميسو مثلج", price:36, enDesc:"Dessert reimagined—layered iced latte capturing tiramisu's essence with espresso, mascarpone-inspired cream, ladyfinger notes, and cocoa dusting for sophisticated indulgence.", arDesc:"حلوى مُعاد تخيلها—لاتيه مثلج متعدد الطبقات يلتقط جوهر التيراميسو مع إسبرسو، كريمة مستوحاة من الماسكاربون، نفحات بسكويت السيدة وذرّ الكاكاو لتناول فاخر راقٍ.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Icetiramisu.webp", calories:"210 kcal", dietary:["contains-dairy"] },
    { id:"cac1", cat:"Café & Chill", enName:"Hot Chocolate (Hot/Ice)", arName:"هوت شوكولاتة (ساخن/مثلج)", price:36, enDesc:"Liquid velvet—artisanal blend of single-origin cocoa and steamed milk creating silky richness, crowned with whipped cream for ultimate comfort in warm or chilled version.", arDesc:"مخمل سائل—مزيج حرفي من كاكاو منشأ واحد وحليب مبخر يخلق غنى حريرياً، يتوج بكريمة مخفوقة للراحة القصوى في النسخة الدافئة أو المبردة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Hotchocolate.jfif", calories:"360 kcal", dietary:["contains-dairy"] },
    { id:"cac2", cat:"Café & Chill", enName:"Piccolo Latte", arName:"بيكولو", price:24, enDesc:"Precision in miniature—strong ristretto base harmonized with just enough velvety milk to soften edges while preserving coffee's intense character in elegantly small format.", arDesc:"دقة مصغرة—قاعدة رسترتو قوية متناغمة مع ما يكفي من الحليب الحريري لتليين الحواف مع الحفاظ على شخصية القهوة المكثفة في شكل صغير أنيق.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Piccololatte.jpg", calories:"120 kcal", dietary:["contains-dairy"] },
    { id:"cac3", cat:"Café & Chill", enName:"Latte (Hot/Ice)", arName:"لاتيه (ساخن/مثلج)", price:29, enDesc:"The perfect canvas—smooth microfoam over balanced espresso creating creamy harmony, offering comforting warmth or refreshing chill in beautifully layered presentation.", arDesc:"اللوحة المثالية—رغوة دقيقة ناعمة فوق إسبرسو متوازن تخلق تناغماً كريمياً، تقدم دفئاً مريحاً أو برودة منعشة في تقديم جميل متعدد الطبقات.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Latteart.webp", calories:"170 kcal", dietary:["contains-dairy"] },
    { id:"cac4", cat:"Café & Chill", enName:"Spanish Latte (Hot/Ice)", arName:"لاتيه إسباني (ساخن ومثلج)", price:32, enDesc:"Iberian sweetness—traditional latte enriched with sweetened condensed milk that caramelizes subtly, creating luxurious texture and nostalgic sweetness in every sip.", arDesc:"حلاوة إيبيرية—لاتيه تقليدي معزز بحليب مكثف محلى يتكرمل بخفة، يخلق قواماً فاخراً وحلاوة حنينية في كل رشفة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Latteart.webp", calories:"220 kcal", dietary:["contains-dairy"] },
    { id:"cac5", cat:"Café & Chill", enName:"Salted Caramel Latte (Hot/Ice)", arName:"لاتيه بالكراميل المملح (ساخن/مثلج)", price:32, enDesc:"Savory-sweet alchemy—house-made caramel with Himalayan salt crystals blended into creamy latte, creating sophisticated balance that tantalizes both sweet and savory cravings.", arDesc:"كيمياء مالحة-حلوة—كراميل منزلي الصنع مع بلورات ملح الهيمالايا ممزوج في لاتيه كريمي، يخلق توازناً راقياً يثير الشهية للحلو والمالح.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Latteart.webp", calories:"230 kcal", dietary:["contains-dairy"] },
    { id:"cac6", cat:"Café & Chill", enName:"Vanilla Latte (Hot/Ice)", arName:"لاتيه فانيليا (ساخن/مثلج)", price:32, enDesc:"Classic elegance—Madagascar bourbon vanilla bean infusion harmonizing with espresso and steamed milk, creating fragrant sweetness that enhances rather than overwhelms coffee notes.", arDesc:"أناقة كلاسيكية—نقيع فانيليا مدغشقر بوربون متناغم مع الإسبرسو والحليب المبخر، يخلق حلاوة عطرة تعزز نفحات القهوة بدلاً من طغيانها.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Art.webp", calories:"220 kcal", dietary:["contains-dairy"] },
    { id:"cac7", cat:"Café & Chill", enName:"Cappuccino (Hot/Ice)", arName:"كابوتشينو (ساخن/مثلج)", price:29, enDesc:"Textural masterpiece—equal parts espresso, steamed milk, and thick microfoam creating perfect trifecta of strength, creaminess, and airy lightness in traditional Italian style.", arDesc:"تحفة قوامية—أجزاء متساوية من إسبرسو، حليب مبخر، ورغوة دقيقة سميكة تخلق ثلاثية مثالية من القوة والكريمية والخفة الهوائية بالأسلوب الإيطالي التقليدي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Art.webp", calories:"150 kcal", dietary:["contains-dairy"] },
    { id:"cac8", cat:"Café & Chill", enName:"White Mocha (Hot/Ice)", arName:"وايت موكا (ساخن/مثلج)", price:32, enDesc:"Ivory indulgence—creamy white chocolate melted into rich espresso and steamed milk, creating decadent sweetness with subtle vanilla notes and luxurious mouthfeel.", arDesc:"تناول عاجي—شوكولاتة بيضاء كريمية ذائبة في إسبرسو غني وحليب مبخر، تخلق حلاوة فاخرة بنفحات فانيليا خفيفة وإحساس فم فاخر.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Latteart.webp", calories:"260 kcal", dietary:["contains-dairy"] },
    { id:"cac9", cat:"Café & Chill", enName:"Flat White (Hot/Ice)", arName:"فلات وايت (ساخن/مثلج)", price:27, enDesc:"Antipodean precision—strong double ristretto topped with velvety microfoam, emphasizing coffee intensity while providing silky texture that defines this Australian classic.", arDesc:"دقة من نصف الكرة الجنوبي—ريسترتو مزدوج قوي يتوج برغوة دقيقة حريرية، يؤكد على شدة القهوة بينما يوفر قواماً حريرياً يعرّف هذا الكلاسيكي الأسترالي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Flatwhite.webp", calories:"140 kcal", dietary:["contains-dairy"] },
    { id:"cac10", cat:"Café & Chill", enName:"Cortado (Hot/Ice)", arName:"كورتادو (ساخن/مثلج)", price:24, enDesc:"Spanish equilibrium—equal parts espresso and warm steamed milk creating perfect balance where neither overpowers, allowing coffee's nuanced flavors to shine through clearly.", arDesc:"توازن إسباني—أجزاء متساوية من إسبرسو وحليب مبخر دافئ تخلق توازناً مثالياً حيث لا يتغلب أي منهما، تسمح لنكهات القهوة الدقيقة بالتألق بوضوح.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Cortado.webp", calories:"110 kcal", dietary:["contains-dairy"] },
    { id:"cac11", cat:"Café & Chill", enName:"Espresso Single / Double (Hot/Ice)", arName:"إسپريسو مفرد/مزدوج (ساخن/مثلج)", price:21, enDesc:"Coffee in its purest form—concentrated extraction showcasing bean's terroir, with crema crown revealing roasting artistry and brewing precision in intense, aromatic essence.", arDesc:"قهوة في أنقى صورها—استخلاص مركز يعرض تيروار الحبة، مع تاج الكريما يكشف فن التحمير ودقة التحضير في الجوهر المكثف العطري.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Espresso.webp", calories:"5 kcal", dietary:["vegan","gluten-free","dairy-free"] },
    { id:"cac12", cat:"Café & Chill", enName:"Macchiato (Hot/Ice)", arName:"ماكياتو (ساخن/مثلج)", price:24, enDesc:"'Stained' artistry—strong espresso 'marked' with just a dollop of steamed milk foam, creating visual appeal and subtle creaminess that complements rather than dilutes intensity.", arDesc:"فن 'ملطخ'—إسبرسو قوي 'معلّم' بكمية صغيرة فقط من رغوة الحليب المبخر، يخلق جاذبية بصرية وكريمية خفيفة تكمل الشدة بدلاً من تخفيفها.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Machiatto.jpg", calories:"40 kcal", dietary:["contains-dairy"] },
    { id:"cac13", cat:"Café & Chill", enName:"Americano (Hot/Ice)", arName:"أمريكانو (ساخن/مثلج)", price:21, enDesc:"Transatlantic simplicity—espresso extended with hot water to create smooth, approachable strength that maintains coffee's character while offering lighter, sip-friendly experience.", arDesc:"بساطة عبر الأطلسي—إسبرسو ممتد بماء ساخن لخلق قوة ناعمة وسهلة الوصول تحافظ على شخصية القهوة بينما تقدم تجربة أخف وأسهل للرشف.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Americano.webp", calories:"5 kcal", dietary:["vegan","gluten-free","dairy-free"] },
    { id:"cac14", cat:"Café & Chill", enName:"Mocha (Hot/Ice)", arName:"موكا (ساخن/مثلج)", price:32, enDesc:"Chocolate-coffee marriage—rich dark chocolate melted into espresso base, topped with steamed milk and cocoa powder for decadent treat that satisfies both cravings simultaneously.", arDesc:"زواج شوكولاتة-قهوة—شوكولاتة داكنة غنية ذائبة في قاعدة إسبرسو، تتوج بحليب مبخر ومسحوق كاكاو لتناول فاخر يرضي الرغبتين في آن واحد.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Art.webp", calories:"260 kcal", dietary:["contains-dairy"] },
    { id:"sb1", cat:"Specialty Brews", enName:"V60 Pour Over - Ethiopia Beans", arName:"V60 بورت أوفر - حبوب إثيوبيا", price:33, enDesc:"Manual artistry—Ethiopian Yirgacheffe beans hand-poured through ceramic V60, extracting bright floral notes, bergamot hints, and clean finish that showcases terroir with clarity.", arDesc:"فن يدوي—حبوب إثيوبيا يرجاتشيف تُسكب يدوياً عبر V60 سيراميكي، تستخلص نفحات زهرية زاهية، تلميحات برغموت، ونهاية نظيفة تعرض التيروار بوضوح.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/V60.webp", calories:"2 kcal", dietary:["vegan","dairy-free"] },
    { id:"sb2", cat:"Specialty Brews", enName:"Ice Drip", arName:"آيس دريب", price:35, enDesc:"Slow-motion extraction—coffee grounds slowly dripped with ice-cold water over 8 hours, creating concentrated, smooth elixir with low acidity and complex flavor development.", arDesc:"استخلاص بالحركة البطيئة—بن مطحون يُقطر ببطء بماء مثلج على مدى 8 ساعات، يخلق إكسير مركزاً وناعماً بحموضة منخفضة وتطور نكهة معقد.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Drip.jpg", calories:"2 kcal", dietary:["vegan","dairy-free"] },
    { id:"sb3", cat:"Specialty Brews", enName:"Cold Brew", arName:"كولد برو", price:37, enDesc:"Patience rewarded—coarse grounds steeped in cold water for 18+ hours, producing naturally sweet, low-acid concentrate with chocolatey notes and remarkably smooth character.", arDesc:"صبر مكافأ—بن خشِن منقوع في ماء بارد لأكثر من 18 ساعة، ينتج مركزاً حلوماً طبيعياً ومنخفض الحموضة بنفحات شوكولاتية وشخصية ناعمة بشكل ملحوظ.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Coldbrew.webp", calories:"2 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf1", cat:"Refreshers", enName:"Lemonade", arName:"ليموناضة", price:37, enDesc:"Sunshine in glass—freshly squeezed Sicilian lemons balanced with pure cane sugar, creating perfect sweet-tart harmony that quenches thirst while brightening the spirit.", arDesc:"شمس في كوب—ليمون صقلي معصور طازجاً متوازن مع سكر قصب نقي، يخلق تناغماً حلو-حامض مثالي يُروي العطش بينما يضيء الروح.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Lemonade.jpg", calories:"120 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf2", cat:"Refreshers", enName:"Fresh Orange Juice", arName:"عصير برتقال طازج", price:37, enDesc:"Morning sun captured—Valencia oranges freshly pressed to order, preserving natural pulp, vibrant color, and vitamin C richness for revitalizing, unprocessed vitality.", arDesc:"شمس الصباح محتجزة—برتقال فالنسيا معصور طازجاً حسب الطلب، يحفظ اللب الطبيعي، اللون النابض، وغنى فيتامين سي للنشاط المنعش وغير المعالج.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Orange.jpeg", calories:"140 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf3", cat:"Refreshers", enName:"Orange Earl Grey Tea", arName:"شاي البرتقال إيرل جراي", price:47, enDesc:"Citrus-bergamot duet—premium Earl Grey kissed with orange zest and juice, creating sophisticated layers where citrus brightness enhances tea's floral bergamot character.", arDesc:"دويو حمضي-برغموتي—شاي إيرل جراي فاخر مُقبّل بقشر البرتقال وعصيره، يخلق طبقات راقية حيث إشراق الحمضيات يعزز شخصية البرغموت الزهرية للشاي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Earl.jpeg", calories:"2 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf4", cat:"Refreshers", enName:"Strawberry Mojito", arName:"موهيتو بالفراولة", price:42, enDesc:"Berry-crusted classic—fresh strawberries muddled with mint, lime, and cane sugar, topped with soda for vibrant, fruity twist on traditional Cuban refreshment.", arDesc:"كلاسيكي مطلي بالتوت—فراولة طازجة تُهرس مع النعناع والليمون الحامض وسكر القصب، تتوج بمياه غازية لنسخة نابضة وفاكهية من المنعش الكوبي التقليدي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Strawberrymojito.jpg", calories:"160 kcal", dietary:[] },
    { id:"rf5", cat:"Refreshers", enName:"Passion Fruit Mojito", arName:"موهيتو فاكهة العاطفة", price:42, enDesc:"Tropical reinvention—exotic passion fruit pulp blended with traditional mojito elements, creating vibrant, tangy-sweet celebration of Caribbean flavors with floral undertones.", arDesc:"إعادة اختراع استوائية—لب باشن فروت غريب يُخلط مع عناصر الموهيتو التقليدية، يخلق احتفالاً نابضاً وحامضاً-حلوماً بنكهات الكاريبي مع نغمات زهرية.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Passionfruit.webp", calories:"170 kcal", dietary:[] },
    { id:"rf6", cat:"Refreshers", enName:"Blueberry Mojito", arName:"موهيتو التوت الأزرق", price:38, enDesc:"Antioxidant refreshment—wild blueberries muddled with fresh ingredients, creating deep purple hue and complex berry notes that elevate traditional mojito to new dimensions.", arDesc:"انتعاش مضاد للأكسدة—توت أزرق بري يُهرس مع مكونات طازجة، يخلق لوناً أرجوانياً عميقاً ونفحات توت معقدة ترفع الموهيتو التقليدي إلى أبعاد جديدة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Blueberrymojito.webp", calories:"150 kcal", dietary:[] },
    { id:"rf7", cat:"Refreshers", enName:"Black Mulberry Mojito", arName:"موهيتو التوت", price:40, enDesc:"Deep berry elegance—rich black mulberries imparting sophisticated sweetness and jewel-toned color to classic mojito, creating luxurious twist with antioxidant benefits.", arDesc:"أناقة توتية عميقة—توت أسود غني يمنح حلاوة راقية ولوناً جوهراً للموهيتو الكلاسيكي، يخلق نسخة فاخرة بفوائد مضادات الأكسدة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Mulberrymojito.jpg", calories:"170 kcal", dietary:[] },
    { id:"rf8", cat:"Refreshers", enName:"Mix Berries Mojito", arName:"موهيتو التوت المختلط", price:47, enDesc:"Berry symphony—orchestral blend of strawberries, raspberries, blackberries, and blueberries creating complex flavor profile where each berry contributes distinct notes to harmonious whole.", arDesc:"سمفونية توتية—مزيج أوركستري من الفراولة، التوت الأحمر، التوت الأسود، والتوت الأزرق يخلق ملف نكهة معقد حيث يساهم كل توت بنفحات مميزة للكل المتناغم.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Mixberriesmojito.webp", calories:"176 kcal", dietary:[] },
    { id:"rf9", cat:"Refreshers", enName:"Cooling Breeze", arName:"نسيم بارد", price:38, enDesc:"Sensory revival—fresh mint and lime essence combined with sparkling water, creating zero-alcohol refreshment that cleanses palate and revitalizes senses with herbal clarity.", arDesc:"إحياء حسي—جوهر النعناع الطازج والليمون الحامض مجتمع مع مياه غازية، يخلق انتعاشاً خالياً من الكحول ينظف الحنك وينعش الحواس بوضوح عشبي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Coolingbreeze.jpg", calories:"110 kcal", dietary:[] },
    { id:"rf10", cat:"Refreshers", enName:"Still Water (Small)", arName:"مياه عادية (صغير)", price:11, enDesc:"Pure hydration—crisp, filtered still water in convenient small bottle, perfect accompaniment to coffee or standalone refreshment for everyday vitality.", arDesc:"ترطيب نقي—مياه عادية منعشة ومصفاة في زجاجة صغيرة ملائمة، مرافق مثالي للقهوة أو انتعاش مستقل للنشاط اليومي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/WaterBig.jpg", calories:"0 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf11", cat:"Refreshers", enName:"Still Water (Big)", arName:"مياه عادية (كبير)", price:21, enDesc:"Ample purity—larger bottle of premium still water for sharing or extended enjoyment, maintaining crisp, clean taste that complements any meal or beverage.", arDesc:"نقاء وافر—زجاجة أكبر من المياه العادية الفاخرة للمشاركة أو الاستمتاع الممتد، تحافظ على الطعم المنعش والنظيف الذي يكمل أي وجبة أو مشروب.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Watersmall.jpg", calories:"0 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf12", cat:"Refreshers", enName:"Sparkling Water", arName:"مياه غازية", price:21, enDesc:"Effervescent cleanse—naturally carbonated water with fine bubbles that refresh palate, aid digestion, and provide elegant alternative to still water with lively mouthfeel.", arDesc:"تنظيف فوار—مياه متفحمة طبيعياً بفقاعات ناعمة تنعش الحنك، تساعد الهضم، وتقدم بديلاً أنيقاً للمياه العادية بإحساس فم حيوي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Sparkling.jpg", calories:"0 kcal", dietary:["vegan","dairy-free"] },
    { id:"rf13", cat:"Refreshers", enName:"Kinza Cola", arName:"كينزا كولا", price:17, enDesc:"Classic refreshment—signature cola with balanced sweetness and familiar effervescence, offering nostalgic comfort and perfect pairing with savory dishes or solo enjoyment.", arDesc:"انتعاش كلاسيكي—كولا مميزة بحلاوة متوازنة وفحمية مألوفة، تقدم راحة حنينية وقرينة مثالية مع الأطباق المالحة أو الاستمتاع المنفرد.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Cola.jpg", calories:"150 kcal", dietary:[] },
    { id:"rf14", cat:"Refreshers", enName:"Kinza Cola Zero", arName:"كينزا كولا زيرو", price:17, enDesc:"Guilt-free fizz—sugar-free cola maintaining classic flavor profile with zero calories, offering same satisfying refreshment without compromising on taste experience.", arDesc:"فحم خالٍ من الذنب—كولا خالية من السكر تحافظ على ملف النكهة الكلاسيكي بصفر سعرات، تقدم نفس الانتعاش المرضي دون المساس بتجربة التذوق.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Zero.jpg", calories:"0 kcal", dietary:[] },
    { id:"bak2", cat:"Baklava & Beyond", enName:"Turkish Mix Baklava", arName:"بقلاوة تركية مشكلة", price:65, enDesc:"Artisanal assortment—carefully curated selection of Gaziantep's finest baklava varieties, featuring multiple nut fillings, syrup saturation levels, and pastry techniques in one exquisite box.", arDesc:"تشكيلة حرفية—اختيار مدقق بعناية من أفضل أنواع بقلاوة غازي عنتاب، يضم حشوات مكسرات متعددة، مستويات تشريب بالشراب، وتقنيات عجين في صندوق واحد فاخر.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Mix.jpeg", calories:"450 kcal", dietary:["contains-nuts"] },
    { id:"bak3", cat:"Baklava & Beyond", enName:"Carrot Slice Baklava", arName:"بقلاوة شريحة الجزر", price:40, enDesc:"Innovative tradition—classic baklava enriched with carrot puree that adds natural sweetness and moist texture, layered with pistachios and bathed in rose-orange blossom syrup.", arDesc:"تقليد مبتكر—بقلاوة كلاسيكية معززة بهريس الجزر الذي يضيف حلاوة طبيعية وقواماً رطباً، مطبقة بالفستق ومغمورة بشراب ماء الورد-زهر البرتقال.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Carrot.jpeg", calories:"420 kcal", dietary:["vegetarian","contains-nuts"] },
    { id:"bak4", cat:"Baklava & Beyond", enName:"Carrot Slice Baklava With Ice Cream", arName:"بقلاوة شريحة الجزر مع الآيس كريم", price:51, enDesc:"Temperature contrast—warm carrot baklava paired with cool vanilla bean ice cream, creating delightful interplay of crispy pastry, sweet syrup, and creamy cold that elevates both elements.", arDesc:"تباين درجات الحرارة—بقلاوة جزر دافئة مقترنة بآيس كريم فانيليا بارد، تخلق تفاعلاً مسلياً بين العجين المقرمش، الشراب الحلو، والكريمية الباردة التي ترفع كلا العنصرين.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Carroticecream.jpeg", calories:"620 kcal", dietary:["contains-nuts","contains-dairy"] },
    { id:"bak5", cat:"Baklava & Beyond", enName:"Trio Baklava", arName:"تريو بقلاوة", price:45, enDesc:"Trinity of textures—three distinct baklava styles showcasing different techniques: rolled, open-faced, and diamond-cut, each highlighting unique aspects of this pastry art form.", arDesc:"ثالوث القوام—ثلاثة أنماط بقلاوة مميزة تعرض تقنيات مختلفة: ملفوف، مكشوف، ومقطع بشكل الماس، كل منها يسلط الضوء على جوانب فريدة من هذا الفن المعجني.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/TrioBaklava.jpeg", calories:"480 kcal", dietary:["contains-nuts"] },
    { id:"bak6", cat:"Baklava & Beyond", enName:"Fruit Cake", arName:"كيك الفواكه", price:36, enDesc:"Celebratory classic—moist cake studded with candied citrus peel, raisins, and nuts, soaked in fruit juice for tender crumb and festive flavor that improves with each day.", arDesc:"كلاسيكي احتفالي—كيك رطب مرصّع بقشور الحمضيات المسكرة، الزبيب، والمكسرات، منقوع في عصير فواكه للفتات الطري والنكهة الاحتفالية التي تتحسن مع كل يوم.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Fruitcake.jfif", calories:"420 kcal", dietary:["contains-dairy"], popular:true },
    { id:"bak7", cat:"Baklava & Beyond", enName:"Honey Cake", arName:"كيك العسل", price:40, enDesc:"Layered sweetness—multiple thin cake layers alternating with honey cream, creating moist, tender dessert where floral honey notes develop complexity with each delicate bite.", arDesc:"حلاوة متعددة الطبقات—طبقات كيك رقيقة متعددة تتبادل مع كريمة العسل، تخلق حلوى رطبة وطرية حيث تتطور نفحات العسل الزهرية إلى تعقيد مع كل قضمة دقيقة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Honeycake.jfif", calories:"430 kcal", dietary:["contains-dairy"], popular:true },
    { id:"bak8", cat:"Baklava & Beyond", enName:"Vanilla Cake", arName:"كيك الفانيلا", price:36, enDesc:"Timeless simplicity—fluffy cake with pure Madagascar vanilla bean infusion, offering clean, aromatic sweetness that serves as perfect canvas for coffee pairing or standalone enjoyment.", arDesc:"بساطة خالدة—كيك منفوش بنقيع فانيليا مدغشقر نقية، يقدم حلاوة نظيفة وعطرة تعمل كلوحة مثالية لقرينة القهوة أو الاستمتاع المنفرد.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Vanillacake.jfif", calories:"410 kcal", dietary:["contains-dairy"], popular:true },
    { id:"bak9", cat:"Baklava & Beyond", enName:"Chocolate Fruit Cake", arName:"كيك الشوكولاتة", price:36, enDesc:"Dual decadence—rich chocolate cake interwoven with rum-soaked dried fruits and nuts, creating sophisticated dessert where cocoa depth meets festive fruit complexity.", arDesc:"فخامة مزدوجة—كيك شوكولاتة غني منسوج مع فواكه مجففة منقوعة بالروم ومكسرات، يخلق حلوى راقية حيث يلتقي عمق الكاكاو بتعقيد الفواكه الاحتفالي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Chocolatecake.jfif", calories:"450 kcal", dietary:["contains-dairy"], popular:true },
    { id:"bak10", cat:"Baklava & Beyond", enName:"Kunafa", arName:"كنافة", price:40, enDesc:"Cheese perfection—shredded kataifi pastry baked with Akkawi cheese until golden, soaked in rose-scented syrup, creating perfect balance of salty cheese, sweet syrup, and crispy texture.", arDesc:"كمال الجبن—عجينة الكنافة المفتولة تُخبز مع جبنة عكاوي حتى تصبح ذهبية، تنقع في شراب معطر بماء الورد، تخلق توازناً مثالياً بين الجبن المالح، الشراب الحلو، والقوام المقرمش.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Kunafa.jpeg", calories:"520 kcal", dietary:["contains-dairy"] },
    { id:"bak11", cat:"Baklava & Beyond", enName:"Chocolate Cake", arName:"كعكة الشكولاتة", price:40, enDesc:"Decadent foundation—deep, moist chocolate cake with intense cocoa flavor, versatile enough for standalone enjoyment or as base for further dessert customization and pairing.", arDesc:"أساس فاخر—كعكة شوكولاتة عميقة ورطبة بنكهة كاكاو مكثفة، متعددة الاستخدامات بما يكفي للاستمتاع المنفرد أو كقاعدة لمزيد من تخصيص الحلوى والقرينة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Chocolate.jpg", calories:"480 kcal", dietary:["contains-dairy"], popular:true },
    { id:"bak13", cat:"Baklava & Beyond", enName:"Brownies", arName:"براونيز", price:45, enDesc:"Fudgy perfection—dense, rich brownies with crackly top and gooey center, balancing deep chocolate intensity with just enough sweetness to satisfy without overwhelming.", arDesc:"كمال فادج—براونيز كثيفة وغنية بقمة متشققة ومركز لزج، توازن بين شدة الشوكولاتة العميقة وما يكفي من الحلاوة للإشباع دون طغيان.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Brown.jpg", calories:"380 kcal", dietary:["contains-dairy"] },
    { id:"bak14", cat:"Baklava & Beyond", enName:"Tiramisu", arName:"تيراميسو", price:50, enDesc:"Italian masterpiece—ladyfinger layers soaked in espresso and Marsala, alternating with mascarpone cream and dusted with cocoa, creating sophisticated coffee dessert that improves with time.", arDesc:"تحفة إيطالية—طبقات بسكويت السيدة منقوعة في إسبرسو ومارسالا، تتبادل مع كريمة الماسكاربون وتُذرّ بالكاكاو، تخلق حلوى قهوة راقية تتحسن مع الوقت.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Tiramisu.jpg", calories:"420 kcal", dietary:["contains-dairy"] },
    { id:"bak15", cat:"Baklava & Beyond", enName:"Almond Chocolate Cake", arName:"كعكة الشوكولاتة باللوز", price:40, enDesc:"Nutty sophistication—moist chocolate cake with almond meal integrated into batter and toasted almond garnish, creating textural contrast and flavor harmony between cocoa and nuts.", arDesc:"رقة جوزية—كعكة شوكولاتة رطبة مع طحين اللوز المدمج في الخليط وتزيين لوز محمص، يخلق تبايناً قوامياً وتناغماً نكهياً بين الكاكاو والمكسرات.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Almond.jpg", calories:"490 kcal", dietary:["contains-nuts"] },
    { id:"bak17", cat:"Baklava & Beyond", enName:"Chocolate Pistachio Cake", arName:"كعكة الشوكولاتة والفستق", price:40, enDesc:"Green luxury—rich chocolate cake adorned with crushed pistachios that provide vibrant color contrast, subtle saltiness, and elegant crunch against smooth chocolate background.", arDesc:"فخامة خضراء—كعكة شوكولاتة غنية مزينة بفستق مفتت يوفر تباين لوني نابض، ملوحة خفيفة، وقرمشة أنيقة ضد خلفية الشوكولاتة الناعمة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Chocolate_pistachio.jpg", calories:"510 kcal", dietary:["contains-nuts"] },
    { id:"bak18", cat:"Baklava & Beyond", enName:"Strawberry Cake", arName:"كعكة الفراولة", price:45, enDesc:"Spring celebration—light sponge cake layered with fresh strawberry slices and cream, capturing fruit's natural sweetness and floral notes in visually stunning, seasonally inspired dessert.", arDesc:"احتفال ربيعي—كعكة إسفنجية خفيفة مطبقة بشرائح فراولة طازجة وكريمة، تلتقط حلاوة الفاكهة الطبيعية ونفحاتها الزهرية في حلوى مذهلة بصرياً ومستوحاة من الموسم.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Strawberry.jpg", calories:"470 kcal", dietary:["contains-dairy"] },
    { id:"bak19", cat:"Baklava & Beyond", enName:"White Almond Cake", arName:"كعكة اللوز البيضاء", price:42, enDesc:"Elegant simplicity—delicate almond-flavored cake with fine crumb and subtle sweetness, often enjoyed with tea or as light dessert that highlights almond's sophisticated character.", arDesc:"بساطة أنيقة—كعكة بنكهة اللوز الدقيقة بفتات ناعم وحلاوة خفيفة، غالباً ما تُستمتع مع الشاي أو كحلوى خفيفة تسلط الضوء على شخصية اللوز الراقية.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/White.jpg", calories:"500 kcal", dietary:["contains-nuts"] },
    { id:"bak20", cat:"Baklava & Beyond", enName:"Trileche With Milk", arName:"تريليتش باللبن", price:42, enDesc:"Triple moisture—sponge cake soaked in three-milk blend (evaporated, condensed, and cream), creating incredibly moist dessert with rich, creamy texture and caramelized notes.", arDesc:"رطوبة ثلاثية—كعكة إسفنجية منقوعة في مزيج ثلاثي الحليب (مبخر، مكثف، وكريمة)، تخلق حلوى رطبة بشكل لا يصدق بقوام غني كريمي ونفحات مكرملة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Trileche.jpg", calories:"540 kcal", dietary:["contains-dairy"] },
    { id:"bak21", cat:"Baklava & Beyond", enName:"San Sebastian Cheesecake", arName:"تشيز كيك سان سيباستيان", price:42, enDesc:"Basque perfection—cream-centered cheesecake with caramelized top and creamy, almost liquid interior, intentionally underbaked to create unique texture contrast and rich flavor.", arDesc:"كمال باسكي—تشيز كيك مركز الكريمة بقمة مكرملة وداخل كريمي شبه سائل، يُخبز عمداً بشكل غير كامل لخلق تباين قوام فريد ونكهة غنية.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Sebastian.jpg", calories:"520 kcal", dietary:["contains-dairy"] },
    { id:"bak22", cat:"Baklava & Beyond", enName:"Cheesecake", arName:"تشيز كيك", price:42, enDesc:"Classic foundation—creamy New York-style cheesecake with graham cracker crust, serving as perfect canvas for various toppings or enjoyed in its pure, unadorned perfection.", arDesc:"أساس كلاسيكي—تشيز كيك كريمي على الطريقة النيويوركية بقشرة بسكويت غراهام، يعمل كلوحة مثالية للطبقات المختلفة أو يُستمتع به في كماله النقي غير المزين.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/cheesecake.webp", calories:"500 kcal", dietary:["contains-dairy"] },
    { id:"bak23", cat:"Baklava & Beyond", enName:"Pecan Cake", arName:"كيك البقان", price:45, enDesc:"Southern elegance—moist cake loaded with toasted pecans, often with caramel or maple notes, creating rich, nutty dessert that celebrates this distinctive nut's buttery character.", arDesc:"أناقة جنوبية—كعكة رطبة محشوة ببقان محمص، غالباً بنفحات كراميل أو قيقب، تخلق حلوى جوزية غنية تحتفظ بالشخصية الزبدية لهذا الجوز المميز.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Pecan.jpg", calories:"350 kcal", dietary:["vegetarian"] },
    { id:"bak24", cat:"Baklava & Beyond", enName:"Fanzuella Sweet", arName:"حلوى فانزويلا", price:45, enDesc:"Exotic delight—traditional Venezuelan sweet with unique texture and flavor profile, offering cultural dessert experience that combines local ingredients in balanced, memorable treat.", arDesc:"لذة غريبة—حلوى فانزويلية تقليدية بقوام فريد وملف نكهة، تقدم تجربة حلوى ثقافية تجمع مكونات محلية في تناول متوازن لا يُنسى.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Fanzuella.webp", calories:"300 kcal", dietary:["vegetarian"] },
    { id:"fd1", cat:"Fondue & Nuts", enName:"Strawberry Fondue", arName:"فوندو بالفراولة", price:40, enDesc:"Ruby indulgence—plump, ripe strawberries served with warm milk chocolate fondue, creating interactive dessert where fruit's natural acidity cuts through chocolate's richness perfectly.", arDesc:"تناول ياقوتي—فراولة ممتلئة وناضجة تُقدم مع فوندو شوكولاتة حليب دافئ، تخلق حلوى تفاعلية حيث حمضية الفاكهة الطبيعية تقطع غنى الشوكولاتة بشكل مثالي.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Fondue1.jpeg", calories:"320 kcal", dietary:["contains-dairy"] },
    { id:"fd2", cat:"Fondue & Nuts", enName:"Strawberry-Banana Fondue", arName:"فوندو فراولة وموز", price:45, enDesc:"Tropical duo—fresh strawberries and ripe banana slices paired with chocolate fondue, offering textural contrast between berry firmness and banana creaminess against smooth chocolate coating.", arDesc:"ثنائي استوائي—فراولة طازجة وشرائح موز ناضجة مقترنة بفوندو شوكولاتة، تقدم تبايناً قوامياً بين متانة التوت وكريمية الموز ضد طلاء الشوكولاتة الناعم.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Fondue2.jpeg", calories:"410 kcal", dietary:["contains-dairy"] },
    { id:"fd3", cat:"Fondue & Nuts", enName:"Turkiana Fondue", arName:"فوندو تركيانا", price:59, enDesc:"Signature extravaganza—assortment of fresh fruits, brownie pieces, and marshmallows with both dark and milk chocolate fondues, creating shareable dessert experience for memorable gatherings.", arDesc:"تباهي مميز—تشكيلة من فواكه طازجة، قطع براوني، ومرشملو مع فوندو شوكولاتة داكنة وحليب، تخلق تجربة حلوى قابلة للمشاركة للجمعات التي لا تُنسى.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Fondue3.jpeg", calories:"480 kcal", dietary:[] },
    { id:"fd4", cat:"Fondue & Nuts", enName:"Nuts Stand-Tall", arName:"مكسرات ستاند كبير", price:99, enDesc:"Premium tower—generous assortment of roasted nuts including almonds, walnuts, pistachios, and cashews, presented in elegant stand for sophisticated snacking or elegant accompaniment to drinks.", arDesc:"برج فاخر—تشكيلة سخية من مكسرات محمصة تشمل اللوز، الجوز، الفستق، والكاجو، مُقدمة في حامل أنيق للتناول الراقي أو المرافق الأنيق للمشروبات.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Nuts.jpg", calories:"300 kcal", dietary:["contains-nuts"] },
    { id:"fd5", cat:"Fondue & Nuts", enName:"Nuts Stand-Small", arName:"مكسرات ستاند صغير", price:60, enDesc:"Petite selection—curated mix of premium roasted nuts in smaller presentation, offering same quality and variety for individual enjoyment or intimate sharing moments.", arDesc:"اختيار صغير—مزيج مدقق من مكسرات محمصة فاخرة في تقديم أصغر، يقدم نفس الجودة والتنوع للاستمتاع الفردي أو لحظات المشاركة الحميمة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Nutsmall.jpg", calories:"180 kcal", dietary:["contains-nuts"] },
    { id:"fd6", cat:"Fondue & Nuts", enName:"Assorted Nut Platter", arName:"طبق مكسرات مشكل", price:35, enDesc:"Textural journey—artfully arranged selection of various nuts showcasing different roasting levels and seasoning approaches, creating exploration of flavors and crunch variations.", arDesc:"رحلة قوامية—اختيار مرتب بفنية من مكسرات متنوعة تعرض مستويات تحميص مختلفة ومناهج تتبيل، تخلق استكشافاً للنكهات وتباينات القرمشة.", image:"https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Nutsplatter.jpg", calories:"180 kcal", dietary:["contains-nuts"] },

// 3. FAST IMAGE LOADING WITH LAZY LOADING
// ============================================

const imageCache = new Map();

async function loadImageFast(url) {
    if (imageCache.has(url)) {
        return imageCache.get(url);
    }
    
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
            imageCache.set(url, img);
            resolve(img);
        };
        img.onerror = () => {
            // Create fallback
            const canvas = document.createElement('canvas');
            canvas.width = 300;
            canvas.height = 200;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createLinearGradient(0, 0, 300, 200);
            gradient.addColorStop(0, '#1d0509');
            gradient.addColorStop(1, '#2a080d');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 300, 200);
            
            ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
            ctx.font = '16px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Turkiana Café', 150, 100);
            
            const fallbackImg = new Image();
            fallbackImg.src = canvas.toDataURL();
            imageCache.set(url, fallbackImg);
            resolve(fallbackImg);
        };
        img.src = url;
    });
}

// ============================================
// 4. KIOSK INITIALIZATION
// ============================================

function initKioskMode() {
    document.getElementById('kiosk-overlay').style.display = 'flex';
    
    document.getElementById('start-experience-btn').addEventListener('click', startKioskSession);
    document.getElementById('reset-timer-btn').addEventListener('click', resetIdleTimer);
    
    document.getElementById('kiosk-overlay').addEventListener('click', (e) => {
        if (e.target.id === 'kiosk-overlay') {
            startKioskSession();
        }
    });
    
    setTimeout(() => {
        if (!state.isSessionActive) {
            startKioskSession();
        }
    }, 10000);
}

function startKioskSession() {
    state.isSessionActive = true;
    document.body.classList.add('kiosk-mode');
    document.getElementById('kiosk-overlay').classList.add('hidden');
    
    startSessionTimer();
    
    setTimeout(() => {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }, 500);
    
    initApp();
}

function resetSession() {
    document.body.classList.remove('kiosk-mode');
    document.getElementById('kiosk-overlay').classList.remove('hidden');
    
    if (state.sessionTimer) clearInterval(state.sessionTimer);
    if (state.idleTimer) clearTimeout(state.idleTimer);
    
    state.isSessionActive = false;
    state.sessionTime = 300;
    updateTimerDisplay();
    
    closeItemModal();
    clearFilters();
    updateUI();
}

function startSessionTimer() {
    if (state.sessionTimer) clearInterval(state.sessionTimer);
    
    state.sessionTimer = setInterval(() => {
        state.sessionTime--;
        updateTimerDisplay();
        
        if (state.sessionTime <= 0) {
            resetSession();
        } else if (state.sessionTime <= state.idleWarningTime) {
            showIdleWarning();
        }
    }, 1000);
}

function resetIdleTimer() {
    state.sessionTime = 300;
    updateTimerDisplay();
    document.getElementById('idle-warning').style.display = 'none';
    startSessionTimer();
}

function updateTimerDisplay() {
    const minutes = Math.floor(state.sessionTime / 60);
    const seconds = state.sessionTime % 60;
    return `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
}

function showIdleWarning() {
    if (document.getElementById('itemModal').classList.contains('active')) {
        return;
    }
    
    document.getElementById('idle-warning').style.display = 'block';
    
    setTimeout(() => {
        if (document.getElementById('idle-warning').style.display === 'block') {
            resetSession();
        }
    }, 30000);
}

// ============================================
// 5. UTILITY FUNCTIONS
// ============================================

function showToast(message, type = "success") {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.className = `toast ${type}`;
    toast.style.display = "block";
    
    setTimeout(() => {
        toast.style.display = "none";
    }, 2000);
}

function formatPrice(price) {
    return typeof price === 'number' ? price.toFixed(2) : '0.00';
}

function debounce(func, wait) {
    let timeout;
    return function executedFunction(...args) {
        const later = () => {
            clearTimeout(timeout);
            func(...args);
        };
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
    };
}

// ============================================
// 6. SNOW ANIMATION
// ============================================

function initSnowAnimation() {
    const canvas = document.getElementById("snow");
    const ctx = canvas.getContext("2d");
    
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    
    resize();
    window.addEventListener("resize", resize);
    
    const flakes = [];
    const FLAKE_COUNT = 60;
    
    for (let i = 0; i < FLAKE_COUNT; i++) {
        flakes.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 1.2 + 0.5,
            d: Math.random() * 0.8 + 0.3,
            vx: Math.random() * 0.1 - 0.05,
            vy: Math.random() * 0.6 + 0.2
        });
    }
    
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        
        for (const flake of flakes) {
            ctx.beginPath();
            ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
            ctx.fill();
        }
        
        move();
    }
    
    function move() {
        for (const flake of flakes) {
            flake.y += flake.vy;
            flake.x += flake.vx;
            
            if (flake.y > canvas.height) {
                flake.y = -5;
                flake.x = Math.random() * canvas.width;
            }
            
            if (flake.x > canvas.width) flake.x = 0;
            if (flake.x < 0) flake.x = canvas.width;
        }
    }
    
    function animate() {
        draw();
        requestAnimationFrame(animate);
    }
    
    animate();
}

// ============================================
// 7. FLOATING CATEGORY NAVIGATION (ALWAYS VISIBLE)
// ============================================

function renderFloatingCategories() {
    const floatingCategories = document.getElementById("floatingCategories");
    floatingCategories.innerHTML = "";
    
    const allBtn = document.createElement("button");
    allBtn.className = "floating-category" + (!state.activeCategory ? " active" : "");
    allBtn.innerHTML = "✨ All";
    allBtn.onclick = () => {
        state.activeCategory = null;
        updateUI();
        scrollToTop();
    };
    floatingCategories.appendChild(allBtn);
    
    state.categories.forEach(cat => {
        const btn = document.createElement("button");
        btn.className = "floating-category" + (state.activeCategory === cat ? " active" : "");
        btn.innerHTML = cat;
        btn.onclick = () => {
            state.activeCategory = cat;
            updateUI();
            scrollToCategory(cat);
        };
        floatingCategories.appendChild(btn);
    });
    
    initCategoryScroll();
}

function initCategoryScroll() {
    const floatingCategories = document.getElementById("floatingCategories");
    let isDragging = false;
    let startX;
    let scrollLeft;
    
    floatingCategories.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].pageX - floatingCategories.offsetLeft;
        scrollLeft = floatingCategories.scrollLeft;
    });
    
    floatingCategories.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        e.preventDefault();
        const x = e.touches[0].pageX - floatingCategories.offsetLeft;
        const walk = (x - startX) * 1.5;
        floatingCategories.scrollLeft = scrollLeft - walk;
    });
    
    floatingCategories.addEventListener('touchend', () => {
        isDragging = false;
    });
}

function scrollToCategory(cat) {
    const section = document.getElementById(`section-${cat.replace(/\s+/g, "-").toLowerCase()}`);
    if (section) {
        section.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
}

function scrollToTop() {
    document.querySelector('.content-container').scrollTo({
        top: 0,
        behavior: 'smooth'
    });
}

function handleScroll() {
    const currentCategoryIndicator = document.getElementById("currentCategoryIndicator");
    const container = document.querySelector('.content-container');
    
    if (state.isScrolling) return;
    
    state.isScrolling = true;
    
    // REMOVED: Code that hides floating categories on scroll
    
    // Update current category indicator
    const sections = document.querySelectorAll('.section');
    let currentSection = null;
    
    sections.forEach(section => {
        const rect = section.getBoundingClientRect();
        if (rect.top <= 150 && rect.bottom >= 150) {
            currentSection = section;
        }
    });
    
    if (currentSection) {
        const categoryName = currentSection.querySelector('h2').textContent;
        currentCategoryIndicator.textContent = categoryName;
        currentCategoryIndicator.classList.add('visible');
        
        // Update active category button
        document.querySelectorAll('.floating-category').forEach(btn => {
            btn.classList.remove('active');
        });
        
        if (categoryName !== 'All') {
            const activeBtn = Array.from(document.querySelectorAll('.floating-category')).find(btn => 
                btn.textContent === categoryName
            );
            if (activeBtn) {
                activeBtn.classList.add('active');
            }
        } else {
            document.querySelector('.floating-category:first-child').classList.add('active');
        }
    } else {
        currentCategoryIndicator.classList.remove('visible');
    }
    
    setTimeout(() => {
        state.isScrolling = false;
    }, 100);
}

// ============================================
// 8. RENDER FUNCTIONS (OPTIMIZED)
// ============================================

async function renderContent() {
    const mainContent = document.getElementById("mainContent");
    
    // Show loading indicator
    mainContent.innerHTML = `
        <div style="text-align: center; padding: 40px; color: var(--muted);">
            <div class="loading"></div>
            <p style="margin-top: 20px;">Loading menu items...</p>
        </div>
    `;
    
    // Filter items
    const filtered = allItems.filter(item => {
        const matchCat = !state.activeCategory || item.cat === state.activeCategory;
        const matchSearch = !state.searchQuery || 
            item.enName.toLowerCase().includes(state.searchQuery) || 
            item.arName.includes(state.searchQuery);
        return matchCat && matchSearch;
    });
    
    // No results
    if (filtered.length === 0) {
        setTimeout(() => {
            mainContent.innerHTML = `
                <div class="no-results">
                    <strong>No items found</strong>
                    <p>Try adjusting your search terms</p>
                </div>
            `;
        }, 100);
        return;
    }
    
    // Group by category
    const grouped = {};
    filtered.forEach(item => {
        if (!grouped[item.cat]) grouped[item.cat] = [];
        grouped[item.cat].push(item);
    });
    
    // Render sections
    let html = '';
    for (const [cat, items] of Object.entries(grouped)) {
        html += `
            <div class="section" id="section-${cat.replace(/\s+/g, "-").toLowerCase()}">
                <h2>${cat}</h2>
                <p>Touch any item for details</p>
                <div class="grid">
        `;
        
        // Create cards
        items.forEach(item => {
            html += `
                <div class="card" tabindex="0" role="button" aria-label="${item.enName}, ${item.price} QAR" onclick="openItemModal(${JSON.stringify(item).replace(/"/g, '&quot;')})">
                    <img src="${item.image}" 
                         alt="${item.enName}" 
                         class="card-image lazy-image" 
                         loading="lazy"
                         width="300"
                         height="200"
                         onload="this.classList.add('loaded')">
                    <div class="card-body">
                        <h3>${item.enName}</h3>
                        <div class="card-ar-name">${item.arName}</div>
                        <span class="card-price">QAR ${formatPrice(item.price)}</span>
                    </div>
                    ${item.popular ? '<div class="card-badge" aria-label="Chef\'s Pick">Chef\'s Pick</div>' : ''}
                </div>
            `;
        });
        
        html += `
                </div>
            </div>
        `;
    }
    
    // Update content
    setTimeout(() => {
        mainContent.innerHTML = html;
        
        // Add lazy loading for images
        const lazyImages = document.querySelectorAll('.lazy-image');
        lazyImages.forEach(img => {
            if (img.complete) {
                img.classList.add('loaded');
            }
        });
    }, 50);
}

function clearFilters() {
    state.searchQuery = "";
    state.activeCategory = null;
    
    updateUI();
    scrollToTop();
}

// ============================================
// 9. MODAL FUNCTIONS (Fixed size, not full screen)
// ============================================

function openItemModal(item) {
    state.currentModalItem = item;
    
    const modal = document.getElementById("itemModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalImage = document.getElementById("modalImage");
    const modalDescEn = document.getElementById("modalDescEn");
    const modalDescAr = document.getElementById("modalDescAr");
    const modalCalories = document.getElementById("modalCalories");
    const modalDietary = document.getElementById("modalDietary");
    const modalPrice = document.getElementById("modalPrice");
    
    modalTitle.textContent = item.enName;
    modalImage.src = item.image;
    modalImage.alt = item.enName;
    modalDescEn.textContent = item.enDesc;
    modalDescAr.textContent = item.arDesc;
    modalCalories.textContent = "☕ " + item.calories;
    modalDietary.textContent = item.dietary.length ? "🏷️ " + item.dietary.join(" • ") : "House Selection";
    modalPrice.textContent = formatPrice(item.price);
    
    modal.classList.add("active");
    modal.setAttribute("aria-hidden", "false");
    document.body.style.overflow = "hidden";
    
    setTimeout(() => {
        modal.querySelector(".modal-close").focus();
    }, 100);
}

function closeItemModal() {
    const modal = document.getElementById("itemModal");
    modal.classList.remove("active");
    modal.setAttribute("aria-hidden", "true");
    document.body.style.overflow = "";
    state.currentModalItem = null;
}

// ============================================
// 10. UI UPDATE FUNCTION
// ============================================

function updateUI() {
    renderFloatingCategories();
    renderContent();
}

// ============================================
// 11. MAIN APP INITIALIZATION
// ============================================

function initApp() {
    initSnowAnimation();
    renderFloatingCategories();
    renderContent();
    
    const container = document.querySelector('.content-container');
    container.addEventListener('scroll', debounce(handleScroll, 50));
    
    document.querySelector(".modal-close").addEventListener("click", closeItemModal);
    
    document.getElementById("itemModal").addEventListener("click", (e) => {
        if (e.target === document.getElementById("itemModal")) {
            closeItemModal();
        }
    });
    
    document.addEventListener("fullscreenchange", () => {
        state.isFullscreen = !!document.fullscreenElement;
    });
    
    window.addEventListener("orientationchange", () => {
        setTimeout(() => {
            renderFloatingCategories();
            renderContent();
        }, 300);
    });
    
    enterFullscreen();
}

async function enterFullscreen() {
    try {
        const elem = document.documentElement;
        
        if (elem.requestFullscreen) {
            await elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
            await elem.webkitRequestFullscreen();
        } else if (elem.msRequestFullscreen) {
            await elem.msRequestFullscreen();
        }
        
        state.isFullscreen = true;
    } catch (err) {
        console.log("Fullscreen error:", err);
    }
}

// ============================================
// 12. START THE APPLICATION
// ============================================

document.addEventListener("DOMContentLoaded", () => {
    initKioskMode();
});

// Make openItemModal available globally
window.openItemModal = openItemModal;
</script>
