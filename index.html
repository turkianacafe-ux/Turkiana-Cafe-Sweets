<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Turkiana Cafe & Sweets — Menu (EN / AR)</title>
  <meta name="description" content="Turkiana Cafe & Sweets — bilingual menu (English & Arabic) with responsive layout, marquee, calories, separate landing and menu pages." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#07070a;
      --gold:#caa84a;
      --maroon:#7a1921;
      --muted:#9b9b9f;
      --radius:18px;
      --max-width:1100px;
      --shadow:0 20px 60px rgba(2,6,23,0.6);
      /* glass/tint colors for main menu */
      --glass-bg: linear-gradient(180deg, rgba(122,25,33,0.24), rgba(255,255,255,0.02));
      --glass-border: rgba(255,255,255,0.06);
      --glass-highlight: rgba(202,168,74,0.06);
    }

    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}
    html,body{height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial;background:var(--bg);color:#fff;-webkit-text-size-adjust:100%}
    a { color: inherit; text-decoration: none; }

    /* Background video */
    .bg-video{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
    .bg-video video{width:100%;height:100%;object-fit:cover;opacity:0.86;filter:contrast(1.01) saturate(1.02) brightness(1.04)}
    .bg-overlay{position:fixed;inset:0;z-index:1;background:
      radial-gradient(800px 400px at 10% 20%, rgba(255,255,255,0.02), transparent 10%),
      radial-gradient(700px 300px at 85% 80%, rgba(255,255,255,0.02), transparent 12%),
      linear-gradient(180deg, rgba(5,5,8,0.06), rgba(3,3,5,0.14));
      backdrop-filter: blur(6px) saturate(110%); -webkit-backdrop-filter: blur(6px) saturate(110%);
      pointer-events:none; }

    /* Top controls */
    .top-controls{position:fixed;top:14px;left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:var(--max-width);z-index:12;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
    .lang{pointer-events:auto;padding:8px 12px;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.06);color:#fff;font-weight:700;cursor:pointer}

    /* App container */
    .app{min-height:100vh;display:flex;align-items:stretch;justify-content:center;position:relative;overflow:hidden;padding:48px 12px;z-index:6}
    .centered{width:100%;max-width:var(--max-width);margin:0 auto}

    /* Marquee */
    .marquee-wrap{width:100%;overflow:hidden;border-radius:12px;margin-bottom:18px;pointer-events:none}
    .marquee{display:flex;gap:18px;align-items:center;white-space:nowrap;animation:marquee 26s linear infinite}
    .marquee img{height:84px;border-radius:10px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    @keyframes marquee {0%{transform:translateX(0%);}100%{transform:translateX(-50%);} }

    /* Landing (hero) */
    .landing{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 96px)}
    .hero{width:100%;max-width:980px;border-radius:20px;padding:28px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);backdrop-filter:blur(10px) saturate(120%)}
    .brand{font-size:44px;font-weight:800;color:var(--gold);margin-bottom:6px;font-family:"Playfair Display", serif}
    .sub{color:rgba(255,255,255,0.92);font-weight:700;letter-spacing:.12em;margin-bottom:6px}
    .tag{color:rgba(255,255,255,0.9);margin-bottom:14px}
    .primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));color:#fff;font-weight:800;border:1px solid rgba(255,255,255,0.06);cursor:pointer}

    /* Menu page - modified to use glassy burgundy/gold/white style while preserving original structure */
    .menu-page{display:none;width:100%;max-width:var(--max-width);margin:0 auto;padding-bottom:120px}
    .menu-panel{
      border-radius:16px;
      padding:16px;
      /* iOS-style liquid glass: burgundy tint with gold highlight + frosted blur */
      background:
        linear-gradient(180deg, rgba(122,25,33,0.22), rgba(255,255,255,0.02));
      border:1px solid rgba(255,255,255,0.06);
      box-shadow: 0 30px 80px rgba(11,3,6,0.6), inset 0 1px 0 rgba(255,255,255,0.02);
      backdrop-filter: blur(14px) saturate(120%) contrast(1.02);
      -webkit-backdrop-filter: blur(14px) saturate(120%) contrast(1.02);
      position:relative;
      overflow: hidden;
    }
    /* subtle decorative gold sheen bar at top of menu panel */
    .menu-panel::before{
      content:'';
      position:absolute;
      left:-30%;
      top:-20%;
      width:160%;
      height:32%;
      background:radial-gradient(600px 120px at 50% 0%, rgba(202,168,74,0.07), transparent 40%);
      transform:rotate(-6deg);
      pointer-events:none;
    }

    /* Search & contact (unchanged layout; styles preserved but color tuned) */
    .search{display:flex;justify-content:center;margin:12px 0}
    .search input{width:100%;max-width:760px;padding:12px 16px;border-radius:999px;font-size:15px;border:1px solid rgba(255,255,255,0.06);background:rgba(0,0,0,0.18);color:#fff;outline:none}
    .contact-row-bottom{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
    .contact-pill{display:inline-flex;gap:8px;align-items:center;padding:10px 12px;border-radius:999px;color:#fff;font-weight:700;text-decoration:none;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06);box-shadow:0 10px 30px rgba(0,0,0,0.45);cursor:pointer}

    /* Categories & results (kept same) */
    .categories{display:flex;flex-direction:column;gap:12px;margin-top:8px}
    .category{display:flex;align-items:center;justify-content:space-between;padding:14px;border-radius:14px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.04);color:#fff;font-weight:800;cursor:pointer}
    .category .title{color:var(--gold);font-size:15px}
    .category .chev{color:var(--muted);font-size:17px}
    .items{display:none;flex-direction:column;gap:10px;margin-top:8px;padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border:1px solid rgba(255,255,255,0.02)}
    .items.open{display:flex}
    .flat-results{display:flex;flex-direction:column;gap:12px;margin-top:8px}

    /* Menu item (unchanged) */
    .menu-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.03);cursor:pointer;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,0.45)}
    .thumb{width:84px;height:84px;border-radius:10px;overflow:hidden;background:#111;flex-shrink:0;display:flex;align-items:center;justify-content:center}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .meta{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
    .name{color:var(--gold);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .desc{color:rgba(255,255,255,0.85);font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
    .price{min-width:88px;text-align:right;color:var(--maroon);font-weight:800}
    .calories{font-size:12px;color:rgba(255,255,255,0.78);font-weight:700;margin-top:4px}

    /* Dietary pills */
    .dietary-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
    .diet-pill{font-size:12px;padding:6px 8px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#fff;font-weight:700}
    .diet-vegan{background:#1e6f30}
    .diet-veg{background:#2a7a2a}
    .diet-gluten{background:#8b3d00}
    .diet-nut{background:#6b3a6b}
    .diet-dairy{background:#305a9a}
    .diet-spicy{background:#9b2b2b}

    /* Modal & hover preview */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(2,6,23,0.6)}
    .modal.show{display:flex}
    .modal-card{width:92%;max-width:520px;background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(255,255,255,0.96));border-radius:14px;padding:18px;color:#2b1a0f;box-shadow:0 30px 100px rgba(2,6,23,0.7)}
    .close-btn{position:absolute;right:18px;top:18px;background:rgba(0,0,0,0.06);color:#111;border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer}
    #hover-preview{position:fixed;display:none;max-width:300px;max-height:300px;border-radius:12px;z-index:28;box-shadow:0 24px 80px rgba(2,6,23,0.7);overflow:hidden}

    /* Floating WhatsApp */
    .fab{position:fixed;right:18px;bottom:18px;z-index:14;width:64px;height:64px;border-radius:999px;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#25D366,#20BA5A);color:#fff;font-size:22px;box-shadow:0 18px 60px rgba(2,6,23,0.6)}

    /* Responsive rules: scale fonts and spacing for tablets/phones */
    @media (max-width:1000px){
      .brand{font-size:36px}
      .marquee img{height:72px}
      .thumb{width:72px;height:72px}
    }
    @media (max-width:600px){
      .hero{padding:18px}
      .brand{font-size:28px}
      .marquee img{height:56px}
      .thumb{width:64px;height:64px}
      .price{min-width:64px;font-size:14px}
      .primary{padding:10px 14px;font-size:14px}
      .search input{padding:10px 12px}
    }

    /* Respect reduced motion - hide bg video for reduced-motion preference */
    @media (prefers-reduced-motion: reduce) {
      .bg-video{display:none !important;}
      .marquee{animation: none !important;}
    }
  </style>
</head>

      "vegan": { en: "Vegan", ar: "نباتي" , class: "diet-vegan" },
      "vegetarian": { en: "Vegetarian", ar: "نباتي/خالي من اللحم" , class: "diet-veg" },
      "gluten-free": { en: "Gluten-free", ar: "خالي من الغلوتين", class: "diet-gluten" },
      "contains-nuts": { en: "Contains nuts", ar: "يحتوي على مكسرات", class: "diet-nut" },
      "contains-gluten": { en: "Contains gluten", ar: "يحتوي على الغلوتين", class: "diet-gluten" },
      "contains-dairy": { en: "Contains dairy", ar: "يحتوي على ألبان", class: "diet-dairy" },
      "dairy-free": { en: "Dairy-free", ar: "خالي من الألبان", class: "diet-dairy" },
      "spicy": { en: "Spicy", ar: "حار", class: "diet-spicy" }
    };

    function buildDietaryPills(item){
      const wrap = createEl('div',{class:'dietary-row'});
      (item.dietary || []).forEach(d=>{
        const label = DIETARY_LABELS[d];
        if(!label) return;
        const pill = createEl('div',{class:'diet-pill '+label.class}, currentLang==='en' ? label.en : label.ar);
        wrap.appendChild(pill);
      });
      return wrap.children.length ? wrap : null;
    }

    function buildMenuItemRow(item){
      const row = createEl('div',{class:'menu-item',tabindex:0,role:'listitem'});
      const thumb = createEl('div',{class:'thumb'});
      const img = createEl('img',{src:item.image||'',alt:(currentLang==='en'?item.enName:item.arName)||'',loading:'lazy'});
      thumb.appendChild(img);

      const meta = createEl('div',{class:'meta'});
      const nameTxt = currentLang==='en' ? item.enName : item.arName;
      const descTxt = currentLang==='en' ? item.descriptionEn : item.descriptionAr;
      const nm = createEl('div',{class:'name'}, nameTxt || '');
      const desc = createEl('div',{class:'desc'}, descTxt || '');
      const cal = createEl('div',{class:'calories'}, item.calories || '');

      meta.appendChild(nm);
      meta.appendChild(desc);

      const pills = buildDietaryPills(item);
      if(pills) meta.appendChild(pills);

      meta.appendChild(cal);

      const price = createEl('div',{class:'price'}, item.price || '');

      row.appendChild(thumb); row.appendChild(meta); row.appendChild(price);

      row.addEventListener('click', ()=> openItemModal(item));
      row.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); openItemModal(item); } });
      img.addEventListener('click', (e)=>{ e.stopPropagation(); openImageModal(img.src, nameTxt); });

      return row;
    }

    function renderCategories(){
      categoriesView.innerHTML=''; flatResults.style.display='none'; categoriesView.style.display='flex'; noResults.style.display='none';
      Object.keys(menuData).forEach(catKey=>{
        const cat = menuData[catKey];
        const titleText = currentLang==='en' ? catKey : cat.arTitle || catKey;
        const catEl = createEl('div',{class:'category',tabindex:0,role:'button','aria-expanded':'false'});
        const title = createEl('div',{}, titleText); title.className='title';
        const chev = createEl('div',{},'▸'); chev.className='chev';
        catEl.appendChild(title); catEl.appendChild(chev);

        const itemsWrap = createEl('div',{class:'items','aria-hidden':'true'});
        (cat.items||[]).forEach(it => {
          itemsWrap.appendChild(buildMenuItemRow(it));
        });

        catEl.addEventListener('click', ()=> toggleCategory(itemsWrap,catEl));
        catEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggleCategory(itemsWrap,catEl); } });

        categoriesView.appendChild(catEl);
        categoriesView.appendChild(itemsWrap);
      });
    }

    function toggleCategory(itemsWrap, catEl){
      const open = itemsWrap.classList.contains('open');
      if(open){
        itemsWrap.classList.remove('open'); itemsWrap.setAttribute('aria-hidden','true'); catEl.setAttribute('aria-expanded','false'); catEl.querySelector('.chev').textContent='▸';
      } else {
        // close others
        document.querySelectorAll('.items.open').forEach(x=>{ x.classList.remove('open'); x.setAttribute('aria-hidden','true'); const p=x.previousElementSibling; if(p){ p.setAttribute('aria-expanded','false'); p.querySelector('.chev').textContent='▸'; } });
        itemsWrap.classList.add('open'); itemsWrap.setAttribute('aria-hidden','false'); catEl.setAttribute('aria-expanded','true'); catEl.querySelector('.chev').textContent='▾';
        const first = itemsWrap.querySelector('.menu-item'); if(first) first.focus();
      }
    }

    function handleSearch(q){
      const qtrim = (q||'').trim().toLowerCase();
      if(!qtrim){ renderCategories(); return; }

      flatResults.innerHTML=''; categoriesView.style.display='none'; flatResults.style.display='flex'; noResults.style.display='none';

      const matched = [];
      Object.keys(menuData).forEach(catKey=>{
        const cat = menuData[catKey];
        (cat.items||[]).forEach(it=>{
          const nameEn = (it.enName||'').toLowerCase();
          const nameAr = (it.arName||'').toLowerCase();
          const descEn = (it.descriptionEn||'').toLowerCase();
          const descAr = (it.descriptionAr||'').toLowerCase();
          if(nameEn.includes(qtrim) || nameAr.includes(qtrim) || descEn.includes(qtrim) || descAr.includes(qtrim)){
            matched.push(Object.assign({},it,{category: currentLang==='en'?catKey:cat.arTitle}));
          }
        });
      });

      if(!matched.length){
        flatResults.style.display='none'; noResults.style.display='block'; noResultsText.textContent = currentLang==='en' ? 'No items found. Try a different search.' : 'لم يتم العثور على عناصر. حاول البحث بكلمة أخرى.'; announce('No results');
        return;
      }

      matched.forEach(it=>{
        const wrapper = createEl('div',{style:'display:flex;flex-direction:column;gap:8px'});
        const catLabelText = it.category || '';
        const catLabel = createEl('div',{style:'font-size:12px;color:var(--muted);margin-bottom:6px'}, catLabelText);
        wrapper.appendChild(catLabel);
        wrapper.appendChild(buildMenuItemRow(it));
        flatResults.appendChild(wrapper);
      });

      announce(`${matched.length} results`);
    }

    /* Modals & focus trap */
    const itemModal = document.getElementById('item-modal');
    const imageModal = document.getElementById('image-modal');
    let lastFocus = null;
    function trapFocus(modal){
      const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(!focusable.length) return null;
      const first = focusable[0], last = focusable[focusable.length-1];
      function handler(e){
        if(e.key==='Tab'){
          if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
        } else if(e.key==='Escape'){ closeAllModals(); }
      }
      modal.addEventListener('keydown', handler);
      return ()=> modal.removeEventListener('keydown', handler);
    }
    function openItemModal(it){
      lastFocus = document.activeElement;
      document.getElementById('modal-name').textContent = currentLang==='en' ? it.enName : it.arName;
      document.getElementById('modal-price').textContent = it.price || '';
      document.getElementById('modal-cal').textContent = it.calories ? (currentLang==='en' ? `Estimated: ${it.calories}` : `سعرات تقديرية: ${it.calories}`) : '';
      document.getElementById('modal-description').textContent = currentLang==='en' ? it.descriptionEn : it.descriptionAr;
      const modalDiet = document.getElementById('modal-dietary');
      modalDiet.innerHTML = '';
      (it.dietary || []).forEach(d=>{
        const lab = DIETARY_LABELS[d];
        if(lab) modalDiet.appendChild(createEl('div',{class:'diet-pill '+lab.class}, currentLang==='en' ? lab.en : lab.ar));
      });
      itemModal.classList.add('show'); itemModal.setAttribute('aria-hidden','false');
      const remove = trapFocus(itemModal); itemModal._removeTrap = remove;
      const close = document.getElementById('modalClose'); if(close) close.focus();
    }
    function closeItemModal(){ itemModal.classList.remove('show'); itemModal.setAttribute('aria-hidden','true'); if(itemModal._removeTrap) itemModal._removeTrap(); if(lastFocus && lastFocus.focus) lastFocus.focus(); }

    function openImageModal(src, alt){
      lastFocus = document.activeElement;
      const img = document.getElementById('zoomed-image'); img.src = src||''; img.alt = alt||'';
      imageModal.classList.add('show'); imageModal.setAttribute('aria-hidden','false');
      const remove = trapFocus(imageModal); imageModal._removeTrap = remove;
      const close = document.getElementById('imageModalClose'); if(close) close.focus();
    }
    function closeImageModal(){ imageModal.classList.remove('show'); imageModal.setAttribute('aria-hidden','true'); if(imageModal._removeTrap) imageModal._removeTrap(); const img = document.getElementById('zoomed-image'); if(img) img.src=''; if(lastFocus && lastFocus.focus) lastFocus.focus(); }

    document.getElementById('modalClose').addEventListener('click', closeItemModal);
    document.getElementById('imageModalClose').addEventListener('click', closeImageModal);
    [itemModal,imageModal].forEach(m=>{ if(!m) return; m.addEventListener('click',(e)=>{ if(e.target===m) closeAllModals(); }); });

    function closeAllModals(){ closeItemModal(); closeImageModal(); }

    /* Hover preview (desktop) */
    const hoverPrev = document.getElementById('hover-preview');
    let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    document.addEventListener('mouseover',(e)=>{ if(isTouch) return; const t=e.target; if(t && t.tagName==='IMG' && t.closest('.thumb')){ hoverPrev.src = t.src; hoverPrev.style.display='block'; }});
    document.addEventListener('mousemove',(e)=>{ if(!hoverPrev || hoverPrev.style.display!=='block') return; let x=e.clientX+18,y=e.clientY+18; const vw=window.innerWidth,vh=window.innerHeight,mw=300,mh=300; if(x+mw>vw) x=e.clientX-mw-18; if(y+mh>vh) y=e.clientY-mh-18; hoverPrev.style.left=x+'px'; hoverPrev.style.top=y+'px'; });
    document.addEventListener('mouseout',(e)=>{ const t=e.target; if(t && t.tagName==='IMG' && t.closest('.thumb')) hoverPrev.style.display='none'; });

    /* Copy WiFi */
    const copyWifiBtn = document.getElementById('copy-wifi-en');
    if (copyWifiBtn) {
      copyWifiBtn.addEventListener('click', ()=>{
        const ssid = document.getElementById('wifi-ssid-en').textContent.trim();
        const pass = document.getElementById('wifi-pass-en').textContent.trim();
        const text = `Wi-Fi: ${ssid} Password: ${pass}`;
        if(navigator.clipboard && navigator.clipboard.writeText){
          navigator.clipboard.writeText(text).then(()=>{ const b=document.getElementById('copy-wifi-en'); const prev=b.textContent; b.textContent = currentLang==='en' ? 'Copied' : 'تم النسخ'; setTimeout(()=>b.textContent=prev,1300); announce('Wi‑Fi details copied'); }).catch(()=> announce('Copy failed'));
        } else {
          const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
          try{ document.execCommand('copy'); announce('Wi‑Fi details copied'); }catch(e){ announce('Copy failed'); } document.body.removeChild(ta);
        }
      });
    }

    /* Open menu navigation (separate view)
       IMPORTANT CHANGE (minimal & requested): do NOT autofocus the search input when opening the menu.
       Also hide the background video when the menu is active (so video stays landing-only).
    */
    openMenuBtn.addEventListener('click', ()=>{
      landingView.style.display = 'none';
      menuPage.style.display = 'block';
      menuPage.setAttribute('aria-hidden','false');
      // Removed: document.getElementById('searchBar').focus();
      announce(currentLang==='en'?'Menu opened':'تم فتح القائمة');

      // Hide bg video and overlay to ensure menu page shows glassy burgundy background only
      const bg = document.querySelector('.bg-video');
      const overlay = document.querySelector('.bg-overlay');
      if(bg) bg.style.display = 'none';
      if(overlay) overlay.style.display = 'none';
      // Optionally add a subtle page-level focus for accessibility
      menuPage.focus?.();
    });

    /* When returning to landing, restore video display */
    function showLanding(){
      landingView.style.display = 'flex';
      menuPage.style.display = 'none';
      menuPage.setAttribute('aria-hidden','true');
      const bg = document.querySelector('.bg-video');
      const overlay = document.querySelector('.bg-overlay');
      if(bg) bg.style.display = '';
      if(overlay) overlay.style.display = '';
      announce(currentLang==='en'?'Landing shown':'تم عرض الصفحة الرئيسية');
    }

    /* Language toggle: switches UI and content to Arabic/English — does NOT change background visuals
       Minimal accessibility improvement: update aria-pressed state properly when toggled.
    */
    langToggle.addEventListener('click', ()=>{
      currentLang = currentLang==='en' ? 'ar' : 'en';
      document.documentElement.lang = currentLang==='ar' ? 'ar' : 'en';
      document.documentElement.dir = currentLang==='ar' ? 'rtl' : 'ltr';
      langToggle.textContent = currentLang==='en' ? 'العربية' : 'English';
      // update aria-pressed to reflect "Arabic is active" when true (simple toggle)
      langToggle.setAttribute('aria-pressed', String(currentLang==='ar'));
      document.getElementById('searchBar').placeholder = currentLang==='en' ? 'Search menu items...' : 'ابحث عن عناصر القائمة...';
      document.getElementById('openMenuBtn').textContent = currentLang==='en' ? 'Explore Our Menu' : 'استعرض قائمتنا';
      document.getElementById('brandTitle').textContent = currentLang==='en' ? 'Turkiana' : 'تركيانا';
      document.getElementById('brandSub').textContent = currentLang==='en' ? 'CAFÉ & SWEETS' : 'مقهى وحلويات';
      document.getElementById('brandTag').textContent = currentLang==='en' ? 'Where Tradition Meets Elegance' : 'حيث يلتقي التراث بالأناقة';
      // Rebuild categories so labels & descriptions update
      renderCategories();
      if(searchInput.value && searchInput.value.trim()) handleSearch(searchInput.value);
      announce(currentLang==='en' ? 'Language switched to English' : 'تم تغيير اللغة إلى العربية');
    });

    /* Search input logic (unchanged debounce & behavior) */
    let searchTimer = null;
    if (searchInput) {
      searchInput.addEventListener('input',(e)=>{
        clearTimeout(searchTimer);
        searchTimer = setTimeout(()=>{ handleSearch(e.target.value || ''); }, 140);
      });
    }

    /* Keyboard: close modals on Escape */
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeAllModals(); });

    /* Init */
    function init(){
      landingView.style.display = 'flex';
      menuPage.style.display = 'none';
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      langToggle.textContent = 'العربية';
      langToggle.setAttribute('aria-pressed','false');
      document.getElementById('searchBar').placeholder = 'Search menu items...';
      renderCategories();
      announce('Welcome to Turkiana. Press Explore Our Menu to continue.');
    }
    document.addEventListener('DOMContentLoaded', init);

    /* Expose for debug */
    window._turkiana = { renderCategories, handleSearch, menuData, showLanding };
  </script>
</body>
</html>
