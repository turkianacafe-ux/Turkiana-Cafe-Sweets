<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Turkiana • Ottoman Nights 1447</title>
    <meta name="description" content="Premium Turkish coffee &amp; Ottoman sweets in Doha.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:wght@500;600;700&amp;family=Scheherazade+New:wght@400;700&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg: #0a0503;
            --surface: #1f130e;
            --text: #fdf3e0;
            --soft: #d4bc9a;
            --gold: #c7a05b;
            --accent: #e2b675;
            --border: #8b6b4a;
          
            --font-sans: 'Inter', system-ui, sans-serif;
            --font-heading: 'Playfair Display', serif;
            --font-ar: 'Scheherazade New', serif;
          
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --ease-in: cubic-bezier(0.32, 0, 0.67, 0);
        }
        body.light {
            --bg: #fbf3e8;
            --surface: #efe2d3;
            --text: #2d1f13;
            --soft: #5f4e3c;
            --gold: #b28b4b;
            --accent: #9e6d3e;
            --border: #b49b7b;
        }
      
        * { margin:0; padding:0; box-sizing:border-box; }
      
        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s, color 0.2s;
        }
      
        body[dir="rtl"] { font-family: var(--font-ar); }
      
        /* Realistic Crescent Moon (SVG) */
        .crescent {
            position: fixed;
            top: 12%;
            left: 50%;
            width: clamp(160px, 26vw, 260px);
            height: clamp(160px, 26vw, 260px);
            z-index: 2;
            opacity: 0.75;
            filter: drop-shadow(0 0 120px #ffdd7a);
            animation: crescent-breath 18s ease-in-out infinite;
            pointer-events: none;
        }
      
        @keyframes crescent-breath {
            0%,100% { filter: drop-shadow(0 0 110px #ff9f1c); transform: translateX(-50%) scale(1); }
            50% { filter: drop-shadow(0 0 180px #ffb347); transform: translateX(-50%) scale(1.035); }
        }
      
        /* Improved Floating Lanterns – natural upward drift + gentle sway */
        .lanterns {
            position: fixed;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }
      
        .lantern {
            position: absolute;
            width: 82px;
            height: 124px;
            background: radial-gradient(circle at 30% 25%, #e89a4a, #8f3a1a);
            border-radius: 50% 50% 35% 35%;
            filter: drop-shadow(0 30px 50px #ff7a1f);
            animation: lantern-float 22s linear infinite;
        }
      
        .lantern::before {
            content: '';
            position: absolute;
            top: -46px;
            left: 50%;
            transform: translateX(-50%);
            width: 7px;
            height: 48px;
            background: linear-gradient(#c9a46b, #5c3f24);
        }
      
        .lantern::after {
            content: '';
            position: absolute;
            bottom: -26px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 32px;
            background: #ffe8b3;
            border-radius: 50%;
            box-shadow: 0 0 40px #ffdd7a;
            animation: flame-flicker 1.35s infinite alternate ease-in-out;
        }
      
        .lantern .glass {
            position: absolute;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: 34px;
            height: 42px;
            background: rgba(255,255,255,0.32);
            border-radius: 40%;
            box-shadow: inset 0 0 28px #ffe8b3;
        }
      
        @keyframes lantern-float {
            0%   { transform: translateY(0) rotate(0deg) translateX(0); }
            25%  { transform: translateY(-65px) rotate(4deg) translateX(14px); }
            50%  { transform: translateY(-110px) rotate(-5deg) translateX(-11px); }
            75%  { transform: translateY(-68px) rotate(3deg) translateX(9px); }
            100% { transform: translateY(0) rotate(0deg) translateX(0); }
        }
      
        @keyframes flame-flicker {
            0%   { transform: scale(1) translateY(0); opacity: 0.92; }
            100% { transform: scale(1.09) translateY(-5px); opacity: 1; }
        }
      
        /* Stars */
        .stars {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
      
        .star {
            position: absolute;
            background: #fffbeb;
            border-radius: 50%;
            box-shadow: 0 0 14px #ffe070;
            animation: star-twinkle 4.8s infinite alternate ease-in-out;
        }
      
        @keyframes star-twinkle {
            0%   { opacity: 0.35; transform: scale(0.75); }
            100% { opacity: 1; transform: scale(1.4); }
        }
      
        /* Controls */
        .controls {
            position: fixed;
            top: 24px;
            right: 24px;
            display: flex;
            gap: 14px;
            z-index: 300;
        }
      
        .ctrl {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: rgba(30,20,15,0.82);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(199,160,91,0.3);
            color: var(--gold);
            font-size: 1.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s var(--ease-out);
            cursor: pointer;
        }
      
        .ctrl:hover {
            transform: scale(1.12) rotate(8deg);
            background: var(--gold);
            color: #0a0503;
        }
      
        /* Sticky categories */
        .cat-bar {
            position: sticky;
            top: 20px;
            z-index: 200;
            background: rgba(30,20,15,0.92);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(199,160,91,0.25);
            border-radius: 9999px;
            padding: 14px 18px;
            margin: 0 20px 32px;
            display: flex;
            gap: 12px;
            overflow-x: auto;
            scrollbar-width: none;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }
        body.light .cat-bar {
            background: rgba(240, 230, 215, 0.92);
        }
        .cat-bar::-webkit-scrollbar { display: none; }
      
        .cat-btn {
            padding: 12px 28px;
            white-space: nowrap;
            border-radius: 9999px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            font-weight: 500;
            transition: all 0.35s var(--ease-out);
            flex-shrink: 0;
            cursor: pointer;
        }
      
        .cat-btn.active,
        .cat-btn:hover {
            background: var(--gold);
            color: #0a0503;
            border-color: var(--gold);
            transform: translateY(-3px);
        }
      
        /* Menu Grid */
        .menu-container {
            padding: 40px 20px 120px;
            max-width: 1200px;
            margin: 0 auto;
        }
      
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 36px;
        }
      
        .menu-card {
            background: var(--surface);
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: 0 30px 80px rgba(0,0,0,0.55);
            transition: box-shadow 0.4s var(--ease-out), transform 0.4s var(--ease-out);
            cursor: pointer;
            position: relative;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
        }
        body.light .menu-card {
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
      
        .menu-card .figure {
            position: relative;
            aspect-ratio: 16/9;
            overflow: hidden;
        }
      
        .menu-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 1.1s var(--ease-out);
        }
      
        .menu-card:hover img {
            transform: scale(1.09);
        }
      
        .menu-card .content {
            padding: 26px 24px 28px;
        }
      
        .menu-card .name {
            font-family: var(--font-heading);
            font-size: 1.55rem;
            color: var(--gold);
            margin-bottom: 8px;
        }
      
        .menu-card .name-ar {
            font-family: var(--font-ar);
            font-size: 1.22rem;
            color: var(--soft);
            margin-bottom: 14px;
        }
      
        .menu-card .desc {
            color: var(--soft);
            font-size: 0.95rem;
            line-height: 1.55;
        }
      
        .menu-card .price {
            margin-top: 18px;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--accent);
        }
      
        .menu-card:hover {
            box-shadow: 0 50px 110px rgba(199,160,91,0.22);
            transform: translateY(-12px) scale(1.02);
        }
      
        /* Floating search */
        .search-float {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 480px;
            z-index: 400;
        }
      
        .search-box {
            background: rgba(30,20,15,0.88);
            backdrop-filter: blur(28px);
            border: 1px solid rgba(199,160,91,0.35);
            border-radius: 9999px;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.6);
        }
        body.light .search-box {
            background: rgba(245, 235, 220, 0.9);
        }
      
        #searchInput {
            flex: 1;
            background: none;
            border: none;
            outline: none;
            color: var(--text);
            font-size: 1.1rem;
        }
        #searchInput::placeholder { color: var(--soft); opacity: 0.8; }
      
        #clearBtn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 1.5rem;
            display: none;
            cursor: pointer;
        }
      
        /* Modal */
        dialog {
            border: none;
            background: transparent;
            max-width: 720px;
            width: 94%;
            margin: auto;
            padding: 0;
            animation: modalFadeIn 0.35s var(--ease-out);
        }
        @keyframes modalFadeIn { from { opacity:0; transform:scale(0.9); } to { opacity:1; transform:scale(1); } }
      
        .modal-content {
            background: var(--surface);
            border-radius: 32px;
            overflow: hidden;
            border: 2px solid var(--gold);
        }
      
        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 52px;
            height: 52px;
            background: rgba(0,0,0,0.7);
            border: none;
            color: white;
            font-size: 1.8rem;
            border-radius: 50%;
            z-index: 10;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
      
        .modal-close:hover {
            background: var(--gold);
            color: #000;
        }
      
        .modal-body { padding: 32px 28px; }
      
        .detail-row {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            background: rgba(199,160,91,0.08);
            padding: 18px;
            border-radius: 24px;
        }
      
        .detail-item {
            flex: 1 1 140px;
        }
      
        .detail-item .label {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--soft);
            opacity: 0.85;
        }
      
        .detail-item .value {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--accent);
            margin-top: 4px;
        }
      
        .milk-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 12px;
            margin-top: 8px;
        }
      
        .milk-badge {
            background: rgba(226,182,117,0.15);
            border: 1px solid var(--border);
            border-radius: 40px;
            padding: 5px 16px;
            font-size: 0.9rem;
            white-space: nowrap;
        }
      
        /* Footer */
        footer {
            text-align: center;
            padding: 80px 20px 60px;
            color: var(--soft);
            font-size: 0.95rem;
        }
      
        .brand {
            font-family: var(--font-heading);
            font-size: 3.2rem;
            color: var(--gold);
            margin-bottom: 12px;
        }
    </style>
</head>

          { "id": "cro11", "categoryId": "croissant", "nameEn": "Danish Shell", "nameAr": "دانش شل", "descriptionEn": "Shell-shaped Danish. Delicate layers, light sweetness.", "price": 20, "image": "Danish.jpg", "calories": "380 kcal", "dietary": ["vegetarian"] },
          { "id": "cro12", "categoryId": "croissant", "nameEn": "Raisins Danish", "nameAr": "دانش زبيب", "descriptionEn": "Danish pastry studded with plump raisins. Natural sweetness.", "price": 20, "image": "Raisin.jpg", "calories": "390 kcal", "dietary": ["vegetarian"] },
          { "id": "grill3", "categoryId": "grill", "nameEn": "French Fries", "nameAr": "بطاطس مقلية", "descriptionEn": "Golden fries. Crisp exterior, fluffy interior. Perfectly salted.", "price": 29, "image": "Patatas.jpg", "calories": "340 kcal", "dietary": ["vegan", "gluten-free"] },
          { "id": "grill4", "categoryId": "grill", "nameEn": "Potato Wedges", "nameAr": "بطاطس ويدجز", "descriptionEn": "Thick potato wedges with seasoned skin. Heartier texture.", "price": 32, "image": "Wedges.webp", "calories": "380 kcal", "dietary": ["vegetarian", "gluten-free"] }
        ]
      }
    </script>

    <script>
        (function() {
            const data = JSON.parse(document.getElementById('menuData').textContent);
            const IMAGE_BASE = "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/";
            let lang = localStorage.getItem('lang') || 'en';
            let activeCat = 'all';
            let searchQ = '';
            let currentItems = [];
          
            const els = {
                grid: document.getElementById('grid'),
                catBar: document.getElementById('catBar'),
                searchInput: document.getElementById('searchInput'),
                clearBtn: document.getElementById('clearBtn'),
                modal: document.getElementById('modal'),
                modalImg: document.getElementById('modalImg'),
                modalBody: document.getElementById('modalBody'),
                modalClose: document.getElementById('modalClose'),
                themeBtn: document.getElementById('themeBtn'),
                langBtn: document.getElementById('langBtn')
            };
          
            // Generate stars
            function generateStars() {
                const container = document.getElementById('stars');
                for (let i = 0; i < 92; i++) {
                    const s = document.createElement('div');
                    s.className = 'star';
                    s.style.left = Math.random()*100 + '%';
                    s.style.top = Math.random()*100 + '%';
                    s.style.width = s.style.height = (Math.random()*3.5 + 1.5) + 'px';
                    s.style.animationDelay = Math.random()*6 + 's';
                    container.appendChild(s);
                }
            }
          
            function getFiltered() {
                let filtered = data.items;
                if (activeCat !== 'all') filtered = filtered.filter(i => i.categoryId === activeCat);
                if (searchQ) {
                    const q = searchQ.toLowerCase();
                    filtered = filtered.filter(i =>
                        i.nameEn.toLowerCase().includes(q) ||
                        (i.nameAr && i.nameAr.toLowerCase().includes(q)) ||
                        i.descriptionEn.toLowerCase().includes(q)
                    );
                }
                return filtered;
            }
          
            function renderCats() {
                let html = '';
                data.categories.forEach(c => {
                    const name = lang === 'ar' ? c.nameAr : c.nameEn;
                    html += `<button class="cat-btn ${c.id===activeCat?'active':''}" data-id="${c.id}">${name}</button>`;
                });
                els.catBar.innerHTML = html;
              
                els.catBar.querySelectorAll('.cat-btn').forEach(b => {
                    b.addEventListener('click', () => {
                        activeCat = b.dataset.id;
                        renderCats();
                        switchContent(getFiltered());
                    });
                });
            }
          
            function createCardHTML(item) {
                const name = lang === 'ar' ? item.nameAr : item.nameEn;
                const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
                return `
                    <div class="figure">
                        <img src="${IMAGE_BASE}${item.image}" alt="${name}" loading="lazy">
                    </div>
                    <div class="content">
                        <div class="name">${name}</div>
                        ${nameAlt ? `<div class="name-ar">${nameAlt}</div>` : ''}
                        <div class="desc">${item.descriptionEn}</div>
                        <div class="price">${item.price} QAR</div>
                    </div>
                `;
            }
          
            function renderGrid(items) {
                els.grid.innerHTML = '';
                items.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = 'menu-card';
                    card.innerHTML = createCardHTML(item);
                    card.addEventListener('click', () => openModal(item));
                    els.grid.appendChild(card);
                });
              
                // Staggered fade-in
                setTimeout(() => {
                    const cards = els.grid.children;
                    for (let i = 0; i < cards.length; i++) {
                        setTimeout(() => {
                            cards[i].style.transition = 'all 0.9s var(--ease-out)';
                            cards[i].style.opacity = '1';
                            cards[i].style.transform = 'translateY(0) scale(1)';
                        }, i * 22);
                    }
                }, 80);
            }
          
            function switchContent(newItems) {
                currentItems = newItems;
                els.grid.style.transition = 'opacity 0.28s ease';
                els.grid.style.opacity = '0';
                setTimeout(() => {
                    renderGrid(newItems);
                    els.grid.style.opacity = '1';
                }, 300);
            }
          
            // ==================== ENHANCED MODAL WITH TEMPERATURE & MILK RULES ====================
            function openModal(item) {
                const name = lang === 'ar' ? item.nameAr : item.nameEn;
                const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
              
                els.modalImg.innerHTML = `<img src="${IMAGE_BASE}${item.image}" style="width:100%;height:100%;object-fit:cover" alt="${name}">`;
              
                // Temperature logic (strictly follows your rules)
                const nameLower = item.nameEn.toLowerCase();
                const isHotOnly = ['classic turkish coffee', 'double turkish coffee', 'ottoman mastic coffee', 'hazelnut turkish coffee', 'cardamom turkish coffee', 'sahlep', 'arabic coffee', 'turkish tea'].some(term => nameLower.includes(term));
                const isIcedOnly = nameLower.includes('iced') || nameLower.includes('cold brew') || nameLower.includes('ice drip') || item.categoryId === 'refreshers';
                
                let tempDisplay = '';
                if (isHotOnly) tempDisplay = '🌡️ Hot only';
                else if (isIcedOnly) tempDisplay = '❄️ Iced only';
                else tempDisplay = '🌡️ Hot &amp; ❄️ Iced';
              
                // Milk options (only for coffees that normally contain milk)
                const showMilk = item.categoryId === 'cafe' && item.dietary && item.dietary.includes('contains-dairy');
                const milkOptions = showMilk ? [
                    "Full Fat Milk", "Low-Fat Milk", "Skim Milk", "Lactose Free Milk",
                    "Oat Milk", "Almond Milk", "Soy Milk", "Coconut Milk"
                ] : [];
              
                // Allergens
                const allergens = item.dietary && item.dietary.length ? item.dietary.join(', ') : 'None';
              
                let extras = '';
                if (milkOptions.length) {
                    extras += `
                        <div class="detail-row">
                            <div class="detail-item" style="flex:100%">
                                <span class="label">🥛 Milk Options</span>
                                <div class="milk-list">
                                    ${milkOptions.map(m => `<span class="milk-badge">${m}</span>`).join('')}
                                </div>
                            </div>
                        </div>`;
                }
                if (item.hasBeanSelection) {
                    extras += `<div class="detail-row"><div class="detail-item"><span class="label">🫘 Bean Selection</span><div class="value">Single-origin available</div></div></div>`;
                }
              
                // Modal content
                els.modalBody.innerHTML = `
                    <h2 style="font-family:var(--font-heading);font-size:2.4rem;color:var(--gold);margin-bottom:8px">${name}</h2>
                    ${nameAlt ? `<div style="font-family:var(--font-ar);font-size:1.35rem;color:var(--soft);margin-bottom:18px">${nameAlt}</div>` : ''}
                    <div style="font-size:1.85rem;font-weight:600;color:var(--accent);margin:16px 0">${item.price} QAR</div>
                    <p style="color:var(--soft);line-height:1.65">${item.descriptionEn}</p>
                    
                    <div class="detail-row">
                        <div class="detail-item"><span class="label">🔥 Calories</span><div class="value">${item.calories}</div></div>
                        <div class="detail-item"><span class="label">⚠️ Allergens</span><div class="value">${allergens}</div></div>
                    </div>
                    
                    <div class="detail-row">
                        <div class="detail-item"><span class="label">🍬 Sugar Level</span><div class="value">Adjustable on request</div></div>
                        <div class="detail-item"><span class="label">🌡️ Temperature</span><div class="value">${tempDisplay}</div></div>
                    </div>
                    
                    ${extras}
                    
                    <div style="margin-top:28px; font-size:0.9rem; opacity:0.75; text-align:center;">*All customizations available upon request</div>
                `;
              
                els.modal.showModal();
            }
          
            function init() {
                generateStars();
              
                // Theme
                els.themeBtn.addEventListener('click', () => {
                    document.body.classList.toggle('light');
                    els.themeBtn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
                });
              
                // Language
                els.langBtn.addEventListener('click', () => {
                    lang = lang === 'en' ? 'ar' : 'en';
                    els.langBtn.textContent = lang.toUpperCase();
                    document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
                    renderCats();
                    switchContent(getFiltered());
                });
              
                // Search
                els.searchInput.addEventListener('input', () => {
                    searchQ = els.searchInput.value.trim();
                    els.clearBtn.style.display = searchQ ? 'block' : 'none';
                    switchContent(getFiltered());
                    renderCats();
                });
              
                els.clearBtn.addEventListener('click', () => {
                    els.searchInput.value = '';
                    searchQ = '';
                    els.clearBtn.style.display = 'none';
                    switchContent(getFiltered());
                    renderCats();
                });
              
                // Modal
                els.modalClose.addEventListener('click', () => els.modal.close());
                els.modal.addEventListener('click', e => { if (e.target === els.modal) els.modal.close(); });
              
                // Start
                renderCats();
                switchContent(getFiltered());
                els.langBtn.textContent = lang.toUpperCase();
            }
          
            window.onload = init;
        })();
    </script>
</body>
</html>
