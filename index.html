<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Turkiana Café & Sweets</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #d4af37;
    overflow-x: hidden;
    background: linear-gradient(135deg, #1a0f0a 0%, #2d1515 50%, #1a0f0a 100%);
    scroll-behavior: smooth;
  }

  :root {
    --gold: #d4af37;
    --maroon: rgba(128, 0, 32, 0.7);
    --glass-bg: rgba(255,255,255,0.08);
  }

  #bg-video {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -2;
  }

  #overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, rgba(10,10,10,.7), rgba(61,20,20,.8));
    backdrop-filter: blur(8px);
    z-index: -1;
  }

  body {
    background: linear-gradient(135deg, #1a0f0a 0%, #2d1515 50%, #1a0f0a 100%) !important;
  }

  body.light-mode {
    background: linear-gradient(135deg, #f5f5f0 0%, #ece6db 50%, #f5f5f0 100%) !important;
    --gold: #8b6914;
    color: var(--gold);
  }

  /* Toast Notifications */
  #toast-container {
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 4000;
    display: flex;
    flex-direction: column;
    gap: 12px;
    pointer-events: none;
  }

  .toast {
    background: rgba(212, 175, 55, 0.95);
    color: #080606;
    padding: 14px 24px;
    border-radius: 50px;
    backdrop-filter: blur(20px);
    box-shadow: 0 12px 40px rgba(212, 175, 55, 0.3);
    font-weight: 600;
    animation: slideInDown 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    pointer-events: auto;
    cursor: pointer;
  }

  .toast.error {
    background: rgba(220, 53, 69, 0.95);
    color: #fff;
  }

  .toast.success {
    background: rgba(40, 167, 69, 0.95);
    color: #fff;
  }

  @keyframes slideInDown {
    0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
    100% { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @keyframes slideOutUp {
    0% { opacity: 1; transform: translateX(-50%) translateY(0); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
  }

  .toast.removing {
    animation: slideOutUp 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  /* Controls */
  #controls {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 3500;
    display: flex;
    gap: 12px;
  }

  #langSwitch, #darkModeToggle, #favoritesBtn, #printBtn {
    padding: 10px 18px;
    border-radius: 50px;
    border: none;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(20px);
    color: var(--gold);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.9rem;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    user-select: none;
  }

  #langSwitch:hover, #darkModeToggle:hover, #favoritesBtn:hover, #printBtn:hover {
    background: rgba(255, 255, 255, 0.25);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px rgba(212, 175, 55, 0.2);
  }

  #favoritesBtn.has-favorites {
    background: linear-gradient(135deg, var(--gold), rgba(212, 175, 55, 0.8));
    color: #080606;
  }

  /* Marquee */
  #marquee {
    width: 100%;
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    backdrop-filter: blur(20px);
    background: rgba(255, 255, 255, 0.06);
    margin: 40px auto;
    max-width: 100%;
    padding: 12px 0;
    position: relative;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }

  #marquee-content, #marquee-content-duplicate {
    display: flex;
    width: max-content;
    animation: marqueeAnim 50s linear infinite;
  }

  #marquee-content-duplicate {
    position: absolute;
    top: 0;
    left: 100%;
    pointer-events: none;
    user-select: none;
  }

  #marquee-content img, #marquee-content-duplicate img {
    height: 140px;
    margin: 0 15px;
    object-fit: cover;
    border-radius: 12px;
    box-shadow: 0 8px 24px rgba(212, 175, 55, 0.3);
    user-select: none;
    pointer-events: none;
    animation: imgSlideIn 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) backwards;
    background: rgba(255,255,255,0.1);
  }

  @keyframes imgSlideIn {
    0% { opacity: 0; transform: translateX(-60px) scale(0.85); }
    100% { opacity: 1; transform: translateX(0) scale(1); }
  }

  @keyframes marqueeAnim {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Landing */
  #landing {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 3rem 2rem;
    opacity: 1;
    transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  #landing.fade-out {
    opacity: 0;
    transform: translateY(-30px);
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(4rem, 12vw, 7rem);
    letter-spacing: 0.2rem;
    background: linear-gradient(135deg, var(--gold), rgba(212, 175, 55, 0.6), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    user-select: none;
    margin-bottom: 2rem;
    font-weight: 900;
    text-transform: uppercase;
    filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 40px rgba(212, 175, 55, 0.3));
    animation: glowPulse 3s cubic-bezier(0.25, 0.46, 0.45, 0.94) infinite;
  }

  @keyframes glowPulse {
    0%, 100% { filter: drop-shadow(0 0 20px rgba(212, 175, 55, 0.6)) drop-shadow(0 0 40px rgba(212, 175, 55, 0.3)); transform: scale(1); }
    50% { filter: drop-shadow(0 0 30px rgba(212, 175, 55, 0.8)) drop-shadow(0 0 60px rgba(212, 175, 55, 0.5)); transform: scale(1.02); }
  }

  .subtitle {
    font-weight: 500;
    font-size: clamp(1rem, 3vw, 1.4rem);
    color: #f5e6d3cc;
    margin-bottom: 3rem;
    line-height: 1.6;
  }

  body.light-mode .subtitle { color: #5a4a2a; }

  .enter-btn {
    padding: 1rem 3rem;
    border-radius: 50px;
    border: 2px solid var(--gold);
    background: transparent;
    color: var(--gold);
    cursor: pointer;
    font-weight: 700;
    font-size: 1.1rem;
    transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(212, 175, 55, 0.2);
    user-select: none;
  }

  .enter-btn:hover {
    background: var(--gold);
    color: #080606;
    box-shadow: 0 12px 48px rgba(212, 175, 55, 0.5);
    transform: translateY(-4px);
  }

  /* Search & Filters */
  #search-filter-container {
    max-width: 1000px;
    margin: 0 auto 40px;
    display: none;
    gap: 20px;
  }

  #search-filter-container.show { display: flex; flex-wrap: wrap; justify-content: center; }

  #searchInput {
    flex: 1;
    min-width: 250px;
    padding: 14px 20px;
    border-radius: 50px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    background: rgba(255, 255, 255, 0.08);
    backdrop-filter: blur(20px);
    color: var(--gold);
    font-size: 1rem;
    transition: all 0.3s;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
  }

  #searchInput::placeholder { color: rgba(212, 175, 55, 0.5); }

  #searchInput:focus {
    outline: none;
    border-color: var(--gold);
    background: rgba(255, 255, 255, 0.12);
    box-shadow: 0 12px 32px rgba(212, 175, 55, 0.2);
  }

  .filter-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .filter-btn {
    padding: 8px 14px;
    border-radius: 50px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    background: rgba(255, 255, 255, 0.06);
    color: var(--gold);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 600;
    transition: all 0.3s;
  }

  .filter-btn:hover {
    background: rgba(255, 255, 255, 0.12);
    transform: scale(1.05);
  }

  .filter-btn.active {
    background: var(--gold);
    color: #080606;
  }

  /* Menu Section */
  #menu {
    display: none;
    min-height: 100vh;
    padding: 60px 20px 120px;
    opacity: 0;
    transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  #menu.show-menu {
    opacity: 1;
  }

  .menu-cat-list {
    max-width: 1400px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 30px;
  }

  .cat-card {
    position: relative;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 24px;
    padding: 20px;
    color: var(--gold);
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    overflow: hidden;
    animation: cardShuffle 0.8s ease-out backwards;
    backdrop-filter: blur(20px);
    display: flex;
    flex-direction: column;
  }

  @keyframes cardShuffle {
    0% { opacity: 0; transform: translateY(20px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .cat-card:nth-child(1) { animation-delay: 0.1s; }
  .cat-card:nth-child(2) { animation-delay: 0.2s; }
  .cat-card:nth-child(3) { animation-delay: 0.3s; }
  .cat-card:nth-child(4) { animation-delay: 0.4s; }
  .cat-card:nth-child(5) { animation-delay: 0.5s; }
  .cat-card:nth-child(6) { animation-delay: 0.6s; }
  .cat-card:nth-child(7) { animation-delay: 0.7s; }
  .cat-card:nth-child(8) { animation-delay: 0.8s; }
  .cat-card:nth-child(9) { animation-delay: 0.9s; }
  .cat-card:nth-child(10) { animation-delay: 1s; }
  .cat-card:nth-child(11) { animation-delay: 1.1s; }
  .cat-card:nth-child(12) { animation-delay: 1.2s; }
  .cat-card:nth-child(13) { animation-delay: 1.3s; }

  .cat-card-image {
    width: 100%;
    height: 140px;
    border-radius: 16px;
    object-fit: cover;
    margin-bottom: 12px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    background: rgba(255,255,255,0.08);
    animation: fadeIn 0.6s ease;
  }

  .cat-card-skeleton {
    width: 100%;
    height: 140px;
    border-radius: 16px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
    margin-bottom: 12px;
  }

  @keyframes loading {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @keyframes fadeIn {
    0% { opacity: 0; }
    100% { opacity: 1; }
  }

  .cat-card:hover {
    transform: translateY(-4px) scale(1.02);
    box-shadow: 0 16px 48px rgba(212, 175, 55, 0.2);
    border-color: rgba(212, 175, 55, 0.3);
    background: rgba(255, 255, 255, 0.1);
  }

  .cat-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    margin-bottom: 8px;
    user-select: none;
  }

  .cat-count {
    font-size: 0.95rem;
    font-weight: 600;
    color: #d4af37aa;
  }

  /* Category Page */
  #cat-page {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 2200;
    background: var(--glass-bg);
    backdrop-filter: blur(25px);
    padding: 60px 40px 120px;
    overflow-y: auto;
    opacity: 0;
    transition: all 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  #cat-page.show {
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 1;
  }

  #cat-back {
    margin-bottom: 40px;
    color: var(--gold);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.1);
    font-weight: 600;
    font-size: 1rem;
    padding: 10px 24px;
    border-radius: 50px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    backdrop-filter: blur(20px);
  }

  #cat-back:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: rgba(212, 175, 55, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(212, 175, 55, 0.15);
  }

  #cat-back:active {
    transform: scale(0.98);
  }

  .cat-page-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 900;
    margin-bottom: 50px;
    text-align: center;
  }

  .cat-items {
    width: 100%;
    max-width: 1200px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 40px;
  }

  /* Item Cards */
  .card {
    background: rgba(255, 255, 255, 0.06);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    border: 1px solid rgba(255, 255, 255, 0.1);
    color: var(--gold);
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: pointer;
    animation: cardSlideIn 0.6s ease-out backwards;
    backdrop-filter: blur(20px);
    position: relative;
  }

  @keyframes cardSlideIn {
    0% { opacity: 0; transform: translateY(20px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.15s; }
  .card:nth-child(3) { animation-delay: 0.2s; }
  .card:nth-child(4) { animation-delay: 0.25s; }
  .card:nth-child(5) { animation-delay: 0.3s; }
  .card:nth-child(6) { animation-delay: 0.35s; }

  .card:hover {
    transform: translateY(-4px);
    box-shadow: 0 16px 48px rgba(212, 175, 55, 0.2);
    border-color: rgba(212, 175, 55, 0.3);
    background: rgba(255, 255, 255, 0.1);
  }

  .card:active {
    transform: scale(0.98);
  }

  .card img {
    width: 100%;
    height: 200px;
    border-radius: 14px;
    margin-bottom: 16px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    transition: transform 0.4s ease;
    object-fit: cover;
    background: rgba(255,255,255,0.08);
    cursor: pointer;
  }

  .card-skeleton {
    width: 100%;
    height: 200px;
    border-radius: 14px;
    margin-bottom: 16px;
    background: linear-gradient(90deg, rgba(255,255,255,0.1) 25%, rgba(255,255,255,0.05) 50%, rgba(255,255,255,0.1) 75%);
    background-size: 200% 100%;
    animation: loading 1.5s infinite;
  }

  .card:hover img {
    transform: scale(1.08);
  }

  .item-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: linear-gradient(135deg, var(--gold), rgba(212, 175, 55, 0.8));
    color: #080606;
    padding: 4px 12px;
    border-radius: 50px;
    font-size: 0.75rem;
    font-weight: 700;
    z-index: 10;
    text-transform: uppercase;
  }

  .favorite-btn {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(255, 255, 255, 0.1);
    border: none;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.3s;
    z-index: 10;
  }

  .favorite-btn:hover {
    background: rgba(255, 255, 255, 0.2);
    transform: scale(1.1);
  }

  .favorite-btn.favorited {
    background: rgba(255, 50, 100, 0.8);
    animation: heartPulse 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  }

  @keyframes heartPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .item-name {
    font-weight: 900;
    font-size: 1.2rem;
    margin-bottom: 12px;
    user-select: text;
    margin-top: 8px;
  }

  .item-desc {
    color: #efdf9fcc;
    font-weight: 500;
    font-size: 0.95rem;
    margin-bottom: 16px;
    line-height: 1.5;
    user-select: text;
  }

  .item-price {
    font-weight: 900;
    font-size: 1.4rem;
    color: var(--gold);
    user-select: text;
  }

  .item-nutrition {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #d4af37aa;
    user-select: text;
  }

  .item-prep-time {
    margin-top: 8px;
    font-size: 0.85rem;
    color: #d4af3777;
    user-select: text;
  }

  .allergens {
    margin-top: 12px;
    font-size: 0.9rem;
    color: #d4af3777;
    font-weight: 600;
    user-select: text;
  }

  .item-customize {
    margin-top: 12px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 8px;
    font-size: 0.85rem;
  }

  .customize-input {
    width: 100%;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    background: rgba(255, 255, 255, 0.08);
    color: var(--gold);
    margin-top: 8px;
  }

  .customize-input::placeholder {
    color: rgba(212, 175, 55, 0.4);
  }

  .quantity-selector {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 12px;
  }

  .qty-btn {
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid var(--gold);
    color: var(--gold);
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-weight: 700;
    transition: all 0.3s;
  }

  .qty-btn:hover {
    background: var(--gold);
    color: #080606;
    transform: scale(1.1);
  }

  .qty-display {
    flex: 1;
    text-align: center;
    font-weight: 600;
  }

  .cart-btn-small {
    margin-top: 12px;
    padding: 8px 16px;
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.3s;
    width: 100%;
  }

  .cart-btn-small:hover {
    background: var(--gold);
    color: #080606;
    transform: translateY(-2px);
  }

  .cart-btn-small:active {
    transform: scale(0.95);
  }

  /* Contact Panel */
  #contact-panel {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(30px);
    box-shadow: 0 -8px 32px rgba(0, 0, 0, 0.3);
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 35px;
    padding: 16px 20px;
    z-index: 2400;
    user-select: none;
    font-weight: 600;
    flex-wrap: wrap;
  }

  #contact-panel a, #contact-panel button {
    color: var(--gold);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 50px;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.1);
    cursor: pointer;
  }

  #contact-panel a:hover, #contact-panel button:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(212, 175, 55, 0.3);
    transform: translateY(-2px);
  }

  #contact-panel .wifi-info {
    font-size: 0.8rem;
    text-align: center;
    padding: 8px 12px;
    user-select: none;
  }

  #contact-panel button.copy-btn {
    background: linear-gradient(135deg, var(--gold), rgba(212, 175, 55, 0.8));
    color: #080606;
    border: none;
    padding: 8px 16px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    user-select: none;
    font-size: 0.9rem;
  }

  #contact-panel button.copy-btn:hover {
    transform: translateY(-2px);

const imagesList = [
    "Breakfast.jpg","Menemen.jpg","Omellet.jpg","Tira.jpg","Chocolate.jpg"
];

let currentLang = localStorage.getItem("turkianLang") || "en";
let favorites = JSON.parse(localStorage.getItem("turkianFavorites")) || [];
let comparisonItems = [];
let currentCart = [];
let lastOpenedCategory = null;
let allItems = [];

// Toast Notification System
function showToast(message, type = "info") {
  const container = document.getElementById("toast-container");
  const toast = document.createElement("div");
  toast.className = `toast ${type}`;
  toast.textContent = message;
  container.appendChild(toast);
  
  setTimeout(() => {
    toast.classList.add("removing");
    setTimeout(() => toast.remove(), 300);
  }, 3000);
}

// Initialize
function init() {
  setDirByLang(currentLang);
  
  if (localStorage.getItem("turkianDarkMode") === "true") {
    document.body.classList.add("light-mode");
    document.getElementById("darkModeToggle").textContent = "☀️";
  }
  
  updateFavoritesButton();
  initMarquee();
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function initMarquee() {
  const parent1 = document.getElementById("marquee-content");
  const parent2 = document.getElementById("marquee-content-duplicate");
  parent1.innerHTML = "";
  parent2.innerHTML = "";
  
  let shuffledImgs = [...imagesList].filter(img => img.length > 0);
  shuffle(shuffledImgs);
  
  shuffledImgs.forEach(img => {
    const imgEl = document.createElement("img");
    imgEl.src = img;
    imgEl.alt = "Menu item";
    imgEl.onerror = () => { imgEl.style.display = "none"; };
    parent1.appendChild(imgEl);
  });
  
  shuffledImgs.forEach(img => {
    const imgEl = document.createElement("img");
    imgEl.src = img;
    imgEl.alt = "Menu item";
    imgEl.onerror = () => { imgEl.style.display = "none"; };
    parent2.appendChild(imgEl);
  });
}

function setDirByLang(lang) {
  document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  document.documentElement.lang = lang === "ar" ? "ar" : "en";
}

function getAllItems() {
  const menu = currentLang === "ar" ? menuAr : menuEn;
  allItems = [];
  Object.values(menu).forEach(items => {
    allItems = allItems.concat(items);
  });
  return allItems;
}

function updateFavoritesButton() {
  const btn = document.getElementById("favoritesBtn");
  btn.textContent = currentLang === "ar" ? `❤️ (${favorites.length})` : `❤️ (${favorites.length})`;
  if (favorites.length > 0) {
    btn.classList.add("has-favorites");
  }
}

function addToFavorites(item) {
  const exists = favorites.some(fav => fav.name === item.name);
  if (!exists) {
    favorites.push(item);
    localStorage.setItem("turkianFavorites", JSON.stringify(favorites));
    updateFavoritesButton();
    showToast(currentLang === "ar" ? "تمت إضافة إلى المفضلة! ❤️" : "Added to favorites! ❤️", "success");
  } else {
    removeFromFavorites(item.name);
  }
}

function removeFromFavorites(itemName) {
  favorites = favorites.filter(fav => fav.name !== itemName);
  localStorage.setItem("turkianFavorites", JSON.stringify(favorites));
  updateFavoritesButton();
  showToast(currentLang === "ar" ? "تمت الإزالة من المفضلة" : "Removed from favorites", "info");
}

function isFavorited(itemName) {
  return favorites.some(fav => fav.name === itemName);
}

function renderCatList() {
  getAllItems();
  setDirByLang(currentLang);
  
  document.getElementById("subtitleTxt").textContent = currentLang === "ar" 
    ? "كافيه وحلويات تركيانا — حيث يلتقي التراث بالأناقة" 
    : "CAFÉ & SWEETS — Where Heritage Meets Elegance";
  
  document.getElementById("langSwitch").textContent = currentLang === "ar" ? "English" : "العربية";
  document.getElementById("searchInput").placeholder = currentLang === "ar" ? "ابحث عن المنتجات..." : "Search menu items...";
  
  document.getElementById("cat-page").classList.remove("show");
  document.getElementById("menu").style.display = "block";
  document.getElementById("search-filter-container").classList.add("show");
  
  renderFilters();
  
  const menuCatList = document.getElementById("menuCatList");
  menuCatList.innerHTML = "";
  
  const menu = currentLang === "ar" ? menuAr : menuEn;
  Object.entries(menu).forEach(([catName, items], idx) => {
    if (items && items.length > 0) {
      const card = document.createElement("div");
      card.className = "cat-card";
      const countText = currentLang === "ar" ? `${items.length} عنصر` : `${items.length} items`;
      const firstImage = items.find(i => i.image && i.image.length > 0)?.image || "";
      
      card.innerHTML = `
        ${firstImage ? `<img class="cat-card-image" src="${firstImage}" alt="${catName}" onerror="this.style.display='none'">` : '<div class="cat-card-skeleton"></div>'}
        <div class="cat-title">${catName}</div>
        <div class="cat-count">${countText}</div>
      `;
      
      card.addEventListener("click", () => showSoloCat(Object.keys(currentLang === "ar" ? menuAr : menuEn)[idx]));
      menuCatList.appendChild(card);
    }
  });
}

function renderFilters() {
  const filterGroup = document.getElementById("filterGroup");
  filterGroup.innerHTML = "";
  
  const allergenFilters = ["dairy", "gluten", "nuts"];
  const labels = {
    dairy: currentLang === "ar" ? "خالي من الألبان" : "Dairy-Free",
    gluten: currentLang === "ar" ? "خالي من الغلوتين" : "Gluten-Free",
    nuts: currentLang === "ar" ? "خالي من المكسرات" : "Nut-Free"
  };
  
  allergenFilters.forEach(allergen => {
    const btn = document.createElement("button");
    btn.className = "filter-btn";
    btn.textContent = labels[allergen];
    btn.addEventListener("click", () => {
      btn.classList.toggle("active");
      filterByAllergen();
    });
    filterGroup.appendChild(btn);
  });
}

function filterByAllergen() {
  const activeFilters = Array.from(document.querySelectorAll(".filter-btn.active")).map(btn => {
    return Object.keys({dairy: 1, gluten: 1, nuts: 1}).find(key => btn.textContent.includes(key === "dairy" ? "Dairy" : key === "gluten" ? "Gluten" : "Nut"));
  });
  
  // Filter logic would go here
}

function showSoloCat(catName) {
  lastOpenedCategory = catName;
  const menu = document.getElementById("menu");
  menu.classList.remove("show-menu");
  
  setTimeout(() => {
    menu.style.display = "none";
    document.getElementById("search-filter-container").classList.remove("show");
    renderSoloCat(catName);
    const catPage = document.getElementById("cat-page");
    catPage.classList.add("show");
  }, 1200);
}

function renderSoloCat(catName) {
  document.getElementById("catTitleSolo").textContent = catName;
  
  const menu = currentLang === "ar" ? menuAr : menuEn;
  const items = menu[catName] || [];
  const itemsDiv = document.getElementById("catItems");
  itemsDiv.innerHTML = "";
  
  items.forEach(item => {
    const card = document.createElement("div");
    card.className = "card";
    
    const badgeHtml = item.popular ? `<span class="item-badge">${currentLang === "ar" ? "مشهور" : "POPULAR"}</span>` : "";
    const isFav = isFavorited(item.name);
    
    const allergensHtml = item.allergens && item.allergens.length 
      ? `<div class="allergens">⚠️ ${item.allergens.join(", ")}</div>` 
      : "";
    
    card.innerHTML = `
      ${badgeHtml}
      <button class="favorite-btn ${isFav ? "favorited" : ""}" data-item='${JSON.stringify(item)}'>
        ${isFav ? "❤️" : "🤍"}
      </button>
      ${item.image ? `<img src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">` : '<div class="card-skeleton"></div>'}
      <div class="item-name">${item.name}</div>
      <div class="item-desc">${item.description}</div>
      <div class="item-price">${item.price}</div>
      <div class="item-nutrition">🔥 ${item.calories || "N/A"} cal</div>
      <div class="item-prep-time">⏱️ ${item.prepTime || "N/A"}</div>
      ${allergensHtml}
      <div class="quantity-selector">
        <button class="qty-btn qty-minus">−</button>
        <div class="qty-display" data-qty="1">1</div>
        <button class="qty-btn qty-plus">+</button>
      </div>
      <div class="item-customize">
        <input type="text" class="customize-input" placeholder="${currentLang === "ar" ? "تعليمات خاصة..." : "Special instructions..."}">
      </div>
      <button class="cart-btn-small" data-item='${JSON.stringify(item)}'>${currentLang === "ar" ? "أضف للسلة" : "Add to Cart"}</button>
    `;
    
    // Quantity handlers
    const qtyDisplay = card.querySelector(".qty-display");
    card.querySelector(".qty-minus").addEventListener("click", () => {
      let qty = parseInt(qtyDisplay.dataset.qty);
      if (qty > 1) qtyDisplay.dataset.qty = qty - 1;
      qtyDisplay.textContent = qtyDisplay.dataset.qty;
    });
    
    card.querySelector(".qty-plus").addEventListener("click", () => {
      let qty = parseInt(qtyDisplay.dataset.qty);
      qtyDisplay.dataset.qty = qty + 1;
      qtyDisplay.textContent = qtyDisplay.dataset.qty;
    });
    
    // Favorite button
    card.querySelector(".favorite-btn").addEventListener("click", (e) => {
      e.stopPropagation();
      addToFavorites(item);
      card.querySelector(".favorite-btn").classList.toggle("favorited");
      card.querySelector(".favorite-btn").textContent = card.querySelector(".favorite-btn").classList.contains("favorited") ? "❤️" : "🤍";
    });
    
    // Image click for modal
    card.querySelector("img")?.addEventListener("click", (e) => {
      e.stopPropagation();
      openItemModal(item);
    });
    
    // Cart button
    card.querySelector(".cart-btn-small").addEventListener("click", (e) => {
      e.stopPropagation();
      const qty = parseInt(card.querySelector(".qty-display").dataset.qty);
      const instructions = card.querySelector(".customize-input").value;
      addToCart(item, qty, instructions);
    });
    
    itemsDiv.appendChild(card);
  });
}

function addToCart(item, qty = 1, instructions = "") {
  currentCart.push({...item, quantity: qty, instructions});
  showToast(currentLang === "ar" ? `✓ تمت إضافة ${qty} ${item.name}` : `✓ Added ${qty}x ${item.name}`, "success");
}

  updateFavoritesButton();

document.getElementById("shareBtn").addEventListener("click", () => {
  const modal = document.getElementById("shareModal");

    <div class="share-link-section">
      <p>${currentLang === "ar" ? "رابط القائمة" : "Menu Link"}</p>
      <input type="text" value="${shareUrl}" readonly onclick="this.select(); document.execCommand('copy');">

  `;

document.getElementById("printBtn").addEventListener("click", () => {
  const printSection = document.getElementById("print-section");
  const menu = currentLang === "ar" ? menuAr : menuEn;
  
  let html = `<h1>Turkiana Café & Sweets</h1>`;
  Object.entries(menu).forEach(([cat, items]) => {
    html += `<h2>${cat}</h2>`;
    items.forEach(item => {
      html += `<div style="margin:10px 0; border-bottom:1px solid #ccc; padding:10px;">
        <strong>${item.name}</strong> - ${item.price}<br>
        ${item.description}<br>
        ${item.allergens ? `Allergens: ${item.allergens.join(", ")}<br>` : ""}
      </div>`;
    });
  });
  
  printSection.innerHTML = html;
  window.print();
});

document.getElementById("modalCloseBtn").addEventListener("click", () => {
  document.getElementById("itemModal").classList.remove("show");
});

document.getElementById("itemModal").addEventListener("click", (e) => {
  if (e.target === e.currentTarget) {
    e.currentTarget.classList.remove("show");
  }
});

function openItemModal(item) {
  const modal = document.getElementById("itemModal");
  const isFav = isFavorited(item.name);
  
  const modalContent = document.getElementById("modalContent");
  modalContent.innerHTML = `
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:40px; max-width:900px;">
      <div>
        ${item.image ? `<img src="${item.image}" alt="${item.name}" style="width:100%; border-radius:16px;">` : ""}
      </div>
      <div class="modal-details">
        <h2>${item.name}</h2>
        <p>${item.description}</p>
        <div class="modal-price">${item.price}</div>
        <div class="modal-info">🔥 ${item.calories} cal | ⏱️ ${item.prepTime}</div>
        ${item.allergens ? `<div class="modal-allergens">⚠️ Allergens: ${item.allergens.join(", ")}</div>` : ""}
        <div class="modal-actions">
          <button class="modal-add-btn" onclick="addToCart({name:'${item.name}', price:'${item.price}'}); document.getElementById('itemModal').classList.remove('show'); showToast('${currentLang === "ar" ? "تمت الإضافة" : "Added to cart"}', 'success');">
            ${currentLang === "ar" ? "أضف للسلة" : "Add to Cart"}
          </button>
          <button class="modal-fav-btn ${isFav ? "favorited" : ""}" onclick="addToFavorites({name:'${item.name}', price:'${item.price}', image:'${item.image}'}); this.classList.toggle('favorited'); this.textContent = this.classList.contains('favorited') ? '❤️ ' : '🤍 '; this.textContent += '${currentLang === "ar" ? "إضافة للمفضلة" : "Add to Favorites"}'; ">
            ${isFav ? "❤️" : "🤍"} ${currentLang === "ar" ? "إضافة للمفضلة" : "Add to Favorites"}
          </button>
        </div>
      </div>
    </div>
  `;
  
  modal.classList.add("show");
}
