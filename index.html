    :root{

    *{box-sizing:border-box;margin:0;padding:0;-webkit-font-smoothing:antialiased}

    .bg-video video{width:100%;height:100%;object-fit:cover;opacity:0.82;filter:contrast(1.02) saturate(1.02) brightness(1)}
    .bg-overlay{position:fixed;inset:0;z-index:1;background:
      radial-gradient(800px 400px at 10% 20%, rgba(255,255,255,0.02), transparent 10%),
      radial-gradient(700px 300px at 85% 80%, rgba(255,255,255,0.02), transparent 12%),
      linear-gradient(180deg, rgba(10,10,12,0.06), rgba(5,5,8,0.14));
      backdrop-filter: blur(6px) saturate(110%);-webkit-backdrop-filter:blur(6px) saturate(110%);pointer-events:none}
    /* Top controls */
    .top-controls{position:fixed;top:16px;left:50%;transform:translateX(-50%);width:calc(100% - 48px);max-width:var(--max-width);z-index:12;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
    .lang{pointer-events:auto;padding:8px 12px;border-radius:999px;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.06);color:#fff;font-weight:700;cursor:pointer}
    /* App container */
    .app{min-height:100vh;display:flex;align-items:stretch;justify-content:center;position:relative;overflow:hidden;padding:48px 12px;z-index:6}
    .centered{width:100%;max-width:var(--max-width);margin:0 auto}
    /* Marquee */
    .marquee-wrap{width:100%;overflow:hidden;border-radius:12px;margin-bottom:18px;pointer-events:none}
    .marquee{display:flex;gap:18px;align-items:center;white-space:nowrap;animation:marquee 20s linear infinite}
    .marquee img{height:80px;border-radius:10px;object-fit:cover;box-shadow:0 10px 30px rgba(0,0,0,0.6)}
    @keyframes marquee {0%{transform:translateX(0%);}100%{transform:translateX(-50%);}}
    /* Landing (hero) */
    .landing{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 96px)}
    .hero{width:100%;max-width:880px;border-radius:26px;padding:28px;text-align:center;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.03));border:1px solid rgba(255,255,255,0.06);box-shadow:var(--shadow);backdrop-filter:blur(12px) saturate(120%)}

    .contact-row-bottom{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
    .contact-pill{display:inline-flex;gap:10px;align-items:center;padding:10px 12px;border-radius:999px;color:#fff;font-weight:700;text-decoration:none;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));border:1px solid rgba(255,255,255,0.06);box-shadow:0 10px 30px rgba(0,0,0,0.45);cursor:pointer}

    .category .title{color:var(--gold);font-size:15px}

    .items.open{display:flex}
    .flat-results{display:flex;flex-direction:column;gap:12px;margin-top:8px}
    /* Menu item */

    .desc{color:rgba(255,255,255,0.85);font-size:13px;line-height:1.2}
    .price{min-width:88px;text-align:right;color:var(--maroon);font-weight:800}
    .calories{font-size:12px;color:rgba(255,255,255,0.78);font-weight:700;margin-top:4px}
    /* Modal */
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:30;background:rgba(2,6,23,0.6)}

    /* State */
    let currentLang = 'en'; // 'en' or 'ar'
    const landingView = document.getElementById('landingView');
    const menuPage = document.getElementById('menuPage');
    const openMenuBtn = document.getElementById('openMenuBtn');
    const langToggle = document.getElementById('langToggle');
    const categoriesView = document.getElementById('categoriesView');
    const flatResults = document.getElementById('flatResults');
    const searchInput = document.getElementById('searchBar');
    const noResults = document.getElementById('noResults');
    const noResultsText = document.getElementById('noResultsText');
    const ariaLive = document.getElementById('ariaLive');

    function announce(msg){ if(ariaLive) ariaLive.textContent = msg; }

    function createEl(tag, attrs={}, txt=''){
      const el = document.createElement(tag);
      for(const k in attrs){
        if(k==='class') el.className = attrs[k];
        else el.setAttribute(k, attrs[k]);
      }
      if(txt) el.textContent = txt;
      return el;
    }

    /* Build menu rows (shows EN or AR based on currentLang) */
    function buildMenuItemRow(item){
      const row = createEl('div',{class:'menu-item',tabindex:0,role:'listitem'});
      const thumb = createEl('div',{class:'thumb'});
      const img = createEl('img',{src:item.image||'',alt:(currentLang==='en'?item.enName:item.arName)||'',loading:'lazy'});
      thumb.appendChild(img);

      const meta = createEl('div',{class:'meta'});
      const nameTxt = currentLang==='en' ? item.enName : item.arName;
      const descTxt = currentLang==='en' ? item.descriptionEn : item.descriptionAr;
      const nm = createEl('div',{class:'name'}, nameTxt || '');
      const desc = createEl('div',{class:'desc'}, descTxt || '');
      const cal = createEl('div',{class:'calories'}, item.calories || '');
      meta.appendChild(nm); meta.appendChild(desc); meta.appendChild(cal);

      const price = createEl('div',{class:'price'}, item.price || '');

      row.appendChild(thumb); row.appendChild(meta); row.appendChild(price);

      row.addEventListener('click', ()=> openItemModal(item));
      row.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); openItemModal(item); } });
      img.addEventListener('click', (e)=>{ e.stopPropagation(); openImageModal(img.src, nameTxt); });

      return row;
    }

    /* Render categories (shows localized category titles) */
    function renderCategories(){
      categoriesView.innerHTML=''; flatResults.style.display='none'; categoriesView.style.display='flex'; noResults.style.display='none';
      Object.keys(menuData).forEach(catKey=>{
        const cat = menuData[catKey];
        const titleText = currentLang==='en' ? catKey : cat.arTitle || catKey;
        const catEl = createEl('div',{class:'category',tabindex:0,role:'button','aria-expanded':'false'});
        const title = createEl('div',{}, titleText); title.className='title';
        const chev = createEl('div',{},'▸'); chev.className='chev';
        catEl.appendChild(title); catEl.appendChild(chev);

        const itemsWrap = createEl('div',{class:'items','aria-hidden':'true'});
        (cat.items||[]).forEach(it => {
          itemsWrap.appendChild(buildMenuItemRow(it));
        });

        catEl.addEventListener('click', ()=> toggleCategory(itemsWrap,catEl));
        catEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter' || e.key===' ') { e.preventDefault(); toggleCategory(itemsWrap,catEl); } });

        categoriesView.appendChild(catEl);
        categoriesView.appendChild(itemsWrap);
      });
    }

    function toggleCategory(itemsWrap, catEl){
      const open = itemsWrap.classList.contains('open');
      if(open){
        itemsWrap.classList.remove('open'); itemsWrap.setAttribute('aria-hidden','true'); catEl.setAttribute('aria-expanded','false'); catEl.querySelector('.chev').textContent='▸';
      } else {
        // close others
        document.querySelectorAll('.items.open').forEach(x=>{ x.classList.remove('open'); x.setAttribute('aria-hidden','true'); const p=x.previousElementSibling; if(p){ p.setAttribute('aria-expanded','false'); p.querySelector('.chev').textContent='▸'; } });
        itemsWrap.classList.add('open'); itemsWrap.setAttribute('aria-hidden','false'); catEl.setAttribute('aria-expanded','true'); catEl.querySelector('.chev').textContent='▾';
        const first = itemsWrap.querySelector('.menu-item'); if(first) first.focus();
      }
    }

    /* Flat search results view (hides categories) */
    function handleSearch(q){
      const qtrim = (q||'').trim().toLowerCase();
      if(!qtrim){ renderCategories(); return; }

      flatResults.innerHTML=''; categoriesView.style.display='none'; flatResults.style.display='flex'; noResults.style.display='none';

      const matched = [];
      Object.keys(menuData).forEach(catKey=>{
        const cat = menuData[catKey];
        (cat.items||[]).forEach(it=>{
          const nameEn = (it.enName||'').toLowerCase();
          const nameAr = (it.arName||'').toLowerCase();
          const descEn = (it.descriptionEn||'').toLowerCase();
          const descAr = (it.descriptionAr||'').toLowerCase();
          if(nameEn.includes(qtrim) || nameAr.includes(qtrim) || descEn.includes(qtrim) || descAr.includes(qtrim)){
            matched.push(Object.assign({},it,{category: currentLang==='en'?catKey:cat.arTitle}));
          }
        });
      });

      if(!matched.length){
        flatResults.style.display='none'; noResults.style.display='block'; noResultsText.textContent = currentLang==='en' ? 'No items found. Try a different search.' : 'لم يتم العثور على عناصر. حاول البحث بكلمة أخرى.'; announce('No results');
        return;
      }

      matched.forEach(it=>{
        const wrapper = createEl('div',{style:'display:flex;flex-direction:column;gap:8px'});
        const catLabelText = it.category || '';
        const catLabel = createEl('div',{style:'font-size:12px;color:var(--muted);margin-bottom:6px'}, catLabelText);
        wrapper.appendChild(catLabel);
        wrapper.appendChild(buildMenuItemRow(it));
        flatResults.appendChild(wrapper);
      });

      announce(`${matched.length} results`);
    }

    /* Modals & focus trap */
    const itemModal = document.getElementById('item-modal');
    const imageModal = document.getElementById('image-modal');
    let lastFocus = null;
    function trapFocus(modal){
      const focusable = modal.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
      if(!focusable.length) return null;
      const first = focusable[0], last = focusable[focusable.length-1];
      function handler(e){
        if(e.key==='Tab'){
          if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
          else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
        } else if(e.key==='Escape'){ closeAllModals(); }
      }
      modal.addEventListener('keydown', handler);
      return ()=> modal.removeEventListener('keydown', handler);
    }
    function openItemModal(it){
      lastFocus = document.activeElement;
      document.getElementById('modal-name').textContent = currentLang==='en' ? it.enName : it.arName;
      document.getElementById('modal-price').textContent = it.price || '';
      document.getElementById('modal-cal').textContent = it.calories ? (currentLang==='en' ? `Estimated: ${it.calories}` : `سعرات تقديرية: ${it.calories}`) : '';
      document.getElementById('modal-description').textContent = currentLang==='en' ? it.descriptionEn : it.descriptionAr;
      itemModal.classList.add('show'); itemModal.setAttribute('aria-hidden','false');
      const remove = trapFocus(itemModal); itemModal._removeTrap = remove;
      const close = document.getElementById('modalClose'); if(close) close.focus();
    }
    function closeItemModal(){ itemModal.classList.remove('show'); itemModal.setAttribute('aria-hidden','true'); if(itemModal._removeTrap) itemModal._removeTrap(); if(lastFocus && lastFocus.focus) lastFocus.focus(); }

    function openImageModal(src, alt){
      lastFocus = document.activeElement;
      const img = document.getElementById('zoomed-image'); img.src = src||''; img.alt = alt||'';
      imageModal.classList.add('show'); imageModal.setAttribute('aria-hidden','false');
      const remove = trapFocus(imageModal); imageModal._removeTrap = remove;
      const close = document.getElementById('imageModalClose'); if(close) close.focus();
    }
    function closeImageModal(){ imageModal.classList.remove('show'); imageModal.setAttribute('aria-hidden','true'); if(imageModal._removeTrap) imageModal._removeTrap(); const img = document.getElementById('zoomed-image'); if(img) img.src=''; if(lastFocus && lastFocus.focus) lastFocus.focus(); }

    document.getElementById('modalClose').addEventListener('click', closeItemModal);
    document.getElementById('imageModalClose').addEventListener('click', closeImageModal);
    [itemModal,imageModal].forEach(m=>{ if(!m) return; m.addEventListener('click',(e)=>{ if(e.target===m) closeAllModals(); }); });

    function closeAllModals(){ closeItemModal(); closeImageModal(); }

    /* Hover preview (desktop) */
    const hoverPrev = document.getElementById('hover-preview');
    let isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    document.addEventListener('mouseover',(e)=>{ if(isTouch) return; const t=e.target; if(t && t.tagName==='IMG' && t.closest('.thumb')){ hoverPrev.src = t.src; hoverPrev.style.display='block'; }});
    document.addEventListener('mousemove',(e)=>{ if(!hoverPrev || hoverPrev.style.display!=='block') return; let x=e.clientX+18,y=e.clientY+18; const vw=window.innerWidth,vh=window.innerHeight,mw=300,mh=300; if(x+mw>vw) x=e.clientX-mw-18; if(y+mh>vh) y=e.clientY-mh-18; hoverPrev.style.left=x+'px'; hoverPrev.style.top=y+'px'; });
    document.addEventListener('mouseout',(e)=>{ const t=e.target; if(t && t.tagName==='IMG' && t.closest('.thumb')) hoverPrev.style.display='none'; });

    /* Copy WiFi */
    document.getElementById('copy-wifi-en').addEventListener('click', ()=>{
      const ssid = document.getElementById('wifi-ssid-en').textContent.trim();
      const pass = document.getElementById('wifi-pass-en').textContent.trim();
      const text = `Wi-Fi: ${ssid} Password: ${pass}`;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(()=>{ const b=document.getElementById('copy-wifi-en'); const prev=b.textContent; b.textContent = currentLang==='en' ? 'Copied' : 'تم النسخ'; setTimeout(()=>b.textContent=prev,1300); announce('Wi‑Fi details copied'); }).catch(()=> announce('Copy failed'));
      } else {
        const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select();
        try{ document.execCommand('copy'); announce('Wi‑Fi details copied'); }catch(e){ announce('Copy failed'); } document.body.removeChild(ta);
      }
    });

    /* Open menu navigation (separate page) */
    openMenuBtn.addEventListener('click', ()=>{
      landingView.style.display = 'none';
      menuPage.style.display = 'block';
      menuPage.setAttribute('aria-hidden','false');
      document.getElementById('searchBar').focus();
      announce(currentLang==='en'?'Menu opened':'تم فتح القائمة');
    });

    /* Language toggle: switches UI and content to Arabic/English */
    langToggle.addEventListener('click', ()=>{
      currentLang = currentLang==='en' ? 'ar' : 'en';
      document.documentElement.lang = currentLang==='ar' ? 'ar' : 'en';
      document.documentElement.dir = currentLang==='ar' ? 'rtl' : 'ltr';
      langToggle.textContent = currentLang==='en' ? 'العربية' : 'English';
      // update placeholders and brand text
      document.getElementById('searchBar').placeholder = currentLang==='en' ? 'Search menu items...' : 'ابحث عن عناصر القائمة...';
      document.getElementById('openMenuBtn').textContent = currentLang==='en' ? 'Explore Our Menu' : 'استعرض قائمتنا';
      document.getElementById('brandTitle').textContent = currentLang==='en' ? 'Turkiana' : 'تركيانا';
      document.getElementById('brandSub').textContent = currentLang==='en' ? 'CAFÉ & SWEETS' : 'مقهى وحلويات';
      document.getElementById('brandTag').textContent = currentLang==='en' ? 'Where Tradition Meets Elegance' : 'حيث يلتقي التراث بالأناقة';
      // re-render menu in selected language
      renderCategories();
      // if search has value, re-run search to show flat results localized
      if(searchInput.value && searchInput.value.trim()) handleSearch(searchInput.value);
      announce(currentLang==='en' ? 'Language switched to English' : 'تم تغيير اللغة إلى العربية');
    });

    /* Search input logic */
    let searchTimer = null;
    searchInput.addEventListener('input',(e)=>{
      clearTimeout(searchTimer);
      searchTimer = setTimeout(()=>{ handleSearch(e.target.value || ''); }, 140);
    });

    /* Keyboard: close modals on Escape */
    document.addEventListener('keydown', (e)=>{ if(e.key==='Escape') closeAllModals(); });

    /* Init */
    function init(){
      landingView.style.display = 'flex';
      menuPage.style.display = 'none';
      document.documentElement.lang = 'en';
      document.documentElement.dir = 'ltr';
      langToggle.textContent = 'العربية';
      document.getElementById('searchBar').placeholder = 'Search menu items...';
      renderCategories();
      announce('Welcome to Turkiana. Press Explore Our Menu to continue.');
    }
    document.addEventListener('DOMContentLoaded', init);

    /* Expose for debug */
    window._turkiana = { renderCategories, handleSearch };
  </script>
</body>
</html>
