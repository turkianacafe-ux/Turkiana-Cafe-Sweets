    <style>
        /* ----- RESET & VARIABLES (glass-morphism) ----- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0f1a; /* deep night */
            --text: #fdf3e0; --soft: #d4bc9a; --gold: #c7a05b; --accent: #e2b675; --border: #8b6b4a;
            --font-sans: 'Inter', system-ui, sans-serif; --font-heading: 'Playfair Display', serif; --font-ar: 'Scheherazade New', serif;
            --card-bg: rgba(20, 15, 12, 0.4); --card-blur: 12px; --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
        }
        body.light {
            --bg: #fbf3e8; --text: #2d1f13; --soft: #5f4e3c; --gold: #b28b4b; --accent: #9e6d3e; --border: #b49b7b;
            --card-bg: rgba(239, 226, 213, 0.5);
        }
        body {
            background: transparent; font-family: var(--font-sans); color: var(--text); line-height: 1.6; overflow-x: hidden; min-height: 100vh;
            position: relative; transition: color 0.2s;
        }
        body[dir="rtl"] { font-family: var(--font-ar); }
        /* canvas background fixed */
        #canvas-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; display: block; pointer-events: none;
        }
        /* ----- GLASS-MORPHISM UI (frosted + gold) ----- */
        .controls, .cat-bar, .search-box, .menu-card, .modal-content, footer, #qr-modal-content {
            backdrop-filter: blur(var(--card-blur)); background: var(--card-bg); border: 1px solid rgba(199,160,91,0.3); box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }
        .controls { position: fixed; top: 20px; right: 20px; display: flex; gap: 14px; z-index: 300; border-radius: 60px; padding: 8px; }
        .ctrl { width: 52px; height: 52px; border-radius: 50%; background: rgba(30,20,15,0.7); border: 1px solid var(--gold); color: var(--gold); font-size: 1.6rem; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .ctrl:hover { background: var(--gold); color: #0a0503; transform: scale(1.08); }
        #qrBtn { font-size: 1.4rem; }
        .cat-bar { position: sticky; top: 20px; z-index: 200; border-radius: 9999px; padding: 14px 18px; margin: 0 20px 32px; display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; }
        .cat-btn { padding: 12px 28px; white-space: nowrap; border-radius: 9999px; border: 1px solid var(--border); background: transparent; color: var(--text); font-weight: 500; transition: 0.35s; flex-shrink: 0; cursor: pointer; }
        .cat-btn.active, .cat-btn:hover { background: var(--gold); color: #0a0503; border-color: var(--gold); transform: translateY(-3px); }
        .menu-container { padding: 40px 20px 120px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 100; }
        .menu-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 36px; }
        .menu-card { border-radius: 32px; overflow: hidden; transition: box-shadow 0.4s, transform 0.2s; cursor: pointer; opacity: 0; transform: translateY(30px) scale(0.98); animation: cardFadeIn 0.6s forwards; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.5); will-change: transform; }
        @keyframes cardFadeIn { to { opacity: 1; transform: translateY(0) scale(1); } }
        .menu-card:hover { box-shadow: 0 50px 110px rgba(199,160,91,0.3); }
        .menu-card .figure { aspect-ratio: 16/9; overflow: hidden; }
        .menu-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 1s; }
        .menu-card:hover img { transform: scale(1.08); }
        .menu-card .content { padding: 22px 20px; background: transparent; }
        .menu-card .name { font-family: var(--font-heading); font-size: 1.6rem; color: var(--gold); }
        .menu-card .name-ar { font-family: var(--font-ar); font-size: 1.2rem; color: var(--soft); }
        .menu-card .desc { color: var(--soft); font-size: 0.9rem; }
        .menu-card .price { margin-top: 12px; font-size: 1.4rem; font-weight: 600; color: var(--accent); }
        .search-float { position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 500px; z-index: 400; }
        .search-box { border-radius: 9999px; padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
        #searchInput { flex:1; background: none; border: none; outline: none; color: var(--text); font-size: 1.1rem; }
        #clearBtn { background: none; border: none; color: var(--gold); font-size: 1.5rem; display: none; cursor: pointer; }
        dialog { border: none; background: transparent; max-width: 700px; width: 94%; margin: auto; padding: 0; }
        .modal-content { border-radius: 32px; overflow: hidden; border: 2px solid var(--gold); animation: modalFade 0.3s; }
        .modal-close { position: absolute; top: 20px; right: 20px; width: 48px; height: 48px; background: rgba(0,0,0,0.7); border: none; color: white; font-size: 2rem; border-radius: 50%; cursor: pointer; }
        .modal-body { padding: 28px; }
        .detail-row { display: flex; flex-wrap: wrap; gap: 20px; background: rgba(199,160,91,0.1); padding: 18px; border-radius: 24px; margin-top: 20px; }
        .detail-item .label { font-size: 0.8rem; letter-spacing: 1px; color: var(--soft); }
        .detail-item .value { font-size: 1.1rem; font-weight: 500; color: var(--accent); }
        .milk-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .milk-badge { background: rgba(226,182,117,0.2); border: 1px solid var(--border); border-radius: 40px; padding: 4px 14px; font-size: 0.85rem; }
        footer { text-align: center; padding: 60px 20px 40px; color: var(--soft); position: relative; z-index: 100; border-top: none; margin-top: 60px; }
        .brand { font-family: var(--font-heading); font-size: 3rem; color: var(--gold); }
        #qr-modal-content { text-align: center; padding: 40px; background: var(--card-bg); backdrop-filter: blur(20px); border-radius: 48px; }
        #qrCanvas { margin: 20px auto; display: block; background: white; padding: 16px; border-radius: 24px; }
        .recommend-bar { margin-top: 24px; display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
        .reco-chip { background: rgba(199,160,91,0.3); border: 1px solid var(--gold); border-radius: 60px; padding: 6px 18px; font-size: 0.9rem; cursor: pointer; transition: 0.2s; }
        .reco-chip:hover { background: var(--gold); color: #000; }
    </style>
</head>

    </dialog>

    <script>
    (function() {
        // ----- MENU DATA -----
        const data = JSON.parse(document.getElementById('menuData').textContent);
        const IMAGE_BASE = "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/";
        let lang = localStorage.getItem('lang') || 'en';
        let activeCat = 'all';
        let searchQ = '';
        let currentItems = [];
        let lastClickedItem = null;

        // DOM elements
        const els = {
            grid: document.getElementById('grid'),
            catBar: document.getElementById('catBar'),
            searchInput: document.getElementById('searchInput'),
            clearBtn: document.getElementById('clearBtn'),
            modal: document.getElementById('modal'),
            modalImg: document.getElementById('modalImg'),
            modalBody: document.getElementById('modalBody'),
            recoSection: document.getElementById('recoSection'),
            modalClose: document.getElementById('modalClose'),
            themeBtn: document.getElementById('themeBtn'),
            langBtn: document.getElementById('langBtn'),
            qrBtn: document.getElementById('qrBtn'),
            qrModal: document.getElementById('qrModal'),
            qrCanvas: document.getElementById('qrCanvas'),
            closeQrBtn: document.getElementById('closeQrBtn')
        };

        // ----- THREE.JS: 3D CRESCENT MOON, LANTERNS, FLOATING PHYSICS, PARALLAX, FOG, GOLDEN PARTICLES -----
        const canvas = document.getElementById('canvas-bg');
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: false, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true; // for lantern light (though not on HTML)
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0f1a); // deep night
        scene.fog = new THREE.FogExp2(0x0a0f1a, 0.002); // depth fog

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 18);
        camera.lookAt(0, 2, 0);

        // Lights
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);
        const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
        dirLight.position.set(-5, 10, 7);
        scene.add(dirLight);

        // ---- 3D CRESCENT MOON (realistic with cutout sphere) ----
        const moonGroup = new THREE.Group();
        // Main moon sphere
        const moonGeo = new THREE.SphereGeometry(2.2, 64, 64);
        const moonMat = new THREE.MeshStandardMaterial({ color: 0xf5e6c0, emissive: 0x332211, roughness: 0.5, metalness: 0.1 });
        const moonMesh = new THREE.Mesh(moonGeo, moonMat);
        moonMesh.castShadow = true; moonMesh.receiveShadow = true;
        moonGroup.add(moonMesh);

        // Dark sphere to carve crescent (positioned to create thin crescent)
        const darkGeo = new THREE.SphereGeometry(2.0, 64, 64);
        const darkMat = new THREE.MeshStandardMaterial({ color: 0x0a0f1a, emissive: 0x0a0f1a }); // match background
        const darkMesh = new THREE.Mesh(darkGeo, darkMat);
        darkMesh.position.set(1.4, 0.2, 0.3); // offset to create crescent shape
        darkMesh.castShadow = false; darkMesh.receiveShadow = false;
        moonGroup.add(darkMesh);

        // Add glow (point light + halo sprite)
        const moonLight = new THREE.PointLight(0xffdd99, 1.5, 30);
        moonLight.position.set(-5, 5, -12);
        moonGroup.add(moonLight);

        // Halo sprite
        const haloMap = (() => {
            const c = document.createElement('canvas'); c.width = 64; c.height = 64;
            const ctx = c.getContext('2d');
            const grad = ctx.createRadialGradient(32,32,0,32,32,32);
            grad.addColorStop(0, 'rgba(255,240,180,0.8)'); grad.addColorStop(0.5, 'rgba(200,150,80,0.2)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(c);
        })();
        const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: haloMap, blending: THREE.AdditiveBlending }));
        halo.scale.set(5, 5, 1);
        moonGroup.add(halo);

        moonGroup.position.set(-6, 5, -15);
        scene.add(moonGroup);

        // ---- 3D FANOUS LANTERNS (with flame shader using canvas texture animation) ----
        function createLantern(pos) {
            const group = new THREE.Group();
            // Metal frame (simplified)
            const metalMat = new THREE.MeshStandardMaterial({ color: 0xccaa77, roughness: 0.3, metalness: 0.8 });
            const glassMat = new THREE.MeshStandardMaterial({ color: 0xffaa44, emissive: 0x442200, transparent: true, opacity: 0.3 });
            
            // Body (glass cylinder)
            const glass = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 1.6, 16), glassMat);
            glass.castShadow = true; glass.receiveShadow = true;
            group.add(glass);
            
            // Top and bottom caps
            const capGeo = new THREE.CylinderGeometry(0.8, 0.8, 0.15, 8);
            const topCap = new THREE.Mesh(capGeo, metalMat); topCap.position.y = 0.85; group.add(topCap);
            const bottomCap = new THREE.Mesh(capGeo, metalMat); bottomCap.position.y = -0.85; group.add(bottomCap);
            
            // Decorative rings
            const ringGeo = new THREE.TorusGeometry(0.72, 0.04, 8, 24);
            const ringMat = new THREE.MeshStandardMaterial({ color: 0xbb9955 });
            const ring1 = new THREE.Mesh(ringGeo, ringMat); ring1.rotation.x = Math.PI/2; ring1.position.y = 0.3; group.add(ring1);
            const ring2 = new THREE.Mesh(ringGeo, ringMat); ring2.rotation.x = Math.PI/2; ring2.position.y = -0.3; group.add(ring2);
            
            // Flame (animated canvas texture)
            const flameCanvas = document.createElement('canvas'); flameCanvas.width = 32; flameCanvas.height = 32;
            const flameCtx = flameCanvas.getContext('2d');
            const flameTex = new THREE.CanvasTexture(flameCanvas);
            const flameMat = new THREE.SpriteMaterial({ map: flameTex, blending: THREE.AdditiveBlending });
            const flameSprite = new THREE.Sprite(flameMat);
            flameSprite.scale.set(0.5, 0.7, 0.5);
            flameSprite.position.y = 0.2;
            group.add(flameSprite);
            
            // Point light inside
            const light = new THREE.PointLight(0xffaa33, 1.8, 8);
            light.position.set(0, 0.2, 0);
            group.add(light);
            
            group.position.copy(pos);
            return { group, flameTex, flameCtx, light };
        }

        const lanternPositions = [
            new THREE.Vector3(-5, 1.5, -5), new THREE.Vector3(2, 2.0, -8), new THREE.Vector3(6, 1.2, -4),
            new THREE.Vector3(-3, 2.5, 2), new THREE.Vector3(4, 1.8, 0), new THREE.Vector3(-6, 2.2, 2)
        ];
        const lanterns = [];
        lanternPositions.forEach(pos => {
            const { group, flameTex, flameCtx, light } = createLantern(pos);
            scene.add(group);
            lanterns.push({ group, flameTex, flameCtx, light });
        });

        // ---- GOLDEN PARTICLES (galaxy) with cursor influence ----
        const particleCount = 1200;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleColors = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount; i++) {
            let r = 12 + Math.random() * 15;
            let theta = Math.random() * Math.PI * 2;
            let phi = Math.acos(2 * Math.random() - 1);
            particlePositions[i*3] = Math.sin(phi) * Math.cos(theta) * r;
            particlePositions[i*3+1] = Math.sin(phi) * Math.sin(theta) * r * 0.4;
            particlePositions[i*3+2] = Math.cos(phi) * r - 5;
            
            let goldShade = 0.7 + Math.random() * 0.5;
            particleColors[i*3] = goldShade;
            particleColors[i*3+1] = goldShade * 0.6;
            particleColors[i*3+2] = 0.1;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('color', new THREE.BufferAttribute(particleColors, 3));
        const particleMat = new THREE.PointsMaterial({ size: 0.18, vertexColors: true, transparent: true, blending: THREE.AdditiveBlending });
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Stars background
        const starsGeo = new THREE.BufferGeometry();
        const starsPos = [];
        for (let i = 0; i < 800; i++) {
            starsPos.push((Math.random()-0.5)*200, (Math.random()-0.5)*200, (Math.random()-0.5)*200 - 50);
        }
        starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));
        const starsMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.2 });
        const stars = new THREE.Points(starsGeo, starsMat);
        scene.add(stars);

        // Parallax: store original rotations
        const baseRotY = 0;

        // Mouse move for parallax and particle attraction
        let mouseX = 0, mouseY = 0;
        window.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });

        // Animate flame textures
        function updateFlames() {
            lanterns.forEach(l => {
                const ctx = l.flameCtx;
                const w = 32, h = 32;
                ctx.clearRect(0, 0, w, h);
                // Random flicker
                const rad = Math.random() * 10 + 12;
                const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, rad);
                gradient.addColorStop(0, `rgba(255, 200, 100, ${0.9+Math.random()*0.1})`);
                gradient.addColorStop(0.5, `rgba(255, 100, 0, 0.8)`);
                gradient.addColorStop(0.9, `rgba(80, 20, 0, 0.2)`);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, w, h);
                l.flameTex.needsUpdate = true;
                // Flicker light intensity
                if (l.light) l.light.intensity = 1.2 + Math.random() * 0.5;
            });
        }

        // Animation loop
        let clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const time = performance.now() * 0.001;

            // Lantern floating physics (vertical + horizontal drift)
            lanterns.forEach((l, i) => {
                l.group.position.y += Math.sin(time*0.7 + i) * 0.0015;
                l.group.position.x += Math.cos(time*0.4 + i) * 0.001;
                l.group.rotation.y += 0.0015;
            });

            // Update flame textures every few frames
            if (Math.floor(time*10) % 3 === 0) updateFlames();

            // Parallax: rotate stars and particles slightly based on mouse
            stars.rotation.y += (mouseX * 0.02 - stars.rotation.y) * 0.01;
            stars.rotation.x += (mouseY * 0.02 - stars.rotation.x) * 0.01;
            particles.rotation.y += (mouseX * 0.01 - particles.rotation.y) * 0.01;
            particles.rotation.x += (mouseY * 0.01 - particles.rotation.x) * 0.01;

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ----- MENU FUNCTIONS (preserving all items, temperature logic, milk options) -----
        function getFiltered() {
            let filtered = data.items;
            if (activeCat !== 'all') filtered = filtered.filter(i => i.categoryId === activeCat);
            if (searchQ) {
                const q = searchQ.toLowerCase();
                filtered = filtered.filter(i => i.nameEn.toLowerCase().includes(q) || i.nameAr.includes(q) || i.descriptionEn.toLowerCase().includes(q));
            }
            return filtered;
        }

        function renderCats() {
            let html = '';
            data.categories.forEach(c => {
                const name = lang === 'ar' ? c.nameAr : c.nameEn;
                html += `<button class="cat-btn ${c.id===activeCat?'active':''}" data-id="${c.id}">${name}</button>`;
            });
            els.catBar.innerHTML = html;
            els.catBar.querySelectorAll('.cat-btn').forEach(b => {
                b.addEventListener('click', (e) => {
                    activeCat = b.dataset.id;
                    renderCats();
                    switchContent(getFiltered());
                });
            });
        }

        function createCardHTML(item) {
            const name = lang === 'ar' ? item.nameAr : item.nameEn;
            const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
            return `<div class="figure"><img src="${IMAGE_BASE}${item.image}" alt="${name}" loading="lazy"></div>
                    <div class="content"><div class="name">${name}</div>${nameAlt ? `<div class="name-ar">${nameAlt}</div>` : ''}
                    <div class="desc">${item.descriptionEn}</div><div class="price">${item.price} QAR</div></div>`;
        }

        function renderGrid(items) {
            els.grid.innerHTML = '';
            items.forEach((item, idx) => {
                const card = document.createElement('div');
                card.className = 'menu-card';
                card.style.animationDelay = idx*0.02 + 's';
                card.innerHTML = createCardHTML(item);
                card.addEventListener('click', () => openModal(item));
                els.grid.appendChild(card);
            });
        }

        function switchContent(newItems) {
            currentItems = newItems;
            els.grid.style.opacity = '0';
            setTimeout(() => {
                renderGrid(newItems);
                els.grid.style.opacity = '1';
            }, 150);
        }

        // Temperature logic (strict)
        function getTempDisplay(item) {
            const name = item.nameEn.toLowerCase();
            // Hot-only items
            if (name.includes('classic turkish') || name.includes('double turkish') || name.includes('sahlep') || 
                (name.includes('arabic coffee') && !name.includes('iced')) || 
                (name.includes('turkish tea') && !name.includes('iced'))) return '🌡️ Hot only';
            // Iced-only items
            if (name.includes('iced') || name.includes('cold brew') || name.includes('ice drip') || item.categoryId === 'refreshers' && !name.includes('hot')) return '❄️ Iced only';
            return '🌡️ Hot & ❄️ Iced';
        }

        function getRecommendations(item) {
            // simple AI: same category, exclude self
            return data.items.filter(i => i.categoryId === item.categoryId && i.id !== item.id).slice(0, 3);
        }

        function openModal(item) {
            lastClickedItem = item;
            const name = lang === 'ar' ? item.nameAr : item.nameEn;
            const nameAlt = lang === 'ar' ? item.nameEn : item.nameAr || '';
            els.modalImg.innerHTML = `<img src="${IMAGE_BASE}${item.image}" style="width:100%;height:100%;object-fit:cover" alt="${name}">`;
            
            const tempDisplay = getTempDisplay(item);
            const milkOptions = (item.hasMilk || (item.dietary && item.dietary.includes('contains-dairy'))) ? 
                ["Full Fat Milk", "Low-Fat", "Skim", "Lactose Free", "Oat", "Almond", "Soy", "Coconut"] : [];
            const allergens = item.dietary?.length ? item.dietary.join(', ') : 'None';
            
            let extras = '';
            if (milkOptions.length) {
                extras += `<div class="detail-row"><div class="detail-item"><span class="label">🥛 Milk Options</span><div class="milk-list">${milkOptions.map(m => `<span class="milk-badge">${m}</span>`).join('')}</div></div></div>`;
            }
            
            els.modalBody.innerHTML = `
                <h2 style="font-family:var(--font-heading);font-size:2.4rem;color:var(--gold);">${name}</h2>
                ${nameAlt ? `<div style="font-size:1.3rem;color:var(--soft);">${nameAlt}</div>` : ''}
                <div style="font-size:1.8rem;font-weight:600;color:var(--accent);margin:16px 0">${item.price} QAR</div>
                <p>${item.descriptionEn}</p>
                <div class="detail-row">
                    <div class="detail-item"><span class="label">🔥 Calories</span><div class="value">${item.calories}</div></div>
                    <div class="detail-item"><span class="label">⚠️ Allergens</span><div class="value">${allergens}</div></div>
                    <div class="detail-item"><span class="label">🌡️ Temp</span><div class="value">${tempDisplay}</div></div>
                </div>
                ${extras}
            `;

            // Recommendations
            const recos = getRecommendations(item);
            if (recos.length) {
                let recoHtml = '<div style="margin-top:20px;"><h4 style="color:var(--gold);">You might also like</h4><div class="recommend-bar">';
                recos.forEach(r => {
                    recoHtml += `<span class="reco-chip" data-id="${r.id}">${lang==='ar'?r.nameAr:r.nameEn}</span>`;
                });
                recoHtml += '</div></div>';
                els.recoSection.innerHTML = recoHtml;
                els.recoSection.querySelectorAll('.reco-chip').forEach(chip => {
                    chip.addEventListener('click', () => {
                        const id = chip.dataset.id;
                        const found = data.items.find(i => i.id === id);
                        if (found) openModal(found);
                    });
                });
            } else els.recoSection.innerHTML = '';

            els.modal.showModal();
        }

        // ----- EVENT LISTENERS -----
        els.modalClose.addEventListener('click', () => els.modal.close());
        els.modal.addEventListener('click', e => { if (e.target === els.modal) els.modal.close(); });

        els.searchInput.addEventListener('input', () => {
            searchQ = els.searchInput.value.trim();
            els.clearBtn.style.display = searchQ ? 'block' : 'none';
            switchContent(getFiltered());
            renderCats();
        });
        els.clearBtn.addEventListener('click', () => {
            els.searchInput.value = '';
            searchQ = '';
            els.clearBtn.style.display = 'none';
            switchContent(getFiltered());
            renderCats();
        });

        els.themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light');
            els.themeBtn.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
        });

        els.langBtn.addEventListener('click', () => {
            lang = lang === 'en' ? 'ar' : 'en';
            els.langBtn.textContent = lang.toUpperCase();
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
            renderCats();
            switchContent(getFiltered());
        });

        // QR
        els.qrBtn.addEventListener('click', () => {
            const qr = qrcode(0, 'H');
            qr.addData(window.location.href);
            qr.make();
            const canvas = els.qrCanvas;
            canvas.width = qr.getModuleCount() * 8;
            canvas.height = qr.getModuleCount() * 8;
            const ctx = canvas.getContext('2d');
            qr.renderTo2dContext(ctx, 8);
            els.qrModal.showModal();
        });
        els.closeQrBtn.addEventListener('click', () => els.qrModal.close());

        // Swipe for categories
        let touchStartX = 0;
        els.catBar.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
        els.catBar.addEventListener('touchend', (e) => {
            if (!touchStartX) return;
            let diff = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(diff) > 50) {
                let cats = data.categories.map(c => c.id);
                let curIndex = cats.indexOf(activeCat);
                if (diff < 0 && curIndex < cats.length-1) activeCat = cats[curIndex+1];
                else if (diff > 0 && curIndex > 0) activeCat = cats[curIndex-1];
                renderCats(); switchContent(getFiltered());
            }
            touchStartX = 0;
        });

        // Magnetic hover effect on cards
        document.addEventListener('mousemove', (e) => {
            const cards = document.querySelectorAll('.menu-card');
            cards.forEach(card => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width/2;
                const y = e.clientY - rect.top - rect.height/2;
                const dist = Math.sqrt(x*x + y*y);
                if (dist < 180) {
                    const strength = Math.min(1, (180 - dist)/180) * 5;
                    card.style.transform = `translateY(-3px) scale(1.02) rotateX(${-y*0.008}deg) rotateY(${x*0.008}deg)`;
                } else {
                    card.style.transform = '';
                }
            });
        });

        // Initialize
        renderCats();
        switchContent(getFiltered());
        els.langBtn.textContent = lang.toUpperCase();
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
    })();
    </script>
</body>
</html>
