<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Turkiana Cafe & Sweets — Menu</title>
  <meta name="description" content="Complete single-file menu: bilingual (EN/AR), search, sort, tag filters, cart, keyboard accessibility, print-ready." />
  <style>
    :root{
      --bg:#07070a; --card:#0f1013; --text:#f5f5f5; --muted:#bdbdbd;
      --gold:#caa84a; --maroon:#7a1921; --glass: rgba(255,255,255,0.03);
    }
    .theme-light{ --bg:#ffffff; --card:#ffffff; --text:#111; --muted:#666; --glass: rgba(0,0,0,0.03); }
    *{box-sizing:border-box}
    html{font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,Arial; font-size:16px}
    body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
    .wrap{max-width:1200px;margin:0 auto;padding:20px}
    header{display:flex;align-items:center;justify-content:space-between;gap:12px}
    .brand h1{font-family:'Playfair Display',serif;margin:0;color:var(--gold);font-size:28px}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
    .controls{display:flex;gap:10px;align-items:center}
    .search{min-width:260px}
    .search input{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:var(--text)}
    .btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,0.06);background:var(--glass);color:var(--text);cursor:pointer;font-weight:700}
    main{display:grid;grid-template-columns:260px 1fr;gap:18px;margin-top:18px}
    nav.sidebar{background:var(--card);padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,0.04);height:calc(100vh - 150px);overflow:auto}
    .cat{padding:10px;border-radius:8px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);margin-bottom:6px}
    .cat.active{background:linear-gradient(90deg,var(--gold),var(--maroon));color:#111;font-weight:800}
    .menu-area{padding:6px}
    .category-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
    .category-header h2{margin:0;color:var(--gold);font-size:20px}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    .chip{padding:6px 10px;border-radius:999px;background:var(--glass);border:1px solid rgba(255,255,255,0.04);cursor:pointer;color:var(--muted)}
    .chip[aria-pressed="true"]{background:linear-gradient(90deg,var(--gold),var(--maroon));color:#111;font-weight:700}
    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
    .item{background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.04);display:flex;gap:12px;align-items:flex-start}
    .media{width:100px;height:86px;border-radius:8px;overflow:hidden;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));display:flex;align-items:center;justify-content:center}
    .media img{width:100%;height:100%;object-fit:cover}
    .info{flex:1}
    .title{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
    .price{font-weight:900;color:var(--gold)}
    .desc{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.3}
    .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
    .tag{font-size:12px;padding:4px 8px;border-radius:999px;background:var(--glass);color:var(--muted)}
    .actions{margin-top:10px;display:flex;gap:8px;align-items:center}
    .cart-btn{position:fixed;right:18px;bottom:18px;width:360px;max-width:92vw;background:var(--card);border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.05);box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:60}
    .cart-header{display:flex;justify-content:space-between;align-items:center}
    .cart-list{max-height:42vh;overflow:auto;margin-top:10px;padding-top:6px;border-top:1px dashed rgba(255,255,255,0.03)}
    .cart-item{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,0.03)}
    footer{margin-top:28px;padding:18px;border-top:3px solid var(--gold);color:var(--muted)}
    @media (max-width:900px){main{grid-template-columns:1fr}nav.sidebar{height:auto;order:2}.cart-btn{right:8px;left:8px;width:calc(100% - 16px)}}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
    /* focus */
    :focus{outline:3px solid rgba(202,168,74,0.35);outline-offset:2px}
    .visually-hidden{position:absolute;left:-9999px}
    /* print */
    @media print{.cart-btn,.controls,nav.sidebar{display:none} body{background:#fff;color:#000} .item{background:#fff;border:1px solid #eee;box-shadow:none}}
  </style>
</head>
<body class="theme-light">
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>Turkiana</h1>
        <p>CAFÉ & SWEETS — Where Tradition Meets Excellence</p>
      </div>

      <div class="controls" role="region" aria-label="Top controls">
        <div class="search">
          <label for="searchInput" class="sr-only">Search menu items</label>
          <input id="searchInput" placeholder="Search items (press / to focus)" type="search" aria-label="Search menu items" autocomplete="off">
        </div>

        <select id="sortBy" class="btn" aria-label="Sort menu">
          <option value="">Sort</option>
          <option value="price-asc">Price: Low → High</option>
          <option value="price-desc">Price: High → Low</option>
          <option value="name">Name A → Z</option>
        </select>

        <button id="langToggle" class="btn" aria-pressed="false" title="Toggle language">AR</button>
        <button id="themeToggle" class="btn" aria-pressed="false" title="Toggle theme">Theme</button>
        <button id="openCart" class="btn" aria-expanded="false" aria-controls="cart">Cart (<span id="cartCount">0</span>)</button>
      </div>
    </header>

    <main>
      <nav class="sidebar" id="categories" aria-label="Menu categories"></nav>

      <section class="menu-area" aria-live="polite">
        <div class="category-header">
          <h2 id="categoryTitle">Menu</h2>
          <div class="filters" id="tagFilters" role="toolbar" aria-label="Filter by tags"></div>
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div id="resultsInfo" style="color:var(--muted)">Showing all items</div>
          <div style="color:var(--muted);font-size:13px">Keyboard: "/" focus search • "c" toggle cart • "f" toggle first tag</div>
        </div>

        <div id="itemsGrid" class="items-grid" role="list"></div>
      </section>
    </main>

    <div id="cart" class="cart-btn" aria-hidden="true" hidden>
      <div class="cart-header">
        <strong>Your Cart</strong>
        <div>
          <button class="btn" id="clearCart">Clear</button>
          <button class="btn" id="closeCart">Close</button>
        </div>
      </div>
      <div id="cartBody" style="margin-top:10px;color:var(--muted)">
        <div id="cartList" class="cart-list empty" role="region" aria-live="polite">Cart is empty</div>
        <div style="margin-top:10px;display:flex;justify-content:space-between;align-items:center">
          <div><strong>Total:</strong> <span id="cartTotal">QAR 0.00</span></div>
          <button id="checkout" class="btn" disabled>Checkout</button>
        </div>
      </div>
    </div>

    <footer>
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px">
        <div>
          <strong style="color:var(--gold)">Contact</strong>
          <div style="color:var(--muted);margin-top:6px">📞 +974 7798 4617 • ✉️ info@turkianasweets.com</div>
        </div>
        <div style="text-align:right;color:var(--muted)">© 2025 Turkiana • All Branches in Qatar</div>
      </div>
    </footer>
  </div>

  <div id="liveAnnounce" class="visually-hidden" aria-live="polite" aria-atomic="true"></div>

  <script>
    // Full menu data (ready-to-use). If you need adjustments or additions, tell me and I'll update.
    const MENU = [
      { category: "Turkish Morning", arCategory: "الصباح التركي", icon: "🍳", items: [ { id: "tm1", enName: "Turkish Classic Breakfast", arName: "فطور تركي كلاسيكي", priceNum: 65, descriptionEn: "A rich and traditional Turkish spread featuring freshly baked warm bread, assorted cheeses, marinated olives, ripe tomatoes, crisp cucumbers, natural honey, and velvety clotted cream, all served with aromatic Turkish tea to create an authentic and fulfilling morning experience.", descriptionAr: "وجبة تركية أصيلة وغنية تتضمن خبزًا طازجًا ساخنًا، مجموعة من الأجبان، زيتون متبّل، طماطم ناضجة، خيار مقرمش، عسل طبيعي وقشطة ناعمة، تُقدّم مع شاي تركي عطري لتجربة صباح كاملة ومتوازنة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Breakfast.jpg", calories: "680 kcal", dietary: ["vegetarian","contains-dairy"], popular: true }, { id: "tm2", enName: "Turkish Menemen", arName: "مينمن تركي", priceNum: 45, descriptionEn: "A comforting Turkish classic made with softly scrambled eggs cooked gently with juicy tomatoes, tender green peppers, and fragrant spices, creating a warm, homestyle dish full of rich and savory flavors.", descriptionAr: "طبق تركي مميز من البيض المخفوق المطهو برفق مع طماطم عصيرية، فلفل أخضر طري وتوابل عطرية، ليقدم نكهة منزلية دافئة مليئة بالغنى والطعم التقليدي.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Menemen.jpg", calories: "360 kcal", dietary: ["gluten-free","contains-dairy"] }, { id: "tm3", enName: "Plain Omelette", arName: "أومليت عادي", priceNum: 25, descriptionEn: "A light and tender omelette cooked to a delicate golden finish, offering natural egg richness with a soft, airy texture that makes every bite simple yet deeply satisfying.", descriptionAr: "أومليت خفيف وطري يُطهى حتى يصل إلى لون ذهبي ناعم، يتميز بنكهة البيض الطبيعية وقوام هش يمنحك وجبة بسيطة لكنها مليئة بالرضا.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Omellet.jpg", calories: "220 kcal", dietary: ["gluten-free","contains-dairy"] } ]}, { category: "Croissant Creations", arCategory: "إبداعات الكرواسون", icon: "🥐", items: [ { id: "cc1", enName: "Croissant Beef Ribs", arName: "كرواسون أضلاع اللحم", priceNum: 45, descriptionEn: "A golden, flaky croissant generously filled with tender slow-cooked beef ribs, melted cheddar, and kasfar cheese, finished with a fresh layer of aromatic pesto for a rich and deeply satisfying flavor.", descriptionAr: "كرواسون ذهبي هش محشو بأضلاع لحم مطهوة ببطء لتصبح طرية وغنية، مع جبن شيدر وكاسفار مذابَين، ويُختتم بطبقة من البيستو العطري لنكهة فاخرة ومشبعة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Ribs.jpg", calories: "720 kcal", dietary: [] }, { id: "cc2", enName: "Avocado Croissant", arName: "كرواسون الأفوكادو", priceNum: 42, descriptionEn: "A buttery, crisp croissant layered with creamy fresh avocado and soft scrambled eggs, creating a smooth and comforting blend of flavors perfect for a balanced morning bite.", descriptionAr: "كرواسون زبدي مقرمش محشو بأفوكادو طازج كريمي وبيض مخفوق طري، ليمنح مزيجًا ناعمًا ومتناسقًا يناسب وجبة صباحية متوازنة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Avocado.jpg", calories: "610 kcal", dietary: ["vegetarian"] }, { id: "cc3", enName: "Smoked Beef Croissant", arName: "كرواسون لحم مدخن", priceNum: 45, descriptionEn: "Freshly baked croissant filled with delicate scrambled eggs and slices of flavorful smoked beef, blending smoky richness with buttery pastry in every bite.", descriptionAr: "كرواسون طازج محشو ببيض مخفوق ناعم وشرائح من اللحم المدخن الغني بالنكهة، لمزيج يجمع بين القوام الهش والطعم الدخاني الفاخر.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/5.jpg", calories: "630 kcal", dietary: [] }, { id: "cc4", enName: "Butter & Jam Croissant", arName: "كرواسون زبدة ومربى", priceNum: 40, descriptionEn: "A warm, buttery croissant served with cherry jam, roasted olives, and creamy feta, offering a sweet-and-savory pairing that elevates a classic favorite.", descriptionAr: "كرواسون زبدي دافئ يُقدّم مع مربى الكرز والزيتون المشوي وجبن الفيتا الكريمي، ليجمع بين النكهات الحلوة والمالحة في توازن مميز.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/4.jpg", calories: "540 kcal", dietary: ["vegetarian"] }, { id: "cc5", enName: "Croissant Scrambled Eggs", arName: "كرواسون بالبيض المخفوق", priceNum: 37, descriptionEn: "A light, flaky croissant generously filled with soft scrambled eggs and fresh arugula, creating a warm, airy, and refreshing breakfast bite.", descriptionAr: "كرواسون هش محشو ببيض مخفوق طري وأوراق الجرجير الطازجة، ليمنحك وجبة صباحية دافئة ومنعشة في كل لقمة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/1.jpg", calories: "520 kcal", dietary: ["vegetarian"] }, { id: "cc6", enName: "Plain Butter Croissant", arName: "كرواسون زبدة", priceNum: 20, descriptionEn: "A freshly baked classic butter croissant with a crisp exterior and soft, airy layers, offering simple pleasure in its purest form.", descriptionAr: "كرواسون زبدة طازج بقوام هش من الخارج وطبقات هوائية ناعمة من الداخل، يقدم متعة بسيطة بطعمها الأصلي.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Plain.webp", calories: "320 kcal", dietary: ["vegetarian"] }, { id: "cc7", enName: "Cheese Butter Croissant", arName: "كرواسون زبدة بالجبنة", priceNum: 20, descriptionEn: "A buttery croissant filled with melted cheese, offering a warm, savory bite wrapped in delicate pastry layers.", descriptionAr: "كرواسون زبدة محشو بجبنة مذابة تمنحك طعمًا مالحًا ودافئًا داخل طبقات العجين الهشة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Cheese.jpg", calories: "360 kcal", dietary: ["vegetarian"] }, { id: "cc8", enName: "Chocolate Butter Croissant", arName: "كرواسون زبدة بالشوكولاتة", priceNum: 20, descriptionEn: "A light and flaky butter croissant filled with smooth, rich chocolate for a delightful sweet treat.", descriptionAr: "كرواسون زبدة هش محشو بشوكولاتة ناعمة وغنية ليقدم نكهة حلوة ولذيذة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Chocolatecroissant.jpg", calories: "380 kcal", dietary: ["vegetarian"] }, { id: "cc9", enName: "Almond Butter Croissant", arName: "كرواسون زبدة باللوز", priceNum: 20, descriptionEn: "A tender butter croissant topped with roasted almonds, adding a nutty aroma and a pleasant crunch to each bite.", descriptionAr: "كرواسون زبدة طري مغطى باللوز المحمص لإضافة رائحة مكسرات غنية وقرمشة لطيفة في كل لقمة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Almondcroissant.jpg", calories: "400 kcal", dietary: ["vegetarian"] }, { id: "cc10", enName: "Cinnamon Danish", arName: "دانش بالقرفة", priceNum: 20, descriptionEn: "A soft, sweet Danish pastry swirled with warm cinnamon for a fragrant and comforting flavor.", descriptionAr: "دانش طري محشو بنكهات القرفة الدافئة ليمنح رائحة عطرية وطعمًا مريحًا.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Cinnamon.jpg", calories: "390 kcal", dietary: ["vegetarian"] }, { id: "cc11", enName: "Danish Shell", arName: "دانش شِل", priceNum: 20, descriptionEn: "A classic shell-shaped Danish pastry with a light, golden texture that highlights simple sweetness.", descriptionAr: "دانش كلاسيكي بشكل صدفة بقوام ذهبي خفيف يبرز نكهة الحلاوة البسيطة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Danish.jpg", calories: "380 kcal", dietary: ["vegetarian"] }, { id: "cc12", enName: "Raisins Danish", arName: "دانش بالزبيب", priceNum: 20, descriptionEn: "A soft Danish pastry filled with sweet raisins, adding a chewy texture and naturally fruity flavor.", descriptionAr: "دانش طري محشو بالزبيب الحلو ليمنحك قوامًا مطاطيًا خفيفًا ونكهة فاكهية طبيعية.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Raisin.jpg", calories: "390 kcal", dietary: ["vegetarian"] } ]}, { category: "From the Grill & Garden", arCategory: "من الشواية والحديقة", icon: "🍔", items: [ { id: "gg1", enName: "Turkiana Beef Burger", arName: "برجر تركيانا", priceNum: 69, descriptionEn: "A handcrafted premium beef patty grilled to perfection, layered with fresh toppings and signature sauce, served with a generous portion of crispy golden fries for a rich and satisfying meal.", descriptionAr: "برجر لحم بقري فاخر مشوي بإتقان ومزين بخضار طازجة وصوص مميز، يُقدّم مع كمية سخية من البطاطس الذهبية المقرمشة لوجبة مشبعة وغنية بالنكهات.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Burger.jpeg", calories: "950 kcal", dietary: [] }, { id: "gg2", enName: "Turkiana Chicken Burger", arName: "برجر دجاج", priceNum: 59, descriptionEn: "A juicy, well-seasoned chicken fillet served inside a soft bun with fresh toppings and house sauce, paired with crispy fries for a balanced and flavorful bite.", descriptionAr: "قطعة دجاج متبّلة بعناية وشويها بعصارة، تُقدّم داخل خبز طري مع خضار طازجة وصوص خاص، وتأتي مع بطاطس مقرمشة لوجبة لذيذة ومتكاملة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Burgerchicken.jpg", calories: "850 kcal", dietary: [] }, { id: "gg3", enName: "Fried Potatoes", arName: "بطاطس مقلية", priceNum: 25, descriptionEn: "Perfectly fried golden potatoes with a crisp exterior and a soft, fluffy center, offering a simple yet irresistible side enjoyed by everyone.", descriptionAr: "بطاطس مقلية ذهبية بقوام مقرمش من الخارج وطري من الداخل، تُقدّم كطبق جانبي بسيط لكنه محبّب لدى الجميع.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Patatas.jpg", calories: "340 kcal", dietary: ["vegan","gluten-free"] }, { id: "gg4", enName: "Caesar Salad", arName: "سلطة سيزر", priceNum: 47, descriptionEn: "Crisp romaine lettuce tossed in creamy Caesar dressing, topped with crunchy croutons and parmesan for a fresh, classic, and satisfying salad.", descriptionAr: "خس روماني مقرمش يُمزج مع صوص السيزر الكريمي ويُزين بقطع الخبز المحمص وجبن البارميزان، لسلطة كلاسيكية منعشة ومشبعة.", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Caesar.jpeg", calories: "420 kcal", dietary: ["contains-gluten","contains-dairy"] } ]}, { category: "Baklava & Beyond", arCatego l)", arName: "مياه عادية (صغير)", priceNum: 11, descriptionEn: "Small bottle of still water", descriptionAr: "زجاجة مياه صغيرة", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/WaterBig.jpg", calories: "0 kcal", dietary: ["vegan","dairy-free"] }, { id: "rf2", enName: "Still Water (Big)", arName: "مياه عادية (كبير)", priceNum: 21, descriptionEn: "Large bottle of still water", descriptionAr: "زجاجة مياه كبيرة", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Watersmall.jpg", calories: "0 kcal", dietary: ["vegan","dairy-free"] }, { id: "rf3", enName: "Sparkling Water", arName: "مياه غازية", priceNum: 21, descriptionEn: "Refreshing sparkling water", descriptionAr: "مياه غازية منعشة", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Sparkling.jpg", calories: "0 kcal", dietary: ["vegan","dairy-free"] }, { id: "rf4", enName: "Kinza Cola", arName: "كينزا كولا", priceNum: 17, descriptionEn: "Classic Kinza Cola", descriptionAr: "مشروب كينزا كولا الكلاسيكي", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Cola.jpg", calories: "150 kcal", dietary: [] }, { id: "rf5", enName: "Kinza Cola Zero", arName: "كينزا كولا زيرو", priceNum: 17, descriptionEn: "Kinza Cola Zero, sugar-free", descriptionAr: "كينزا كولا زيرو خالية من السكر", image: "https://turkianacafe-ux.github.io/Turkiana-Cafe-Sweets/Zero.jpg", calories: "0 kcal", dietary: [] } ]} ];

    // ---- State & elements
    const categoriesEl = document.getElementById('categories');
    const itemsGrid = document.getElementById('itemsGrid');
    const categoryTitle = document.getElementById('categoryTitle');
    const searchInput = document.getElementById('searchInput');
    const sortBy = document.getElementById('sortBy');
    const tagFilters = document.getElementById('tagFilters');
    const langToggle = document.getElementById('langToggle');
    const themeToggle = document.getElementById('themeToggle');
    const openCart = document.getElementById('openCart');
    const cartEl = document.getElementById('cart');
    const cartList = document.getElementById('cartList');
    const cartTotal = document.getElementById('cartTotal');
    const cartCount = document.getElementById('cartCount');
    const checkoutBtn = document.getElementById('checkout');
    const clearCartBtn = document.getElementById('clearCart');
    const closeCartBtn = document.getElementById('closeCart');
    const liveAnnounce = document.getElementById('liveAnnounce');
    const resultsInfo = document.getElementById('resultsInfo');

    let activeCat = 0;
    let visibleItems = [];
    let selectedTags = new Set();
    let isArabic = false;
    let cart = loadCart();

    // ---- Utilities
    function announce(text){ liveAnnounce.textContent = text; }
    function formatQAR(n){ return 'QAR ' + Number(n || 0).toFixed(2); }
    function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function truncate(s,l=150){ if(!s) return ''; return s.length>l ? s.slice(0,l-1)+'…' : s; }

    function collectTags(){
      const set = new Set();
      MENU.forEach(cat => (cat.items||[]).forEach(it => (it.dietary||[]).forEach(t=>set.add(t))));
      return Array.from(set).sort();
    }

    // ---- Render categories
    function renderCategories(){
      categoriesEl.innerHTML = '';
      MENU.forEach((cat, idx) => {
        const div = document.createElement('div');
        div.className = 'cat' + (idx===activeCat ? ' active' : '');
        div.tabIndex = 0;
        div.setAttribute('role','button');
        div.setAttribute('aria-pressed', idx===activeCat ? 'true' : 'false');
        const label = isArabic ? (cat.arCategory || cat.category) : cat.category;
        div.innerHTML = `<span aria-hidden="true">${cat.icon||''}</span><span>${label}</span>`;
        div.addEventListener('click', ()=> selectCategory(idx));
        div.addEventListener('keydown', (e)=> { if(e.key==='Enter') selectCategory(idx); });
        categoriesEl.appendChild(div);
      });
    }

    function selectCategory(i){
      activeCat = i;
      renderCategories();
      applyFiltersSort();
      renderItems(visibleItems);
      announce((isArabic ? MENU[i].arCategory : MENU[i].category) + ' selected');
    }

    // ---- Tag filters
    function renderTagFilters(){
      tagFilters.innerHTML = '';
      const tags = collectTags();
      if(!tags.length) return;
      tags.forEach(t=>{
        const btn = document.createElement('button');
        btn.className = 'chip';
        btn.type = 'button';
        btn.textContent = t.replace(/-/g,' ');
        btn.dataset.tag = t;
        btn.setAttribute('aria-pressed', selectedTags.has(t) ? 'true' : 'false');
        btn.addEventListener('click', ()=>{
          if(selectedTags.has(t)) selectedTags.delete(t); else selectedTags.add(t);
          btn.setAttribute('aria-pressed', selectedTags.has(t));
          applyFiltersSort();
          renderItems(visibleItems);
          announce(selectedTags.has(t) ? `${t} filter applied` : `${t} filter removed`);
        });
        btn.addEventListener('keydown', (e)=> { if(e.key==='Enter' || e.key===' ') { e.preventDefault(); btn.click(); } });
        tagFilters.appendChild(btn);
      });
    }

    // ---- Items rendering
    function createItemCard(it){
      const item = document.createElement('article');
      item.className = 'item';
      item.tabIndex = 0;
      const title = isArabic ? (it.arName || it.enName) : (it.enName || it.arName);
      const desc = isArabic ? (it.descriptionAr || it.descriptionEn) : (it.descriptionEn || it.descriptionAr);
      const img = it.image ? `<div class="media" aria-hidden="true"><img loading="lazy" src="${it.image}" alt="${escapeHtml(title)}"></div>` : `<div class="media" aria-hidden="true" style="display:flex;align-items:center;justify-content:center;color:var(--muted)">No image</div>`;
      const dietaryTags = (it.dietary||[]).map(d=>`<span class="tag">${escapeHtml(d)}</span>`).join('') || '<span class="tag">—</span>';
      const popular = it.popular ? `<span class="tag">Popular</span>` : '';
      item.innerHTML = `
        ${img}
        <div class="info">
          <div class="title"><h3 style="margin:0">${escapeHtml(title)}</h3><div class="price">${formatQAR(it.priceNum)}</div></div>
          <div class="desc">${escapeHtml(truncate(desc,140))}</div>
          <div class="tags">${popular}${dietaryTags}</div>
          <div class="actions">
            <button class="btn add" data-id="${it.id}" data-price="${Number(it.priceNum||0)}">Add</button>
            <div style="margin-left:auto;color:var(--muted);font-size:12px">${it.calories || ''}</div>
          </div>
        </div>
      `;
      return item;
    }

    function renderItems(list){
      itemsGrid.innerHTML = '';
      if(!list || !list.length){
        itemsGrid.innerHTML = `<div style="color:var(--muted)">No items found</div>`;
        resultsInfo.textContent = 'No results';
        visibleItems = [];
        return;
      }
      list.forEach(it => itemsGrid.appendChild(createItemCard(it)));
      // attach add handlers
      itemsGrid.querySelectorAll('.add').forEach(btn => btn.addEventListener('click', e=>{
        addToCart(e.currentTarget.dataset.id, Number(e.currentTarget.dataset.price||0));
      }));
      // keyboard support: Enter on item triggers Add
      itemsGrid.querySelectorAll('.item').forEach(card=>{
        card.addEventListener('keydown', (e)=> { if(e.key==='Enter'){ const btn = card.querySelector('.add'); if(btn) btn.click(); } });
      });
      resultsInfo.textContent = `Showing ${list.length} item${list.length>1 ? 's' : ''}`;
    }

    // ---- Search, sort, tag pipeline
    function applyFiltersSort(){
      const q = (searchInput.value||'').trim().toLowerCase();
      const base = (MENU[activeCat] && MENU[activeCat].items) || [];
      let filtered = base.filter(it=>{
        if(selectedTags.size){
          const ok = Array.from(selectedTags).every(t => (it.dietary||[]).includes(t));
          if(!ok) return false;
        }
        if(!q) return true;
        const en = (it.enName||'').toLowerCase();
        const ar = (it.arName||'').toLowerCase();
        const de = (it.descriptionEn||'').toLowerCase();
        return en.includes(q) || ar.includes(q) || de.includes(q);
      });

      const val = sortBy.value;
      if(val === 'price-asc') filtered.sort((a,b)=> (a.priceNum||0)-(b.priceNum||0));
      else if(val === 'price-desc') filtered.sort((a,b)=> (b.priceNum||0)-(a.priceNum||0));
      else if(val === 'name') filtered.sort((a,b)=> ((a.enName||'').localeCompare(b.enName||'')));

      visibleItems = filtered;
    }

    // ---- Search debounce
    let debounceTimer = null;
    searchInput.addEventListener('input', ()=> {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(()=> { applyFiltersSort(); renderItems(visibleItems); }, 160);
    });

    sortBy.addEventListener('change', ()=> { applyFiltersSort(); renderItems(visibleItems); announce('Sort changed'); });

    // ---- Language toggle
    langToggle.addEventListener('click', ()=>{
      isArabic = !isArabic;
      document.body.classList.toggle('rtl', isArabic);
      langToggle.setAttribute('aria-pressed', String(isArabic));
      langToggle.textContent = isArabic ? 'EN' : 'AR';
      renderAll();
      announce(isArabic ? 'Arabic' : 'English');
    });

    // ---- Theme toggle
    themeToggle.addEventListener('click', ()=>{
      document.body.classList.toggle('theme-light');
      const pressed = document.body.classList.contains('theme-light');
      themeToggle.setAttribute('aria-pressed', String(pressed));
      announce(pressed ? 'Light theme' : 'Dark theme');
    });

    // ---- Cart (client-side)
    function loadCart(){ try{ return JSON.parse(localStorage.getItem('turkiana_cart')) || {}; }catch(e){ return {}; } }
    function saveCart(){ try{ localStorage.setItem('turkiana_cart', JSON.stringify(cart)); }catch(e){} }
    function addToCart(id, price){
      cart[id] = (cart[id] || 0) + 1;
      saveCart();
      renderCart();
      announce(getItemName(id) + ' added to cart');
    }
    function removeFromCart(id){ if(cart[id]) delete cart[id]; saveCart(); renderCart(); announce('Item removed'); }
    function changeQty(id, delta){ cart[id] = (cart[id] || 0) + delta; if(cart[id] <= 0) delete cart[id]; saveCart(); renderCart(); }
    function getItemName(id){
      const flat = MENU.flatMap(c=>c.items||[]);
      const it = flat.find(x=>x.id===id);
      return isArabic ? (it && (it.arName||it.enName)) : (it && (it.enName||it.arName)) || id;
    }
    function cartItemsDetailed(){
      const flat = MENU.flatMap(c=>c.items||[]);
      return Object.keys(cart).map(id => ({ id, qty: cart[id], item: flat.find(x=>x.id===id) || { enName: id, priceNum: 0 } }));
    }
    function renderCart(){
      const items = cartItemsDetailed();
      const count = items.reduce((s,i)=>s+i.qty,0);
      cartCount.textContent = count;
      if(!items.length){
        cartList.innerHTML = 'Cart is empty'; cartList.classList.add('empty'); cartTotal.textContent = formatQAR(0); checkoutBtn.disabled = true; return;
      }
      cartList.classList.remove('empty'); cartList.innerHTML = '';
      let total = 0;
      items.forEach(({id,qty,item})=>{
        const price = Number(item.priceNum||0);
        total += price * qty;
        const div = document.createElement('div');
        div.className = 'cart-item';
        div.innerHTML = `
          <div>
            <div style="font-size:13px">${escapeHtml(isArabic ? (item.arName||item.enName) : (item.enName||item.arName))}</div>
            <div style="font-size:12px;color:var(--muted)">${formatQAR(price)} × ${qty} = <strong>${formatQAR(price*qty)}</strong></div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
            <div>
              <button class="btn decrease" data-id="${id}" aria-label="Decrease quantity">−</button>
              <button class="btn increase" data-id="${id}" aria-label="Increase quantity">+</button>
            </div>
            <button class="btn remove" data-id="${id}">Remove</button>
          </div>
        `;
        cartList.appendChild(div);
      });
      cartTotal.textContent = formatQAR(total);
      checkoutBtn.disabled = false;
      cartList.querySelectorAll('.increase').forEach(b=>b.addEventListener('click', e=> changeQty(e.currentTarget.dataset.id,1)));
      cartList.querySelectorAll('.decrease').forEach(b=>b.addEventListener('click', e=> changeQty(e.currentTarget.dataset.id,-1)));
      cartList.querySelectorAll('.remove').forEach(b=>b.addEventListener('click', e=> removeFromCart(e.currentTarget.dataset.id)));
    }

    openCart.addEventListener('click', ()=> {
      const open = cartEl.hidden;
      cartEl.hidden = !open;
      cartEl.setAttribute('aria-hidden', String(!open));
      openCart.setAttribute('aria-expanded', String(open));
      if(open){ renderCart(); cartEl.querySelector('#checkout')?.focus(); }
    });
    closeCartBtn.addEventListener('click', ()=> { cartEl.hidden = true; cartEl.setAttribute('aria-hidden','true'); openCart.setAttribute('aria-expanded','false'); openCart.focus(); });
    clearCartBtn.addEventListener('click', ()=> { cart = {}; saveCart(); renderCart(); announce('Cart cleared'); });

    checkoutBtn.addEventListener('click', ()=>{
      const items = cartItemsDetailed();
      if(!items.length) return;
      if(confirm(`Proceed to checkout with ${items.reduce((s,i)=>s+i.qty,0)} items totaling ${cartTotal.textContent}?`)){
        // Placeholder: integrate with backend checkout
        cart = {}; saveCart(); renderCart(); announce('Checkout complete. Thank you!');
        alert('Checkout simulated — integrate with payment backend for real orders.');
      }
    });

    // ---- Keyboard shortcuts & accessibility
    window.addEventListener('keydown', (e)=>{
      const active = document.activeElement;
      const inInput = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable);
      if(e.key === '/' && !inInput){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
      if((e.key === 'c' || e.key === 'C') && !inInput){ e.preventDefault(); openCart.click(); }
      if((e.key === 'f' || e.key === 'F') && !inInput){ e.preventDefault(); const first = collectTags()[0]; if(first){ const btn = [...tagFilters.querySelectorAll('.chip')].find(b=>b.dataset.tag===first); if(btn){ btn.click(); btn.focus(); } } }
      if(e.key === 'Escape'){ if(!cartEl.hidden){ cartEl.hidden = true; cartEl.setAttribute('aria-hidden','true'); openCart.setAttribute('aria-expanded','false'); openCart.focus(); } }
    });

    // focus trap (simple) when cart open
    document.addEventListener('focusin', (e)=> {
      if(!cartEl.hidden && !cartEl.contains(e.target) && e.target !== openCart){
        const focusables = cartEl.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
        if(focusables.length) focusables[0].focus();
      }
    });

    // ---- Init & helpers
    function init(){
      renderCategories();
      renderTagFilters();
      applyFiltersSort();
      renderItems(visibleItems);
      renderCart();
    }

    function renderAll(){
      renderCategories();
      renderTagFilters();
      applyFiltersSort();
      renderItems(visibleItems);
      renderCart();
    }

    // initial defaults
    visibleItems = (MENU[0] && MENU[0].items) ? MENU[0].items.slice() : [];
    cart = loadCart();

    // attach search debounced behavior already done above; attach add handlers after initial render
    init();

    // Expose for debugging
    window.TURKIANA = { MENU, addToCart, cart };

  </script>
</body>
</html>
