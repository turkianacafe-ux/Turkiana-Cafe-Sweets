  #marquee {
    width: 100%; overflow: hidden; border-radius: 18px;
    box-shadow: 0 0 35px var(--shadow-glass), inset 0 0 40px var(--glass-frost);

    margin: 30px auto 20px; max-width: 1200px; padding: 8px 0; position: relative;
  }
  #marquee-content, #marquee-content-duplicate {
    display: flex; width: max-content; animation: marqueeAnim 40s linear infinite;
  }
  #marquee-content-duplicate {
    position: absolute; top: 0; left: 100%; pointer-events: none; user-select: none;
  }
  #marquee-content img, #marquee-content-duplicate img {
    height: 120px; margin: 0 18px; object-fit: cover; border-radius: 14px;
    box-shadow: 0 0 12px var(--gold); user-select: none; pointer-events: none;
  }
  @keyframes marqueeAnim {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  
  /* Landing */
  #landing {
    height: 100vh; display: flex; flex-direction: column; align-items: center;

    backdrop-filter: blur(12px); border: 1px solid var(--glass-border);

  .logo {
    font-family: 'Playfair Display', serif; font-size: 5rem; letter-spacing: 0.25rem;

    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 3s linear infinite; user-select: none;
  }
  @keyframes shimmer {
    0% { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  .subtitle {
    margin-top: 0.6rem; font-weight: 500; font-size: 1.4rem; color: #f5e6d3cc;
  }
  .enter-btn, #langSwitch {
    margin-top: 1.8rem; padding: 1rem 2.5rem; border-radius: 999px;
    border: 2px solid var(--gold); background: transparent; color: var(--gold);
    cursor: pointer; font-weight: 700; font-size: 1.1rem; transition: all 0.3s ease;
    backdrop-filter: blur(12px); box-shadow: 0 0 12px var(--gold); user-select: none;
  }
  .enter-btn:hover, #langSwitch:hover {
    background: var(--gold); color: var(--maroon);
    box-shadow: 0 0 12px var(--gold), 0 15px 35px var(--gold);
    transform: translateY(-8px);
  }
  
  /* Category Cards with waving gradient animation */
  .cat-card {
    position: relative; background: var(--glass-bg); border-radius: 30px;
    padding: 36px 20px; color: var(--gold); text-align: center;
    cursor: pointer; box-shadow: 0 6px 30px var(--shadow-glass), inset 0 0 40px var(--glass-frost);
    border: 1.2px solid var(--glass-border); transition: transform 0.32s ease, box-shadow 0.32s ease;
    user-select: none; overflow: hidden;
  }
  .cat-card::before {
    content: "";
    position: absolute; top: -70%; left: -50%;
    width: 200%; height: 250%; border-radius: 30px;
    background: linear-gradient(270deg, var(--gold), var(--maroon), var(--gold));
    background-size: 600% 600%;
    filter: blur(12px);
    animation: gradientWave 15s ease infinite;
    opacity: 0.4; z-index: -1;
  }
  @keyframes gradientWave {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .cat-card.baklava::before {
    opacity: 0.5;
  }
  .cat-card:hover {
    transform: translateY(-9px) scale(1.05);
    box-shadow: 0 16px 50px var(--gold), inset 0 0 65px var(--gold);
    border-color: var(--gold);
  }
  .cat-title { font-family: 'Playfair Display', serif; font-size: 2rem; font-weight: 600; margin-bottom: 8px; user-select: none; }
  .cat-count { font-size: 1.15rem; font-weight: 500; color: var(--muted); }
  
  /* Solo category page with smooth 1.5s fade in/out */
  #cat-page {
    display: none; position: fixed; inset: 30px 30px 110px;
    z-index: 2200; background: var(--glass-bg); backdrop-filter: blur(22px);
    border-radius: 40px; padding: 48px 48px 56px; overflow-y: auto;
    box-shadow: 0 25px 80px var(--shadow-glass), inset 0 0 80px var(--glass-frost);
    border: 1.3px solid var(--glass-border); color: var(--gold);
    opacity: 0; transition: opacity 1.5s ease; user-select: none;
  }
  #cat-page.show { display: flex; flex-direction: column; align-items: center; opacity: 1; }
  #cat-back {
    margin-bottom: 22px; color: var(--gold); background: transparent; border: 2.5px solid var(--gold);

    width: 100%; max-width: 1120px;

  .card {
    background: var(--glass-bg); border-radius: 24px; padding: 22px 20px;

    "Turkish Morning","Croissant Creations","From the Grill & Garden","Baklava & Beyond",
    "Arabian Brew","Tea Time","Tea on Ice","Brewed the Turkish Way","Herbal Infusions",
    "Café & Chill","Specialty Brews","Froozen","Refreshments"
  ];
  const catArMap = {
    "Turkish Morning":"الإفطار التركي",
    "Croissant Creations":"إبداعات الكرواسان",
    "From the Grill & Garden":"من الشواية والحديقة",
    "Baklava & Beyond":"البقلاوة وأكثر",
    "Arabian Brew":"مشروبات عربية",
    "Tea Time":"وقت الشاي",
    "Tea on Ice":"الشاي المثلج",
    "Brewed the Turkish Way":"القهوة التركية",
    "Herbal Infusions":"المشروبات العشبية",
    "Café & Chill":"كافيه ومشروبات",
    "Specialty Brews":"مشروبات متخصصة",
    "Froozen":"المشروبات المثلجة",
    "Refreshments":"المرطبات"
  };

  const imagesList = [
    "Breakfast.jpg","Menemen.jpg","Omellet.jpg","Ribs.jpg","Avocado.jpg",
    "5.jpg","4.jpg","1.jpg","Patatas.jpg","Caesar.jpg","Burger.jpg",
    "Mix.jpg","Slice.jpg","Nuts.jpg","Snicker.jpg","Kunafa.jpg",
    "Chocolate.jpg","Lutos.jpg","Full.jpg","Lemon.jpg","Tiramisu.jpg",
    "Almond.jpg","Lemoncake.jpg","Cherry.jpg","Mulberry.jpg",
    "Chocolate_pistachio.jpg","Strawberry.jpg","White.jpg","Trileche.jpg","Sebastian.jpg"
  ];

  let currentLang = "en";

  function shuffle(array) {
    let i = array.length;
    while(i > 0) {
      const j = Math.floor(Math.random() * i);
      i--;
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function initMarquee() {
    const parent1 = document.getElementById("marquee-content");
    const parent2 = document.getElementById("marquee-content-duplicate");
    parent1.innerHTML = "";
    parent2.innerHTML = "";
    let shuffledImgs = [...imagesList];
    shuffle(shuffledImgs);
    shuffledImgs.forEach(img => {
      const imgEl = document.createElement("img");
      imgEl.src = img;
      imgEl.alt = "Menu image";
      parent1.appendChild(imgEl);
    });
    shuffledImgs.forEach(img => {
      const imgEl = document.createElement("img");
      imgEl.src = img;
      imgEl.alt = "Menu image";
      parent2.appendChild(imgEl);
    });
  }

  function setDirByLang(lang) {
    document.body.setAttribute('dir', lang === "ar" ? "rtl" : "ltr");
    document.body.setAttribute('lang', lang === "ar" ? "ar" : "en");
  }

  function renderCatList() {
    setDirByLang(currentLang);
    const isAr = currentLang === "ar";
    document.getElementById("subtitleTxt").innerText = isAr ? "كافيه وحلويات تركيانا — حيث يلتقي التراث بالأناقة" : "CAFÉ & SWEETS — Where Heritage Meets Elegance";
    document.getElementById("enterBtn").innerText = isAr ? "تصفح قائمتنا" : "Explore Our Menu";
    document.getElementById("langSwitch").innerText = isAr ? "English" : "العربية";
    document.getElementById("cat-page").classList.remove("show");
    document.getElementById("cat-page").style.opacity = 0;
    document.getElementById("menu").style.display = "block";
    const menuData = isAr ? menuAr : menuEn;
    const menuCatList = document.getElementById("menuCatList");
    menuCatList.innerHTML = "";
    menuOrder.forEach(cat => {
      const items = menuData[cat];
      if(items && items.length) {
        const card = document.createElement("div");
        card.className = "cat-card";
        card.innerHTML = `
          <div class="cat-title">${isAr ? catArMap[cat] : cat}</div>
          <div class="cat-count">${isAr ? `${items.length} عنصر` : items.length + " items"}</div>
        `;
        card.addEventListener("click", () => showSoloCat(cat));
        menuCatList.appendChild(card);
      }
    });
  }

  function showSoloCat(category) {
    document.getElementById("menu").style.opacity = 0;
    setTimeout(() => {
      document.getElementById("menu").style.display = "none";
      renderSoloCat(category);
      const catPage = document.getElementById("cat-page");
      catPage.style.transition = "opacity 1.5s ease";
      catPage.classList.add("show");
      setTimeout(() => { catPage.style.opacity = 1; }, 50);
    }, 1200);
  }

  function getMenuData() { return currentLang === "ar" ? menuAr : menuEn; }

  function renderSoloCat(category) {
    const isAr = currentLang === "ar";
    document.getElementById("catTitleSolo").innerText = isAr ? catArMap[category] : category;
    const items = getMenuData()[category] || [];
    const itemsDiv = document.getElementById("catItems");
    itemsDiv.innerHTML = "";
    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <img src="${item.image}" alt="${item.name}">
        <div class="item-name">${item.name}</div>
        <div class="item-desc">${item.description}</div>
        <div class="item-price">${item.price}</div>
        ${item.allergens.length ? `<div class="allergens">${isAr ? "مسببات الحساسية: " : "Allergens: "}${item.allergens.join(", ")}</div>` : ""}
      `;
      card.addEventListener("click", () => openItemModal(item.image, item.name));
      itemsDiv.appendChild(card);
    });
  }

  document.getElementById("cat-back").addEventListener("click", () => {
    const catPage = document.getElementById("cat-page");
    catPage.style.transition = "opacity 1.5s ease";
    catPage.style.opacity = 0;
    setTimeout(() => {
      catPage.classList.remove("show");
      document.getElementById("menu").style.display = "block";
      document.getElementById("menu").style.opacity = 1;
    }, 1500);
  });

  document.getElementById("enterBtn").addEventListener("click", () => {
    document.getElementById("landing").style.transition = "opacity 900ms cubic-bezier(.16,1,.3,1)";
    document.getElementById("landing").style.opacity = 0;
    setTimeout(() => {
      document.getElementById("landing").style.display = "none";
      document.getElementById("menu").style.display = "block";
      document.getElementById("menu").style.opacity = 0;
      document.getElementById("menu").style.transition = "opacity 900ms cubic-bezier(.16,1,.3,1)";
      setTimeout(() => {
        document.getElementById("menu").style.opacity = 1;
        initMarquee();
      }, 40);
      document.getElementById("menu").setAttribute("aria-hidden", "false");
      window.scrollTo({ top: 0, behavior: "smooth" });
      renderCatList();
    }, 420);
  });

  document.getElementById("langSwitch").addEventListener("click", () => {
    currentLang = currentLang === "en" ? "ar" : "en";
    if (document.getElementById("menu").style.display !== "none") renderCatList();
    else if (document.getElementById("cat-page").classList.contains("show")) {
      let catName = document.getElementById("catTitleSolo").innerText;
      let catKey = currentLang === "ar" ? Object.keys(catArMap).find(k => catArMap[k] === catName) : catName;
      renderSoloCat(catKey || menuOrder[0]);
    }
  });

  document.getElementById("copyWifiBtn").addEventListener("click", async () => {
    const ssid = document.getElementById("wifi-ssid").textContent.trim();
    const pass = document.getElementById("wifi-pass").textContent.trim();
    const text = `SSID: ${ssid}\nPassword: ${pass}`;
    try {
      await navigator.clipboard.writeText(text);
      alert(currentLang === "ar" ? "تم نسخ بيانات الواي فاي" : "Wi-Fi details copied!");
    } catch {
      alert(currentLang === "ar" ? "فشل النسخ، الرجاء النسخ يدوياً" : "Copy failed, please copy manually.");
    }
  });

  function openItemModal(imageSrc, altText) {
    const modal = document.getElementById("itemModal");
    const modalImg = document.getElementById("modalImg");
    modalImg.src = imageSrc;
    modalImg.alt = altText;
    modal.classList.add("show");
  }
  document.getElementById("modalCloseBtn").addEventListener("click", () => {
    const modal = document.getElementById("itemModal");
    modal.classList.remove("show");
  });
  document.getElementById("itemModal").addEventListener("click", (e) => {
    if (e.target === e.currentTarget) {
      e.currentTarget.classList.remove("show");
    }
  });

  window.addEventListener("load", () => {
    initMarquee();
  });
</script>

<!-- Item Image Modal -->
<div id="itemModal" role="dialog" aria-modal="true" aria-label="Menu item image display">
  <button class="close-btn" id="modalCloseBtn" aria-label="Close">&times;</button>
  <img id="modalImg" src="" alt="Menu item image"/>
</div>

</body>
</html>
