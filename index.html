    body {
        font-family: 'Cormorant Garamond', serif;
        overflow-x: hidden;
        background: #0a0a0a;
    }

    .landing-section {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
    }

    .video-background {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
    }

    .video-background video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.4;
    }

    .video-background::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #0a0a0a, #3d1414, #1a0a0a, #2d1515);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        opacity: 1;
        transition: opacity 0.5s;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, 
            rgba(10, 10, 10, 0.85) 0%, 
            rgba(61, 20, 20, 0.75) 50%, 
            rgba(10, 10, 10, 0.85) 100%);
        z-index: 1;
    }

    .container {
        position: relative;
        z-index: 2;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 2rem;
    }

    .logo-section {
        text-align: center;
        animation: fadeInDown 1.5s ease-out;
    }

    .logo {
        font-family: 'Playfair Display', serif;
        font-size: 5rem;
        font-weight: 900;
        color: #d4af37;
        text-transform: uppercase;
        letter-spacing: 0.3rem;
        margin-bottom: 0.5rem;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .subtitle {
        font-size: 1.8rem;
        color: #f5e6d3;
        letter-spacing: 0.5rem;
        font-weight: 300;
        margin-bottom: 1rem;
        opacity: 0.9;
    }

    .tagline {
        font-size: 1.3rem;
        color: #c9a961;
        font-style: italic;
        margin-top: 1rem;
        opacity: 0.8;
    }

    .divider {
        width: 200px;
        height: 2px;
        background: linear-gradient(90deg, 
            transparent, 
            #d4af37, 
            #8b0000, 
            #d4af37, 
            transparent);
        margin: 2rem auto;
        animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 1; }
    }

    .menu-button {
        margin-top: 3rem;
        padding: 1.2rem 3rem;
        font-size: 1.3rem;
        font-family: 'Cormorant Garamond', serif;
        color: #0a0a0a;
        background: linear-gradient(135deg, #d4af37, #f5e6d3);
        border: 2px solid #d4af37;
        border-radius: 50px;
        cursor: pointer;
        text-transform: uppercase;
        letter-spacing: 0.2rem;
        font-weight: 600;
        transition: all 0.4s ease;
        box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        animation: fadeInUp 1.5s ease-out 0.5s both;
    }

    .menu-button:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
        background: linear-gradient(135deg, #f5e6d3, #d4af37);
        letter-spacing: 0.3rem;
    }

    .decorative-elements {
        position: absolute;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        z-index: 1;
        pointer-events: none;
    }

    .corner-accent {
        position: absolute;
        width: 150px;
        height: 150px;
        border: 2px solid;
        opacity: 0.3;
    }

    .corner-accent.top-left {
        top: 2rem;
        left: 2rem;
        border-right: none;
        border-bottom: none;
        border-color: #d4af37;
        animation: fadeIn 2s ease-out;
    }

    .corner-accent.top-right {
        top: 2rem;
        right: 2rem;
        border-left: none;
        border-bottom: none;
        border-color: #8b0000;
        animation: fadeIn 2s ease-out 0.3s both;
    }

    .corner-accent.bottom-left {
        bottom: 2rem;
        left: 2rem;
        border-right: none;
        border-top: none;
        border-color: #8b0000;
        animation: fadeIn 2s ease-out 0.6s both;
    }

    .corner-accent.bottom-right {
        bottom: 2rem;
        right: 2rem;
        border-left: none;
        border-top: none;
        border-color: #d4af37;
        animation: fadeIn 2s ease-out 0.9s both;
    }

    @keyframes fadeInDown {
        from {
            opacity: 0;
            transform: translateY(-30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(30px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 0.3; }
    }

    .scroll-indicator {
        position: absolute;
        bottom: 3rem;
        left: 50%;
        transform: translateX(-50%);
        z-index: 3;
        animation: bounce 2s infinite;
        cursor: pointer;
    }

    .scroll-indicator::after {
        content: '↓';
        font-size: 2rem;
        color: #d4af37;
        opacity: 0.7;
    }

    @keyframes bounce {
        0%, 20%, 50%, 80%, 100% {
            transform: translateX(-50%) translateY(0);
        }
        40% {
            transform: translateX(-50%) translateY(-10px);
        }
        60% {
            transform: translateX(-50%) translateY(-5px);
        }
    }

    :root{
        --bg-black: #0b0b0b;
        --gold: #caa84a;
        --maroon: #7a1921;
        --muted: #bfb6b0;
        --paper: #fffaf5;
        --accent-deep: #800020;
    }

    .menu-content {
        display: none;
        font-family: 'Inter', system-ui, Arial, Helvetica, sans-serif;
        position: relative;
        opacity: 0;
        transform: translateY(20px);
        transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .menu-content.show {
        display: block;
        animation: fadeInMenu 0.8s ease forwards;
    }

    @keyframes fadeInMenu {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .menu-content::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #0a0a0a, #3d1414, #1a0a0a, #2d1515);
        background-size: 400% 400%;
        animation: gradientShift 15s ease infinite;
        z-index: -2;
    }

    .menu-content::after {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(10, 10, 10, 0.7);
        z-index: -1;
    }

    /* Floating Image Marquee */
    .floating-marquee {
        position: sticky;
        top: 0;
        width: 100%;
        height: 120px;
        overflow: hidden;
        background: linear-gradient(90deg, rgba(10,10,10,0.95), rgba(61,20,20,0.9), rgba(10,10,10,0.95));
        border-bottom: 3px solid #d4af37;
        z-index: 50;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .marquee-track {
        display: flex;
        align-items: center;
        height: 100%;
        animation: scroll-left 40s linear infinite;
        gap: 20px;
        padding: 10px 0;
    }

    @keyframes scroll-left {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
    }

    .marquee-item {
        flex-shrink: 0;
        width: 150px;
        height: 100px;
        border-radius: 15px;
        overflow: hidden;
        border: 3px solid #d4af37;
        box-shadow: 0 5px 15px rgba(212,175,55,0.3);
        transition: transform 0.3s ease;
        cursor: pointer;
    }

    .marquee-item:hover {
        transform: scale(1.1) translateY(-5px);
        border-color: #ffd700;
        box-shadow: 0 8px 25px rgba(212,175,55,0.6);
    }

    .marquee-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .category {

    .modal { 
        display:none; 
        position:fixed; 
        z-index:100; 
        left:0; 
        top:0; 
        width:100%; 
        height:100%; 
        background:rgba(0,0,0,0.85);

    // Collect all images for marquee
    function initMarquee() {
        const allImages = [];
        for(const category in menuData) {
            menuData[category].forEach(item => {
                if(item.image) {
                    allImages.push(item.image);
                }
            });
        }

        // Shuffle array randomly
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        const shuffledImages = shuffle([...allImages]);
        const marqueeTrack = document.getElementById('marqueeTrack');
        
        // Create two sets for seamless loop
        const imagesToShow = [...shuffledImages, ...shuffledImages];
        
        imagesToShow.forEach(imgSrc => {
            const item = document.createElement('div');
            item.className = 'marquee-item';
            item.innerHTML = `<img src="${imgSrc}" alt="Menu Item">`;
            item.onclick = () => openImageModal(imgSrc);
            marqueeTrack.appendChild(item);
        });
    }

    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    function renderMenu(menuData){
        const menuContainer = document.getElementById("menu-container");
        menuContainer.innerHTML = "";
        for(const category in menuData){
            const catDiv = document.createElement("div");
            catDiv.classList.add("category");
            catDiv.textContent = category;
            const itemsDiv = document.createElement("div");
            itemsDiv.classList.add("items-container");
            
            menuData[category].forEach(item => {
                const itemDiv = document.createElement("div");
                itemDiv.classList.add("menu-item");
                
                if(item.image){
                    const img = document.createElement("img");
                    img.src = item.image;
                    img.alt = item.name;
                    img.classList.add("menu-img");
                    
                    if(isTouch){
                        img.onclick = () => openMobileImageModal(item.image);
                    } else {
                        img.addEventListener('mousemove', (e) => showHoverPreview(e, item.image));
                        img.addEventListener('mouseleave', hideHoverPreview);
                        img.onclick = () => openImageModal(item.image);
                    }
                    
                    itemDiv.appendChild(img);
                }
                
                const nameDiv = document.createElement("div");
                nameDiv.classList.add("menu-item-name");
                nameDiv.textContent = item.name;
                if(item.allergens){
                    item.allergens.forEach(a => {
                        const span = document.createElement("span");
                        span.classList.add("allergen");
                        span.textContent = allergens[a] || a;
                        nameDiv.appendChild(span);
                    });
                }
                itemDiv.appendChild(nameDiv);
                
                const priceDiv = document.createElement("div");
                priceDiv.textContent = item.price;
                priceDiv.style.fontWeight = "bold";
                itemDiv.appendChild(priceDiv);
                
                itemDiv.onclick = (e) => {
                    if(e.target.tagName !== "IMG") openModal(item);
                };
                
                itemsDiv.appendChild(itemDiv);
            });
            
            catDiv.onclick = () => {
                const visible = itemsDiv.style.display === "flex";
                itemsDiv.style.display = visible ? "none" : "flex";
                itemsDiv.style.flexDirection = "column";
                if(!visible) {
                    itemsDiv.classList.add('opening');
                    setTimeout(() => itemsDiv.classList.remove('opening'), 400);
                }
            };
            
            menuContainer.appendChild(catDiv);
            menuContainer.appendChild(itemsDiv);
        }
    }

    renderMenu(menuData);

    let hoverPreview = document.createElement("img");
    hoverPreview.id = "hover-preview";
    document.body.appendChild(hoverPreview);

    function showHoverPreview(e, imgSrc) {
        if(!isTouch) {
            hoverPreview.src = imgSrc;
            hoverPreview.style.display = "block";
            hoverPreview.style.opacity = 1;
            hoverPreview.style.top = (e.clientY + 15) + "px";
            hoverPreview.style.left = (e.clientX + 15) + "px";
        }
    }

    function hideHoverPreview() {
        hoverPreview.style.opacity = 0;
        setTimeout(() => hoverPreview.style.display = "none", 200);
    }

    document.getElementById("searchBar").addEventListener("input", function(){
        const val = this.value.toLowerCase();
        const categories = document.getElementsByClassName("category");
        const items = document.getElementsByClassName("items-container");
        
        Array.from(categories).forEach((catDiv, i) => {
            const itemDivs = items[i].children;
            let hasMatch = false;
            
            Array.from(itemDivs).forEach(item => {
                const name = item.querySelector(".menu-item-name").textContent.toLowerCase();
                const match = name.includes(val);
                item.style.display = match ? "flex" : "none";
                if(match) hasMatch = true;
            });
            
            catDiv.style.display = hasMatch ? "block" : "none";
            items[i].style.display = hasMatch ? "flex" : "none";
            items[i].style.flexDirection = "column";
        });
    });

    function openModal(item){
        document.getElementById("modal-name").textContent = item.name;
        document.getElementById("modal-price").textContent = item.price;
        document.getElementById("modal-description").textContent = item.description;
        document.getElementById("item-modal").classList.add("show");
    }
    
    function closeModal(){ 
        document.getElementById("item-modal").classList.remove("show"); 
    }
    
    function openImageModal(img){ 
        document.getElementById("zoomed-image").src = img; 
        document.getElementById("image-modal").classList.add("show"); 
    }
    
    function closeImageModal(){ 
        document.getElementById("image-modal").classList.remove("show"); 
    }

    function openMobileImageModal(img){
        document.getElementById("mobile-zoomed-image").src = img;
        document.getElementById("mobile-image-modal").classList.add("show");
    }

    function closeMobileImageModal(){
        document.getElementById("mobile-image-modal").classList.remove("show");
    }

    window.addEventListener('keydown', function(e){
        if(e.key === 'Escape'){
            closeModal(); 
            closeImageModal();
            closeMobileImageModal();
        }
    });
</script>
