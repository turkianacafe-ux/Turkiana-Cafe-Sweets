<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turkiana Café & Sweets — Elevated Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #02040d;
      --text: #f7f7fb;
      --muted: rgba(247, 247, 251, 0.65);
      --accent: #f97316;
      font-family: "Inter", system-ui, sans-serif;
    }
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% -10%, rgba(249, 115, 22, 0.18), transparent 45%), linear-gradient(180deg, #04060f 0%, #010308 100%);
      color: var(--text);
    }
    .page {
      position: relative;
      min-height: 100vh;
      padding-bottom: 80px;
    }
    header {
      text-align: center;
      padding: 60px 24px 30px;
    }
    header h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(2.4rem, 4vw, 3.2rem);
      letter-spacing: 0.12em;
      margin: 0;
      background: linear-gradient(130deg, #f97316, #facc15, #caa84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      margin: 12px auto 0;
      max-width: 720px;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .search-bar {
      margin: 0 auto;
      max-width: 1200px;
      padding: 0 20px 20px;
    }
    .search-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: none;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      transition: box-shadow 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
    }
    .categories-container {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2, 4, 13, 0.9);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 16px 0;
    }
    .categories-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .categories-scroll::-webkit-scrollbar {
      height: 4px;
    }
    .categories-scroll::-webkit-scrollbar-thumb {
      background: rgba(249, 115, 22, 0.6);
      border-radius: 10px;
    }
    .category-pill {
      flex-shrink: 0;
      padding: 10px 20px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.25s ease;
      white-space: nowrap;
    }
    .category-pill:hover {
      border-color: rgba(249, 115, 22, 0.6);
      color: #fff;
    }
    .category-pill.active {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.65), rgba(202, 168, 74, 0.4));
      border-color: rgba(249, 115, 22, 1);
      color: #fff;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.35);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      gap: 40px;
    }
    .favorites-section {
      border-radius: 20px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .favorites-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .favorites-title h2 {
      margin: 0;
      font-size: 1.4rem;
      font-family: "Playfair Display", serif;
      letter-spacing: 0.08em;
    }
    .favorites-count {
      font-size: 0.9rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.7);
    }
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }
    .favorites-empty {
      font-size: 0.9rem;
      color: var(--muted);
    }
    .section-title {
      margin-bottom: 30px;
    }
    .section-title h2 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      margin: 0;
      letter-spacing: 0.08em;
      color: #fff;
    }
    .section-title p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    .dish-card {
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: linear-gradient(180deg, rgba(10, 13, 28, 0.95), rgba(4, 6, 15, 0.95));
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }
    .dish-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border-color: rgba(249, 115, 22, 0.5);
    }
    .dish-image {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: rgba(0, 0, 0, 0.15);
      transition: transform 0.3s ease;
    }
    .dish-card:hover .dish-image {
      transform: scale(1.05);
    }
    .dish-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .dish-name {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .dish-desc {
      margin: 0;
      font-size: 0.85rem;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.7);
      min-height: 56px;
    }
    .dish-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dish-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffcc7d;
    }
    .dish-cal {
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.5);
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }
    .dish-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .dish-tag {
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 5px 10px;
      border-radius: 999px;
      border: 1px solid rgba(249, 115, 22, 0.3);
      color: rgba(255, 255, 255, 0.7);
      background: rgba(249, 115, 22, 0.12);
    }
    .badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      background: linear-gradient(130deg, rgba(249, 115, 22, 0.95), rgba(202, 168, 74, 0.8));
      color: #fff;
      box-shadow: 0 10px 25px rgba(249, 115, 22, 0.4);
      animation: badgePulse 3s ease-in-out infinite;
    }
    .favorite-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: transform 0.3s ease, background 0.3s ease, color 0.3s ease;
    }
    .favorite-toggle:hover {
      transform: scale(1.1);
      background: rgba(255, 255, 255, 0.2);
    }
    .favorite-toggle.active {
      background: rgba(249, 115, 22, 0.95);
      color: #04050b;
      border-color: rgba(249, 115, 22, 0.9);
    }
    .favorites-card {
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(255, 255, 255, 0.03);
      display: grid;
      gap: 10px;
      padding: 12px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }
    .favorites-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.2);
    }
    .favorites-card h3 {
      margin: 0;
      font-size: 1rem;
    }
    .favorites-card p {
      margin: 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.65);
    }
    .favorites-card span {
      font-size: 0.85rem;
      font-weight: 600;
      color: #ffcc7d;
    }
    .no-results {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .no-results strong {
      display: block;
      font-size: 1.2rem;
      margin-bottom: 10px;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(1, 1, 5, 0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 120;
      padding: 20px;
    }
    .modal-backdrop.active {
      display: flex;
    }
    .modal-card {
      width: min(920px, 100%);
      border-radius: 20px;
      overflow: hidden;
      background: rgba(8, 12, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
      animation: pop 0.35s ease;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      position: sticky;
      top: 0;
      background: rgba(8, 12, 24, 0.98);
      z-index: 12;
    }
    .modal-header h3 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.8rem;
      background: linear-gradient(120deg, #f97316, #caa84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-header button {
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 1.7rem;
      cursor: pointer;
      line-height: 1;
    }
    .modal-body {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 0;
    }
    .modal-body img {
      width: 100%;
      height: 100%;
      min-height: 320px;
      object-fit: cover;
    }
    .modal-info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(0, 0, 0, 0.25));
    }
    .modal-info p {
      margin: 0;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
    }
    .modal-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.8rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.65);
    }
    .bean-selector {
      margin-top: 6px;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid rgba(249, 115, 22, 0.5);
      background: rgba(249, 115, 22, 0.1);
    }
    .bean-selector .bean-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }
    .bean-option {
      border-radius: 12px;
      padding: 6px 14px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s ease;
    }
    .bean-option.selected {
      background: #fff;
      color: #04050b;
      border-color: rgba(255, 255, 255, 0.6);
    }
    .modal-footer {
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding: 18px 24px;
      text-align: right;
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(0, 0, 0, 0.25);
    }
    .modal-footer strong {
      color: #ffcc7d;
      font-size: 1.2rem;
    }
    footer {
      padding: 40px 20px;
      text-align: center;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.9rem;
    }
    @keyframes pop {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.95);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes badgePulse {
      0% {
        transform: scale(0.95);
        box-shadow: 0 10px 22px rgba(249, 115, 22, 0.4);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 10px 32px rgba(249, 115, 22, 0.6);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 10px 22px rgba(249, 115, 22, 0.4);
      }
    }
    @media (max-width: 768px) {
      .search-bar {
        padding: 0 16px 20px;
      }
      .categories-scroll {
        padding: 0 16px;
      }
      main {
        padding: 30px 16px;
      }
      .modal-body {
        grid-template-columns: 1fr;
      }
      .favorite-toggle {
        bottom: 14px;
        right: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <h1>Turkiana Café & Sweets</h1>
      <p>Curated bites, balanced pairings, and sensory storytelling inspired by Turkish hospitality.</p>
    </header>

    <div class="search-bar">
      <input id="searchInput" class="search-input" type="search" placeholder="Search dishes, flavors, or ingredients..." />
    </div>

    <div class="categories-container">
      <div class="categories-scroll" id="categoriesScroll"></div>
    </div>

    <main id="mainContent">
      <section class="favorites-section" id="favoritesSection">
        <div class="favorites-title">
          <h2>Favorites</h2>
          <span class="favorites-count" id="favoritesCount">0 ITEMS</span>
        </div>
        <div class="favorites-grid" id="favoritesGrid"></div>
      </section>
    </main>

    <footer>Experience the balance of savory bites and sweet finishes at Turkiana Café & Sweets.</footer>
  </div>

  <div id="imageModal" class="modal-backdrop" aria-hidden="true">
    <div class="modal-card" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h3 id="modalTitle"></h3>
        <button aria-label="Close modal">&times;</button>
      </div>
      <div class="modal-body">
        <img id="modalImage" src="" alt="" loading="lazy" />
        <div class="modal-info">
          <p id="modalDescEn"></p>
          <p id="modalDescAr"></p>
          <div class="modal-meta">
            <span id="modalCalories"></span>
            <span id="modalDietary"></span>
          </div>
          <div id="beanSelector" class="bean-selector" style="display: none;">
            <div style="font-size: 0.75rem; letter-spacing: 0.3em; text-transform: uppercase;">Choose bean</div>
            <div class="bean-options" id="beanOptions"></div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <span id="selectedBeanDisplay" style="display: none; margin-right: 16px;"></span>
        Price · <strong id="modalPrice"></strong> QAR
      </div>
    </div>
  </div>

    const searchInput = document.getElementById("searchInput");
    const categoriesScroll = document.getElementById("categoriesScroll");
    const mainContent = document.getElementById("mainContent");
    const favoritesGrid = document.getElementById("favoritesGrid");
    const favoritesCount = document.getElementById("favoritesCount");
    const modal = document.getElementById("imageModal");
    const modalTitle = document.getElementById("modalTitle");
    const modalImage = document.getElementById("modalImage");
    const modalDescEn = document.getElementById("modalDescEn");
    const modalDescAr = document.getElementById("modalDescAr");
    const modalPrice = document.getElementById("modalPrice");
    const modalCalories = document.getElementById("modalCalories");
    const modalDietary = document.getElementById("modalDietary");
    const beanSelector = document.getElementById("beanSelector");
    const beanOptions = document.getElementById("beanOptions");
    const selectedBeanDisplay = document.getElementById("selectedBeanDisplay");
    const modalCloseBtn = modal.querySelector(".modal-header button");
    let activeCategory = persistedState.category || null;
    let searchQuery = persistedState.search || "";
    let favorites = new Set(persistedFavorites);
    let currentBean = null;
    searchInput.value = searchQuery;
    const persistState = () => {
      localStorage.setItem(stateKey, JSON.stringify({ category: activeCategory, search: searchQuery }));
    };
    const persistFavorites = () => {
      localStorage.setItem(favoritesKey, JSON.stringify(Array.from(favorites)));
    };
    const getItemById = (id) => {
      for (const section of menuData) {
        const match = section.items.find(item => item.id === id);
        if (match) return match;
      }
      return null;
    };
    const renderFavoritesPanel = () => {
      const favoriteItems = Array.from(favorites).map(getItemById).filter(Boolean);
      favoritesCount.textContent = `${favoriteItems.length} ITEMS`;
      favoritesGrid.innerHTML = "";
      if (!favoriteItems.length) {
        favoritesGrid.innerHTML = '<p class="favorites-empty">Tap the heart icon on any dish to add it to favorites for quick access.</p>';
        return;
      }
      favoriteItems.forEach(item => {
        const favCard = document.createElement("article");
        favCard.className = "favorites-card";
        favCard.innerHTML = `
          <img src="${item.image}" alt="${item.enName}" loading="lazy" />
          <h3>${item.enName}</h3>
          <p>${item.descriptionEn}</p>
          <span>QAR ${item.priceNum}</span>
        `;
        favCard.addEventListener("click", () => openModal(item));
        favoritesGrid.appendChild(favCard);
      });
    };
    const renderCategories = () => {
      categoriesScroll.innerHTML = "";
      const allPill = document.createElement("button");
      allPill.className = "category-pill";
      allPill.innerText = "✨ All";
      if (!activeCategory) allPill.classList.add("active");
      allPill.addEventListener("click", () => {
        activeCategory = null;
        persistState();
        renderCategories();
        renderContent();
      });
      categoriesScroll.appendChild(allPill);
      menuData.forEach(section => {
        const pill = document.createElement("button");
        pill.className = "category-pill";
        if (activeCategory === section.category) pill.classList.add("active");
        pill.innerText = `${section.icon} ${section.category}`;
        pill.addEventListener("click", () => {
          activeCategory = section.category;
          persistState();
          renderCategories();
          renderContent();
          categoriesScroll.scrollTo({ left: pill.offsetLeft - 30, behavior: "smooth" });
        });
        categoriesScroll.appendChild(pill);
      });
    };
    const createFavoriteToggle = (item) => {
      const toggle = document.createElement("button");
      toggle.type = "button";
      toggle.className = `favorite-toggle ${favorites.has(item.id) ? "active" : ""}`;
      toggle.innerHTML = "❤";
      toggle.addEventListener("click", (event) => {
        event.stopPropagation();
        if (favorites.has(item.id)) {
          favorites.delete(item.id);
        } else {
          favorites.add(item.id);
        }
        persistFavorites();
        renderFavoritesPanel();
        renderContent();
      });
      return toggle;
    };
    const renderContent = () => {
      const existingFavoritesSection = document.getElementById("favoritesSection");
      if (!existingFavoritesSection) return;
      const filteredData = activeCategory ? menuData.filter(section => section.category === activeCategory) : menuData;
      const query = searchQuery.toLowerCase().trim();
      const sectionsWithResults = [];
      filteredData.forEach(section => {
        const filteredItems = section.items.filter(item => {
          const haystack = `${item.enName} ${item.descriptionEn} ${item.arName}`.toLowerCase();
          return haystack.includes(query);
        });
        if (filteredItems.length) {
          sectionsWithResults.push({ ...section, items: filteredItems });
        }
      });
      const existingSections = Array.from(mainContent.querySelectorAll(".menu-section"));
      existingSections.forEach(section => section.remove());
      if (!sectionsWithResults.length) {
        const noResults = document.createElement("div");
        noResults.className = "no-results";
        noResults.innerHTML = "<strong>No items found</strong><p>Try adjusting your search term or explore another section.</p>";
        mainContent.appendChild(noResults);
        return;
      }
      sectionsWithResults.forEach(section => {
        const sectionWrapper = document.createElement("section");
        sectionWrapper.className = "menu-section";
        const titleDiv = document.createElement("div");
        titleDiv.className = "section-title";
        titleDiv.innerHTML = `<h2>${section.category}</h2><p>${section.arCategory}</p>`;
        sectionWrapper.appendChild(titleDiv);
        const gridDiv = document.createElement("div");
        gridDiv.className = "items-grid";
        section.items.forEach(item => {
          const card = document.createElement("article");
          card.className = "dish-card";
          card.innerHTML = `
            <img src="${item.image}" alt="${item.enName}" class="dish-image" loading="lazy" />
            ${item.popular ? `<div class="badge">Chef’s Pick</div>` : ""}
            <div class="dish-info">
              <h3 class="dish-name">${item.enName}</h3>
              <p class="dish-desc">${item.descriptionEn}</p>
              <div class="dish-footer">
                <span class="dish-price">QAR ${item.priceNum}</span>
                <span class="dish-cal">${item.calories}</span>
              </div>
              <div class="dish-tags">
                ${item.dietary.map(tag => `<span class="dish-tag">${tag.replace(/-/g, " ")}</span>`).join("")}
              </div>
            </div>
          `;
          const favToggle = createFavoriteToggle(item);
          card.appendChild(favToggle);
          card.addEventListener("click", () => openModal(item));
          gridDiv.appendChild(card);
        });
        sectionWrapper.appendChild(gridDiv);
        mainContent.appendChild(sectionWrapper);
      });
    };
    const openModal = (item) => {
      modalTitle.textContent = item.enName;
      modalImage.src = item.image;
      modalImage.alt = item.enName;
      modalDescEn.textContent = item.descriptionEn;
      modalDescAr.textContent = item.descriptionAr;
      modalPrice.textContent = item.priceNum;
      modalCalories.textContent = item.calories;
      modalDietary.textContent = item.dietary.length ? item.dietary.join(" • ") : "House selection";
      if (item.hasBeansSelector && item.beans) {
        beanSelector.style.display = "block";
        beanOptions.innerHTML = item.beans.map((bean, index) => `<button class="bean-option ${index === 0 ? "selected" : ""}" data-bean="${bean}">${bean}</button>`).join("");
        currentBean = item.beans[0];
        selectedBeanDisplay.textContent = `Selected: ${currentBean}`;
        selectedBeanDisplay.style.display = "inline";
        beanOptions.querySelectorAll(".bean-option").forEach(btn => {
          btn.addEventListener("click", () => {
            beanOptions.querySelectorAll(".bean-option").forEach(inner => inner.classList.remove("selected"));
            btn.classList.add("selected");
            currentBean = btn.dataset.bean;
            selectedBeanDisplay.textContent = `Selected: ${currentBean}`;
          });
        });
      } else {
        beanSelector.style.display = "none";
        selectedBeanDisplay.style.display = "none";
      }
      modal.setAttribute("aria-hidden", "false");
      modal.classList.add("active");
      document.body.style.overflow = "hidden";
    };
    const closeModal = () => {
      modal.setAttribute("aria-hidden", "true");
      modal.classList.remove("active");
      document.body.style.overflow = "";
    };
    searchInput.addEventListener("input", (event) => {
      searchQuery = event.target.value;
      persistState();
      renderContent();
    });
    modalCloseBtn.addEventListener("click", closeModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("active")) closeModal();
    });
    renderCategories();
    renderFavoritesPanel();
    renderContent();
  </script>
