<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Turkiana Café & Sweets — Menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #02040d;
      --text: #f7f7fb;
      --muted: rgba(247, 247, 251, 0.65);
      --accent: #f97316;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, sans-serif;
      background: linear-gradient(180deg, #04060f 0%, #010308 100%);
      color: var(--text);
      min-height: 100vh;
    }
    .page { padding-bottom: 40px; }
    header {
      text-align: center;
      padding: 60px 24px 30px;
    }
    header h1 {
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 4vw, 3rem);
      margin: 0;
      background: linear-gradient(130deg, #f97316, #facc15, #caa84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    header p {
      margin: 12px auto 0;
      max-width: 600px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .search-bar {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px 20px;
    }
    .search-input {
      width: 100%;
      padding: 14px 18px;
      border-radius: 16px;
      border: none;
      background: rgba(255, 255, 255, 0.07);
      color: var(--text);
      font-size: 1rem;
    }
    .search-input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }
    .search-input:focus {
      outline: none;
      box-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
    }
    .filters-bar {
      max-width: 1200px;
      margin: 0 auto 20px;
      padding: 0 20px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.03);
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.25s;
    }
    .filter-btn:hover {
      background: rgba(255, 255, 255, 0.08);
    }
    .filter-btn.active {
      background: rgba(249, 115, 22, 0.3);
      border-color: rgba(249, 115, 22, 0.8);
      color: #fff;
    }
    .favorites-toggle {
      margin-left: auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .favorites-toggle:hover {
      background: rgba(249, 115, 22, 0.2);
    }
    .favorites-toggle.active {
      background: rgba(249, 115, 22, 0.4);
      border-color: rgba(249, 115, 22, 1);
      color: #fff;
    }
    .categories-container {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(2, 4, 13, 0.95);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px 0;
    }
    .categories-scroll {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding: 0 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .categories-scroll::-webkit-scrollbar { height: 4px; }
    .categories-scroll::-webkit-scrollbar-thumb { background: rgba(249, 115, 22, 0.6); border-radius: 10px; }
    .category-pill {
      flex-shrink: 0;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.04);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.25s;
      white-space: nowrap;
    }
    .category-pill.active {
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.8), rgba(202, 168, 74, 0.5));
      border-color: rgba(249, 115, 22, 1);
      color: #fff;
      box-shadow: 0 8px 20px rgba(249, 115, 22, 0.3);
    }
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
    }
    .section { margin-bottom: 50px; }
    .section h2 {
      font-family: "Playfair Display", serif;
      font-size: 2rem;
      margin: 0 0 20px 0;
      color: #fff;
    }
    .section p {
      margin: 0 0 25px 0;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }
    .dish-card {
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(10, 13, 28, 0.8);
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }
    .dish-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-color: rgba(249, 115, 22, 0.5);
    }
    .dish-image-wrapper {
      position: relative;
      overflow: hidden;
      height: 180px;
      background: rgba(0, 0, 0, 0.2);
    }
    .dish-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .dish-card:hover .dish-image { transform: scale(1.08); }
    .badge {
      position: absolute;
      top: 8px;
      right: 8px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.65rem;
      background: rgba(249, 115, 22, 0.9);
      color: #fff;
      animation: pulse 2s infinite;
    }
    .dish-info {
      padding: 14px;
      text-align: center;
    }
    .dish-name {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      line-height: 1.3;
    }
    .favorite-toggle {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.5);
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.9);
      cursor: pointer;
      font-size: 1.1rem;
      transition: all 0.3s;
      display: grid;
      place-items: center;
    }
    .favorite-toggle:hover {
      transform: scale(1.15);
      background: rgba(255, 255, 255, 0.2);
    }
    .favorite-toggle.active {
      background: rgba(249, 115, 22, 0.9);
      color: #fff;
      border-color: rgba(249, 115, 22, 1);
      animation: heartbeat 0.3s;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-backdrop.active { display: flex; }
    .modal-card {
      width: min(900px, 100%);
      border-radius: 16px;
      background: rgba(8, 12, 24, 0.98);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      animation: pop 0.3s ease;
    }
    .modal-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .modal-header h3 {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: 1.6rem;
      background: linear-gradient(120deg, #f97316, #caa84a);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .modal-header button {
      background: none;
      border: none;
      color: var(--text);
      font-size: 1.8rem;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .modal-header button:hover {
      transform: scale(1.1);
    }
    .modal-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      overflow-y: auto;
      flex: 1;
      max-height: calc(90vh - 100px);
    }
    .modal-image { width: 100%; height: 100%; object-fit: cover; }
    .modal-info {
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.3));
    }
    .modal-info h4 {
      margin: 0;
      font-size: 0.9rem;
      color: rgba(255, 255, 255, 0.7);
    }
    .modal-info p {
      margin: 0;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
    }
    .modal-meta {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.6);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .beans-selector {
      margin-top: 12px;
      padding: 16px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .beans-selector h4 {
      margin: 0 0 12px 0;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.9);
    }
    .beans-options {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .bean-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bean-btn:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .bean-btn.selected {
      background: rgba(249, 115, 22, 0.4);
      border-color: rgba(249, 115, 22, 1);
      color: #fff;
    }
    .modal-footer {
      padding: 16px 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.3);
      text-align: right;
    }
    .modal-footer span { font-size: 1rem; color: rgba(255, 255, 255, 0.8); }
    .modal-footer strong { color: #ffcc7d; font-size: 1.3rem; }
    .no-results {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @media (max-width: 768px) {
      .modal-body { grid-template-columns: 1fr; }
      .items-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
      .filters-bar { justify-content: center; }
      .favorites-toggle { margin-left: 0; }
    }
  </style>
</head>

  <div class="page">
    <header>
      <h1>Turkiana Café & Sweets</h1>
      <p>Curated bites and sensory storytelling inspired by Turkish hospitality</p>

          <div class="modal-meta">

          <div id="beansSelector"></div>

      </div>

const categories = [...new Set(allItems.map(item => item.cat))];
let activeCategory = null;
let searchQuery = "";
let favorites = new Set(JSON.parse(localStorage.getItem('turkiana-favorites') || '[]'));
let activeDietaryFilters = new Set();
let showFavoritesOnly = false;
let selectedBean = "Ethiopia";

const saveFavorites = () => {
  localStorage.setItem('turkiana-favorites', JSON.stringify([...favorites]));
  updateFavCount();
};

const updateFavCount = () => {
  document.getElementById('favCount').textContent = favorites.size;
};

const renderCategories = () => {
  categoriesScroll.innerHTML = '';
  const allBtn = document.createElement("button");
  allBtn.className = "category-pill" + (!activeCategory ? " active" : "");
  allBtn.textContent = "✨ All";
  allBtn.onclick = () => { activeCategory = null; updateUI(); };
  categoriesScroll.appendChild(allBtn);

  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "category-pill" + (activeCategory === cat ? " active" : "");
    btn.textContent = cat.split(' ')[0];
    btn.onclick = () => { activeCategory = cat; updateUI(); };
    categoriesScroll.appendChild(btn);
  });
};

const matchesDietaryFilters = (item) => {
  if (activeDietaryFilters.size === 0) return true;
  
  for (let filter of activeDietaryFilters) {
    if (filter === 'vegetarian' && !item.dietary.includes('vegetarian')) return false;
    if (filter === 'vegan' && !item.dietary.includes('vegan')) return false;
    if (filter === 'dairy-free' && !item.dietary.includes('dairy-free')) return false;
    if (filter === 'gluten-free' && !item.dietary.includes('gluten-free')) return false;
  }
  return true;
};

const renderContent = () => {
  mainContent.innerHTML = '';
  
  let filtered = allItems.filter(item => {
    const matchCat = !activeCategory || item.cat === activeCategory;
    const matchSearch = !searchQuery || 
      item.enName.toLowerCase().includes(searchQuery) || 
      item.arName.includes(searchQuery);
    const matchDietary = matchesDietaryFilters(item);
    const matchFav = !showFavoritesOnly || favorites.has(item.id);
    return matchCat && matchSearch && matchDietary && matchFav;
  });

  if (!filtered.length) {
    mainContent.innerHTML = '<div class="no-results"><strong>No items found</strong><p>Try adjusting your filters</p></div>';
    return;
  }

  const grouped = {};
  filtered.forEach(item => {
    if (!grouped[item.cat]) grouped[item.cat] = [];
    grouped[item.cat].push(item);
  });

  Object.entries(grouped).forEach(([cat, items]) => {
    const section = document.createElement("div");
    section.className = "section";
    section.innerHTML = `<h2>${cat}</h2><p style="margin-top: -10px; font-size: 0.8rem; color: rgba(255,255,255,0.5);">Click on any item for details</p>`;
    
    const grid = document.createElement("div");
    grid.className = "items-grid";

    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "dish-card";
      card.innerHTML = `
        <div class="dish-image-wrapper">
          <img src="${item.image}" alt="${item.enName}" class="dish-image"/>
          ${item.popular ? '<div class="badge">Chef\'s Pick</div>' : ''}
        </div>
        <div class="dish-info">
          <h3 class="dish-name">${item.enName}</h3>
        </div>
        <button class="favorite-toggle ${favorites.has(item.id) ? 'active' : ''}">❤</button>
      `;

      card.querySelector(".favorite-toggle").onclick = (e) => {
        e.stopPropagation();
        if (favorites.has(item.id)) {
          favorites.delete(item.id);
        } else {
          favorites.add(item.id);
        }
        saveFavorites();
        card.querySelector(".favorite-toggle").classList.toggle("active");
      };

      card.onclick = () => openModal(item);
      grid.appendChild(card);
    });

    section.appendChild(grid);
    mainContent.appendChild(section);
  });
};

const openModal = (item) => {
  document.getElementById("modalTitle").textContent = item.enName;
  document.getElementById("modalImage").src = item.image;
  document.getElementById("modalDescEn").textContent = item.enDesc;
  document.getElementById("modalDescAr").textContent = item.arDesc;
  document.getElementById("modalPrice").textContent = item.price;
  document.getElementById("modalCalories").textContent = item.calories;
  document.getElementById("modalDietary").textContent = item.dietary.length ? item.dietary.join(" • ") : "House selection";
  
  const beansSelector = document.getElementById("beansSelector");
  if (item.hasBeansSelector && item.beans) {
    beansSelector.innerHTML = `
      <div class="beans-selector">
        <h4>☕ Select Coffee Origin</h4>
        <div class="beans-options"></div>
      </div>
    `;
    const options = beansSelector.querySelector('.beans-options');
    item.beans.forEach(bean => {
      const btn = document.createElement('button');
      btn.className = 'bean-btn' + (bean === selectedBean ? ' selected' : '');
      btn.textContent = bean;
      btn.onclick = () => {
        selectedBean = bean;
        beansSelector.querySelectorAll('.bean-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
      };
      options.appendChild(btn);
    });
  } else {
    beansSelector.innerHTML = '';
  }
  
  modal.classList.add("active");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
};

const closeModal = () => {
  modal.classList.remove("active");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";
};

modal.querySelector(".modal-header button").onclick = closeModal;
modal.onclick = (e) => {
  if (e.target === modal) closeModal();
};

document.getElementById('searchInput').oninput = (e) => {
  searchQuery = e.target.value.toLowerCase();
  renderContent();
};

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.onclick = () => {
    const filter = btn.dataset.filter;
    if (activeDietaryFilters.has(filter)) {
      activeDietaryFilters.delete(filter);
      btn.classList.remove('active');
    } else {
      activeDietaryFilters.add(filter);
      btn.classList.add('active');
    }
    renderContent();
  };
});

document.getElementById('favoritesToggle').onclick = () => {
  showFavoritesOnly = !showFavoritesOnly;
  document.getElementById('favoritesToggle').classList.toggle('active');
  renderContent();
};

const updateUI = () => {
  renderCategories();
  renderContent();
};

updateFavCount();
updateUI();
  </script>

</body>
</html>
