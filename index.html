        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            background: #0a0a0a;
        }

        /* Landing Section */
        .landing-section {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 10, 0.85) 0%, 
                rgba(61, 20, 20, 0.75) 50%, 
                rgba(10, 10, 10, 0.85) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .logo-section {
            text-align: center;
            animation: fadeInDown 1.5s ease-out;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 900;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.8rem;
            color: #f5e6d3;
            letter-spacing: 0.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .tagline {
            font-size: 1.3rem;
            color: #c9a961;
            font-style: italic;
            margin-top: 1rem;
            opacity: 0.8;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                #d4af37, 
                #8b0000, 
                #d4af37, 
                transparent);
            margin: 2rem auto;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .menu-button {
            margin-top: 3rem;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-family: 'Cormorant Garamond', serif;
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f5e6d3);
            border: 2px solid #d4af37;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            font-weight: 600;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            animation: fadeInUp 1.5s ease-out 0.5s both;
            text-decoration: none;
            display: inline-block;
        }

        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #f5e6d3, #d4af37);
            letter-spacing: 0.3rem;
        }

        .decorative-elements {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .corner-accent {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid;
            opacity: 0.3;
        }

        .corner-accent.top-left {
            top: 2rem;
            left: 2rem;
            border-right: none;
            border-bottom: none;
            border-color: #d4af37;
            animation: fadeIn 2s ease-out;
        }

        .corner-accent.top-right {
            top: 2rem;
            right: 2rem;
            border-left: none;
            border-bottom: none;
            border-color: #8b0000;
            animation: fadeIn 2s ease-out 0.3s both;
        }

        .corner-accent.bottom-left {
            bottom: 2rem;
            left: 2rem;
            border-right: none;
            border-top: none;
            border-color: #8b0000;
            animation: fadeIn 2s ease-out 0.6s both;
        }

        .corner-accent.bottom-right {
            bottom: 2rem;
            right: 2rem;
            border-left: none;
            border-top: none;
            border-color: #d4af37;
            animation: fadeIn 2s ease-out 0.9s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.3; }
        }

        .scroll-indicator {
            position: absolute;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            animation: bounce 2s infinite;
            cursor: pointer;
        }

        .scroll-indicator::after {
            content: '↓';
            font-size: 2rem;
            color: #d4af37;
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

            padding:10px 15px; 
            font-size:1em; 
            border-radius:12px;

        }
        
        .category {

            padding:20px; 
            border-radius:15px;

            text-align:center;

            transition: all 0.4s ease; 
        }
        
        .category:hover {

            transform: translateY(-2px);
        }

        // Render menu
        const menuContainer = document.getElementById("menu-container");
        function renderMenu(data){
            menuContainer.innerHTML = "";
            for(const category in data){
                const catDiv = document.createElement("div");
                catDiv.classList.add("category");
                catDiv.textContent = category;
                const itemsDiv = document.createElement("div");
                itemsDiv.classList.add("items-container");

                data[category].forEach(item=>{
                    const itemDiv = document.createElement("div");
                    itemDiv.classList.add("menu-item");

                    if(item.image){
                        const img = document.createElement("img");
                        img.src = item.image;
                        img.alt = item.name;
                        img.classList.add("menu-img");
                        img.onclick = ()=> openImageModal(item.image);
                        itemDiv.appendChild(img);
                    }

                    const nameDiv = document.createElement("div");
                    nameDiv.classList.add("menu-item-name");
                    nameDiv.textContent = item.name;
                    if(item.allergens){
                        item.allergens.forEach(a=>{
                            const span = document.createElement("span");
                            span.classList.add("allergen");
                            span.textContent = allergens[a] || a;
                            nameDiv.appendChild(span);
                        });
                    }
                    itemDiv.appendChild(nameDiv);

                    const priceDiv = document.createElement("div");
                    priceDiv.textContent = item.price;
                    priceDiv.style.fontWeight="bold";
                    itemDiv.appendChild(priceDiv);

                    itemDiv.onclick = (e)=>{
                        if(e.target.tagName!=="IMG"){ openModal(item); }
                    };

                    itemsDiv.appendChild(itemDiv);
                });

                catDiv.onclick = ()=>{ itemsDiv.style.display = itemsDiv.style.display==="flex"?"none":"flex"; itemsDiv.style.flexDirection="column"; }

                menuContainer.appendChild(catDiv);
                menuContainer.appendChild(itemsDiv);
            }
        }

        renderMenu(menuData);

        // Search functionality
        document.getElementById("searchBar").addEventListener("input", function(){
            const val = this.value.toLowerCase();
            for(const category in menuData){
                menuData[category].forEach(item=>{
                    const elem = [...document.getElementsByClassName("menu-item")].find(e=> e.querySelector(".menu-item-name").textContent.includes(item.name));
                    if(elem){ elem.style.display = item.name.toLowerCase().includes(val)? "flex":"none"; }
                });
            }
        });

        // Modal functions
        function openModal(item){
            document.getElementById("modal-name").textContent = item.name;
            document.getElementById("modal-price").textContent = item.price;
            document.getElementById("modal-description").textContent = item.description;
            document.getElementById("item-modal").classList.add("show");
        }
        function closeModal(){ document.getElementById("item-modal").classList.remove("show"); }
        function openImageModal(img){ document.getElementById("zoomed-image").src=img; document.getElementById("image-modal").classList.add("show"); }
        function closeImageModal(){ document.getElementById("image-modal").classList.remove("show"); }

        // Accessibility: close modals with ESC
        window.addEventListener('keydown', function(e){
            if(e.key === 'Escape'){
                closeModal(); closeImageModal();
            }
        });
    </script>
