<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkiana Cafe & Sweets</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cormorant Garamond', serif;
            overflow-x: hidden;
            background: #0a0a0a;
        }

        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.4;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(10, 10, 10, 0.85) 0%, 
                rgba(61, 20, 20, 0.75) 50%, 
                rgba(10, 10, 10, 0.85) 100%);
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .logo-section {
            text-align: center;
            animation: fadeInDown 1.5s ease-out;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 5rem;
            font-weight: 900;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 0.3rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.8rem;
            color: #f5e6d3;
            letter-spacing: 0.5rem;
            font-weight: 300;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .tagline {
            font-size: 1.3rem;
            color: #c9a961;
            font-style: italic;
            margin-top: 1rem;
            opacity: 0.8;
        }

        .divider {
            width: 200px;
            height: 2px;
            background: linear-gradient(90deg, 
                transparent, 
                #d4af37, 
                #8b0000, 
                #d4af37, 
                transparent);
            margin: 2rem auto;
            animation: glow 2s ease-in-out infinite;
        }

        @keyframes glow {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .menu-button {
            margin-top: 3rem;
            padding: 1.2rem 3rem;
            font-size: 1.3rem;
            font-family: 'Cormorant Garamond', serif;
            color: #0a0a0a;
            background: linear-gradient(135deg, #d4af37, #f5e6d3);
            border: 2px solid #d4af37;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            font-weight: 600;
            transition: all 0.4s ease;
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
            animation: fadeInUp 1.5s ease-out 0.5s both;
            text-decoration: none;
            display: inline-block;
        }

        .menu-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #f5e6d3, #d4af37);
            letter-spacing: 0.3rem;
        }

        .decorative-elements {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .corner-accent {
            position: absolute;
            width: 150px;
            height: 150px;
            border: 2px solid;
            opacity: 0.3;
        }

        .corner-accent.top-left {
            top: 2rem;
            left: 2rem;
            border-right: none;
            border-bottom: none;
            border-color: #d4af37;
            animation: fadeIn 2s ease-out;
        }

        .corner-accent.top-right {
            top: 2rem;
            right: 2rem;
            border-left: none;
            border-bottom: none;
            border-color: #8b0000;
            animation: fadeIn 2s ease-out 0.3s both;
        }

        .corner-accent.bottom-left {
            bottom: 2rem;
            left: 2rem;
            border-right: none;
            border-top: none;
            border-color: #8b0000;
            animation: fadeIn 2s ease-out 0.6s both;
        }

        .corner-accent.bottom-right {
            bottom: 2rem;
            right: 2rem;
            border-left: none;
            border-top: none;
            border-color: #d4af37;
            animation: fadeIn 2s ease-out 0.9s both;
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 0.3; }
        }

        .scroll-indicator {
            position: fixed;
            bottom: 3rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            animation: bounce 2s infinite;
        }

        .scroll-indicator::after {
            content: '↓';
            font-size: 2rem;
            color: #d4af37;
            opacity: 0.7;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(-10px);
            }
            60% {
                transform: translateX(-50%) translateY(-5px);
            }
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 3rem;
                letter-spacing: 0.2rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
                letter-spacing: 0.3rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .menu-button {
                padding: 1rem 2rem;
                font-size: 1.1rem;
            }
            
            .corner-accent {
                width: 80px;
                height: 80px;
            }
        }
    </style>
</head>
<body>
    <div class="video-background">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="Video.mp4" type="video/mp4">
        </video>
    </div>
    
    <div class="overlay"></div>
    
    <div class="decorative-elements">
        <div class="corner-accent top-left"></div>
        <div class="corner-accent top-right"></div>
        <div class="corner-accent bottom-left"></div>
        <div class="corner-accent bottom-right"></div>
    </div>
    
    <div class="container">
        <div class="logo-section">
            <h1 class="logo">Turkiana</h1>
            <p class="subtitle">CAFÉ & SWEETS</p>
            <div class="divider"></div>
            <p class="tagline">Where Tradition Meets Elegance</p>
        </div>
        
        <a href="index.html" class="menu-button">Explore Our Menu</a>
    </div>
    
    <div class="scroll-indicator"></div>

    <script>
        // Fallback if video fails to load - create elegant animated gradient
        const video = document.getElementById('bgVideo');
        video.addEventListener('error', function() {
            document.querySelector('.video-background').style.background = 
                'linear-gradient(45deg, #0a0a0a, #3d1414, #1a0a0a, #2d1515)';
            document.querySelector('.video-background').style.backgroundSize = '400% 400%';
            document.querySelector('.video-background').style.animation = 'gradientShift 15s ease infinite';
        });
    </script>
</body>
</html>
